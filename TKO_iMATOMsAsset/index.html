<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iMATOMs Asset — Asset Life-Cycle Management</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg0:#040c1c; --bg1:#071A3E; --bg2:#0D2554; --bg3:#123067; --bg4:#173880; --card:#0D2554;
  --border:#173880; --text:#e6edf7; --text2:#8fa1bd; --text3:#5b6c88;
  --amber:#F59E0B; --amber2:#D97706; --green:#22C55E; --yellow:#EAB308; --red:#EF4444; --sky:#38BDF8; --purple:#A855F7; --orange:#F97316;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai','Segoe UI',sans-serif;background:var(--bg0);color:var(--text);min-height:100vh}
.font-h{font-family:'Orbitron','Noto Sans Thai',sans-serif}
#login-gate{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:10px}
#app-shell{display:none}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--bg1);position:sticky;top:0;z-index:20}
#topbar a{color:var(--text2);text-decoration:none;font-size:13px}
#topbar .brand{font-family:'Orbitron',sans-serif;font-weight:700;font-size:16px;color:var(--amber)}
#topbar .actions{display:flex;gap:10px;align-items:center}
.btn{cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--text);padding:6px 12px;border-radius:8px;font-size:13px}
.btn:hover{border-color:var(--amber)}
.btn-pri{background:var(--amber);color:#1a1200;border-color:var(--amber);font-weight:700}
.btn-sm{padding:4px 9px;font-size:12px}
#layout{display:flex;min-height:calc(100vh - 48px)}
#sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--border);background:var(--bg1);padding:14px 10px}
#sidebar .item{padding:10px 12px;border-radius:8px;font-size:13.5px;color:var(--text2);cursor:pointer;margin-bottom:4px;display:flex;align-items:center;gap:8px}
#sidebar .item.active{background:rgba(245,158,11,.12);color:var(--amber);font-weight:700}
#sidebar .item:hover{background:var(--bg2)}
#main{flex:1;padding:20px;overflow-x:auto}
h2{font-size:19px;margin-bottom:4px}
.sub{color:var(--text2);font-size:13px;margin-bottom:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{padding:7px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12.5px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accentc,var(--amber))}
.kpi-card .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.kpi-card .val{font-family:'Orbitron',sans-serif;font-size:22px;margin-top:4px}
.kpi-card .sub2{font-size:11.5px;color:var(--text3);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left}
th{color:var(--text3);font-weight:600;font-size:11px;text-transform:uppercase}
tr:hover td{background:rgba(255,255,255,.02)}
.chip,.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px;border:1px solid currentColor}
.chip-green,.badge-green{color:var(--green)} .chip-red,.badge-red{color:var(--red)} .chip-amber,.badge-amber{color:var(--amber)} .chip-yellow,.badge-yellow{color:var(--yellow)} .chip-sky,.badge-blue{color:var(--sky)} .chip-teal,.badge-teal{color:#2DD4BF} .chip-orange,.badge-orange{color:var(--orange)} .chip-gray,.badge-gray{color:var(--text3)}
.tag{background:var(--bg4);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-family:monospace;font-size:11.5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.card-sm{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px}
.metric-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--border)}
.metric-row:last-child{border-bottom:none}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .field{flex:1;min-width:130px}
.row3 .field{flex:1;min-width:100px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px}
.modal{background:var(--bg1);border:1px solid var(--border);border-radius:12px;padding:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal.modal-lg{max-width:680px}
.modal h3{margin-bottom:14px}
.modal-tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.modal-tabs .mt-item{padding:8px 12px;font-size:12.5px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent}
.modal-tabs .mt-item.active{color:var(--amber);border-bottom-color:var(--amber);font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--amber);padding:10px 18px;border-radius:8px;font-size:13px;z-index:200}
.bar-track{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden;margin-top:6px}
.bar-fill{height:100%}
.progress{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.progress-fill{height:100%}
.empty{text-align:center;padding:30px;color:var(--text3);font-size:13px}
a.tap{cursor:pointer}
.lc-bar{display:flex;gap:6px;margin:14px 0}
.lc-step{flex:1;padding:10px 6px;text-align:center;border-radius:8px;font-size:11.5px;font-weight:700;border:1px solid var(--border)}
.lc-step.lc-green{background:rgba(34,197,94,.14);color:var(--green);border-color:var(--green)}
.lc-step.lc-yellow{background:rgba(234,179,8,.14);color:var(--yellow);border-color:var(--yellow)}
.lc-step.lc-gray{background:var(--bg2);color:var(--text3)}
.lc-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.qr-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;gap:14px}
.qr-box{background:#fff;padding:8px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
@media print{ #topbar,#sidebar,.toolbar,.btn{display:none !important} #main{padding:0} }

<body>

<div id="login-gate">
  <div class="font-h" style="font-size:22px;color:var(--amber)">🏷️ iMATOMs Asset</div>
  <div style="color:var(--text2);font-size:13px">กำลังตรวจสอบสิทธิ์การเข้าใช้งาน...</div>
  <a href="/" class="btn" style="margin-top:10px">← กลับสู่หน้า Login</a>
</div>

<div id="app-shell">
  <div id="topbar">
    <div style="display:flex;align-items:center;gap:14px">
      <a href="/">← Hub</a>
      <span class="brand">🏷️ iMATOMs Asset</span>
    </div>
    <div class="actions">
      <span id="userLabel" style="font-size:13px;color:var(--text2)"></span>
      <div class="btn" onclick="toggleLang()" id="langBtn">EN</div>
      <div class="btn" onclick="logout()">Logout</div>
    </div>
  </div>
  <div id="layout">
    <div id="sidebar"></div>
    <div id="main"></div>
  </div>
</div>

<script>
/* ══════════════ Data layer — same generic /api/fm-records/:kind
   backend + same imatoms_jwt SSO token the FM webapp, Reliability
   Module, and Mobile App all already share. No separate login: if
   the user isn't already signed in at the platform level, they're
   bounced back to the root hub to sign in there. ══════════════ */
const RWR_API_BASE = 'https://api.imatomstech.com/api';
function getToken(){ try{ return localStorage.getItem('imatoms_jwt'); }catch(e){ return null; } }
function getUser(){ try{ return JSON.parse(localStorage.getItem('imatoms_user')||'null'); }catch(e){ return null; } }
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const token = getToken();
  if(token) headers['Authorization'] = 'Bearer '+token;
  const res = await fetch(RWR_API_BASE+path, Object.assign({}, opts, {headers}));
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}
async function loadKind(kind){ try{ return await api('/fm-records/'+kind); }catch(e){ return []; } }
async function syncKind(kind, item){ try{ await api('/fm-records/'+kind+'/sync', {method:'POST', body:JSON.stringify({items:[item]})}); }catch(e){} }
async function deleteKind(kind, id){ try{ await api('/fm-records/'+kind+'/'+encodeURIComponent(id), {method:'DELETE'}); }catch(e){} }
async function loadWR(){ try{ return await api('/work-orders'); }catch(e){ return []; } }

const ST = { lang:'th', tab:'overview', assets:[], assetGroups:[], assetInspections:[], wr:[], ppm:[], ma:[], maVisits:[], inv:[], invtx:[],
  formOpen:false, editId:null, afTab:'general',
  grpFormOpen:false, grpEditId:null,
  lcAssetId:null,
  inspModalOpen:false, inspAssetId:null,
  calcOpen:false, calcResult:null,
  qrQ:'', qrDept:'', regQ:'', regStatus:'', regDept:'', regPhase:'',
  loaded:false };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(n){ return '฿'+Math.round(n||0).toLocaleString(); }
function fmtDate(d){ if(!d) return '-'; const dt=new Date(d); return isNaN(dt) ? '-' : dt.toLocaleDateString('th-TH'); }
function toast(msg){
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 2600);
}

/* ── Dept / Type taxonomy (matches Desktop FM Reliability Module) ── */
const DEPTS = ['วิศวกรรม','ผลิต','คุณภาพ','ซ่อมบำรุง','สาธารณูปโภค'];
const ASSET_TYPES = ['เครื่องจักร','ยานพาหนะ','อุปกรณ์ IT','เครื่องมือวัด','อาคาร/โครงสร้าง','อื่นๆ'];
const PHASES = ['Planning','Acquisition','Operation','Maintenance','Disposal','Value Add'];
const PHASE_TH = {Planning:'วางแผน',Acquisition:'จัดหา',Operation:'ใช้งาน',Maintenance:'บำรุงรักษา',Disposal:'จำหน่าย','Value Add':'มูลค่า'};
const PHASE_COLOR = {Planning:'blue',Acquisition:'teal',Operation:'green',Maintenance:'yellow',Disposal:'red'};

/* ── System / Sub-System taxonomy + 2-letter sub-codes (ported from
   Reliability Module's SYS_LIST / SUBSYS_CODE, used for the
   PREFIX-SYS-SUBCODE-seq Asset ID scheme) ── */
const SUBSYS_CODE = {
  AC:{Chiller:'CH',CoolingTower:'CT',AHU:'AH',FCU:'FC',PAU:'PA',SplitAC:'SA','Pump-CHW':'PC','Pump-CW':'PW','VRF-VRV':'VR',ExhaustFan:'EF',VentilationFan:'VF'},
  EE:{MDB:'MD',DistributionBoard:'DB',Transformer:'TF',CapacitorBank:'CB','ATS-STS':'AT',SolarPV:'SP',Inverter:'IV',LVPanel:'LV'},
  EL:{PassengerLift:'PL',ServiceLift:'SL',Escalator:'ES',Dumbwaiter:'DW',CarLift:'CL'},
  FA:{FACP:'FC',SmokeDetector:'SD',HeatDetector:'HD',Sprinkler:'SP',PullStation:'PS',AlarmBell:'AB'},
  FP:{FirePump:'FP',JockeyPump:'JP',SprinklerValve:'SV',FireCabinet:'FC',PortableExtinguisher:'PE','FM200-Gas':'FM'},
  BAS:{Controller:'CT',DDC:'DD',Sensor:'SN',Gateway:'GW',BACnetPanel:'BP',SCADA:'SC'},
  SN:{WaterPump:'WP',PressureTank:'PT',WaterMeter:'WM',SumpPump:'SP',SewagePump:'SG',GreaseTrap:'GT'},
  TR:{Conveyor:'CV',LoadingDock:'LD',Turntable:'TT'},
  WWT:{STP:'ST',AerationTank:'AT',Clarifier:'CL',ChemicalDosing:'CD',UVSystem:'UV'},
  GE:{Generator:'GN',ATS:'AT',UPS:'UP',BatteryBank:'BB',Charger:'CH'},
  CV:{Structure:'ST',Roof:'RF',Waterproof:'WP',Facade:'FC',Road:'RD',Parking:'PK'},
  IT:{Server:'SV',Switch:'SW',Router:'RT',Firewall:'FW',AccessPoint:'AP',CCTVRecorder:'CR',NAS:'NS'},
  SG:{CCTVCamera:'CC',AccessControl:'AC',GuardTour:'GT',Intercom:'IC',BoomGate:'BG'},
  PL:{PoolPump:'PP',FilterSystem:'FS',ChemicalSystem:'CS',Landscaping:'LS',Irrigation:'IR'},
  LT:{EmergencyLight:'EL',ExitSign:'ES',StreetLight:'SL',FloodLight:'FL',PanelBoard:'PB'}
};
const SYS_LIST = Object.keys(SUBSYS_CODE);
function subsysList(sys){ return Object.keys(SUBSYS_CODE[sys]||{}); }
function suggestAssetId(prefix, sys, subsys){
  prefix = (prefix||'AST').toUpperCase().trim() || 'AST';
  if(!sys || !subsys) return '';
  const code = (SUBSYS_CODE[sys]||{})[subsys] || subsys.slice(0,2).toUpperCase();
  const stem = prefix+'-'+sys+'-'+code+'-';
  let max = 0;
  ST.assets.forEach(function(a){
    if(String(a.id||'').indexOf(stem)===0){
      const n = parseInt(String(a.id).slice(stem.length),10);
      if(!isNaN(n) && n>max) max = n;
    }
  });
  const seq = String(max+1).padStart(2,'0');
  return stem+seq;
}

/* ── Asset normalization (ported from Reliability Module's normalizeAsset) ── */
function normalizeAsset(a){
  const buyDate = a.buyDate || a.installDate || null;
  const life = a.life || a.lifeYears || 10;
  const cost = a.cost || 0;
  const salvage = a.salvage || 0;
  const yearsOwned = buyDate ? Math.max(0, (new Date() - new Date(buyDate)) / (365.25*86400000)) : 0;
  const calcNbv = Math.max(salvage, cost - (cost>0 ? (cost-salvage)/life : 0)*yearsOwned);
  const nbv = a.nbv>0 ? a.nbv : Math.round(calcNbv);
  const accDep = a.accDep>0 ? a.accDep : Math.round(cost - nbv);
  const efficiency = a.efficiency!=null ? a.efficiency : (a.eff!=null ? a.eff : 85);
  const location = a.location || [a.building,a.floor,a.zone,a.room].filter(Boolean).join(' / ');
  return Object.assign({}, a, { buyDate, life, cost, nbv, accDep, efficiency, yearsOwned, salvage, location,
    status: a.status || (efficiency>=80?'green':efficiency>=60?'yellow':'red') });
}
function assetsNorm(){ return ST.assets.map(normalizeAsset); }
function statusBadge(s, th){
  const map = { green:['badge-green', th?'ปกติ':'Good'], yellow:['badge-yellow', th?'ควรตรวจสอบ':'Watch'], red:['badge-red', th?'ควรพิจารณา':'Critical'] };
  const x = map[s] || map.green;
  return '<span class="badge '+x[0]+'">'+x[1]+'</span>';
}
function phaseBadge(p){
  const c = PHASE_COLOR[p] || 'gray';
  return '<span class="badge badge-'+c+'">'+(p||'-')+'</span>';
}

/* ── Depreciation calculator (straight-line / declining-balance, ported) ── */
function calcDep(cost, salvage, life, yr, method){
  life = life||10; yr = Math.min(yr, life);
  if(method==='db'){
    let rate = 2/life, bv = cost, accDep = 0;
    for(let i=0;i<yr;i++){ let d = bv*rate; if(bv-d<salvage) d = Math.max(0,bv-salvage); accDep += d; bv -= d; }
    return { accDep: Math.round(accDep), nbv: Math.round(Math.max(bv, salvage)), rate: Math.round((2/life)*1000)/10 };
  }
  const depYr = (cost-salvage)/life;
  const accDep = depYr*yr;
  return { accDep: Math.round(accDep), nbv: Math.round(Math.max(cost-accDep, salvage)), rate: Math.round((1/life)*1000)/10 };
}

/* ── Predictive cross-module metrics (reuse the same formulas already
   proven in PPM/WR/MA/Inventory, rather than re-deriving new ones) ── */
function calcReliabilityPct(){
  const vals = ST.ppm.filter(function(p){ return p.mtbf; }).map(function(p){ return p.mtbf; });
  if(!vals.length) return null;
  const avgMTBF = vals.reduce(function(s,v){ return s+v; },0)/vals.length;
  return Math.round(Math.exp(-8760/avgMTBF)*100*10)/10;
}
function calcMaintainabilityPct(targetHrs){
  targetHrs = targetHrs || 4;
  const closed = ST.wr.filter(function(w){ return w.mttr_hours; });
  if(!closed.length) return null;
  const avgMTTR = closed.reduce(function(s,w){ return s+parseFloat(w.mttr_hours); },0)/closed.length;
  if(!avgMTTR) return null;
  return Math.round((1 - Math.exp(-targetHrs/avgMTTR))*100*10)/10;
}
function calcAvailabilityKN(){
  const groups = ST.assetGroups;
  if(!groups.length) return null;
  const byId = {}; ST.assets.forEach(function(a){ byId[a.id]=a; });
  let sum = 0;
  groups.forEach(function(g){
    const members = (g.assetIds||[]).map(function(id){ return byId[id]; }).filter(Boolean);
    const online = members.filter(function(a){ return (a.online!==false); }).length;
    const k = g.k || 1;
    sum += online>=k ? 100 : Math.round((online/k)*100);
  });
  return Math.round((sum/groups.length)*10)/10;
}
function computeVisitScoreLocal(v){
  const vals = [v.ratingPunctuality,v.ratingQuality,v.ratingResponse,v.ratingCleanliness].map(Number).filter(function(n){ return !isNaN(n); });
  return vals.length ? vals.reduce(function(s,x){ return s+x; },0)/vals.length : null;
}
function calcMAPerformancePct(){
  const scores = ST.maVisits.filter(function(v){ return v.status==='approved'; }).map(computeVisitScoreLocal).filter(function(s){ return s!=null; });
  if(!scores.length) return null;
  const avg = scores.reduce(function(s,v){ return s+v; },0)/scores.length;
  return Math.round((avg/5)*100*10)/10;
}
function calcInventoryAvailabilityPct(){
  const issueTx = ST.invtx.filter(function(t){ return t.type==='issue'; });
  const fulfilled = issueTx.filter(function(t){ return t.fulfilled!==false; }).length;
  const failed = issueTx.filter(function(t){ return t.fulfilled===false; }).length;
  if(!(fulfilled+failed)) return null;
  return Math.round((fulfilled/(fulfilled+failed))*100*10)/10;
}

/* ── Sidebar / nav — order matches the Desktop FM Reliability Module's
   "Asset Life-Cycle Management" submenu (Overview Value Add, Lifecycle
   Tracker, QR Code Assets, Annual Review, Asset ID & Register), with
   our own Predictive Overview dashboard first and Asset Groups (K/N)
   appended as the new redundancy feature. ── */
const NAV = [
  {k:'overview', icon:'📊', th:'ภาพรวมคาดการณ์', en:'Predictive Overview'},
  {k:'valuation', icon:'💰', th:'Overview Value Add', en:'Overview Value Add'},
  {k:'lifecycle', icon:'⏳', th:'Lifecycle Tracker', en:'Lifecycle Tracker'},
  {k:'qr', icon:'🔳', th:'QR Code Assets', en:'QR Code Assets'},
  {k:'review', icon:'🔍', th:'Annual Review', en:'Annual Review'},
  {k:'register', icon:'🗂️', th:'Asset ID & Register', en:'Asset ID & Register'},
  {k:'groups', icon:'🔗', th:'กลุ่มสำรอง (K/N)', en:'Asset Groups (K/N)'},
];
function renderSidebar(){
  const th = ST.lang==='th';
  document.getElementById('sidebar').innerHTML = NAV.map(function(n){
    return '<div class="item'+(ST.tab===n.k?' active':'')+'" onclick="setTab(\''+n.k+'\')">'+n.icon+' '+(th?n.th:n.en)+'</div>';
  }).join('');
}
function setTab(k){ ST.tab = k; render(); }
function toggleLang(){ ST.lang = ST.lang==='th'?'en':'th'; document.getElementById('langBtn').textContent = ST.lang==='th'?'EN':'TH'; render(); }
function logout(){ try{ localStorage.removeItem('imatoms_jwt'); localStorage.removeItem('imatoms_user'); }catch(e){} window.location.href='/'; }

/* ── Overview (predictive dashboard) ── */
function renderOverview(){
  const th = ST.lang==='th';
  const assets = assetsNorm();
  const totalCost = assets.reduce(function(s,a){ return s+(a.cost||0); },0);
  const totalNbv = assets.reduce(function(s,a){ return s+(a.nbv||0); },0);
  const avgAge = assets.length ? Math.round((assets.reduce(function(s,a){ return s+a.yearsOwned; },0)/assets.length)*10)/10 : 0;

  const rel = calcReliabilityPct(), maint = calcMaintainabilityPct(), avail = calcAvailabilityKN(), maPerf = calcMAPerformancePct(), invAvail = calcInventoryAvailabilityPct();

  function metricCard(label, val, color){
    const display = val!=null ? val+'%' : '—';
    return '<div class="kpi-card"><div class="lbl">'+label+'</div><div class="val" style="color:'+(val!=null?color:'var(--text3)')+'">'+display+'</div>'
      + (val!=null ? '<div class="bar-track"><div class="bar-fill" style="width:'+val+'%;background:'+color+'"></div></div>' : '')+'</div>';
  }

  document.getElementById('main').innerHTML =
    '<h2>'+(th?'ภาพรวมคาดการณ์วงจรชีวิตสินทรัพย์':'Asset Life-Cycle Predictive Overview')+'</h2>'
    +'<div class="sub">'+(th?'รวมข้อมูลจาก WR / PPM / MA / Inventory เพื่อการวิเคราะห์เชิงคาดการณ์':'Aggregated from WR / PPM / MA / Inventory for predictive analysis')+'</div>'
    +'<div class="kpi-grid">'

function afSysChanged(){

function genAssetId(){
  const prefix = document.getElementById('af-idpfx').value;
  const sys = document.getElementById('af-sys').value;
  const subsys = document.getElementById('af-subsys').value;
  const id = suggestAssetId(prefix, sys, subsys);
  document.getElementById('af-id').value = id;
}
function openAssetForm(id){ ST.formOpen=true; ST.editId=id||null; ST.afTab='general'; render(); }
function closeAssetForm(){ ST.formOpen=false; render(); }
async function submitAsset(){
  const th = ST.lang==='th';
  const name = document.getElementById('af-name').value.trim();
  if(!name){ toast(th?'กรุณากรอกชื่อสินทรัพย์':'Please enter a name'); return; }
  const isEdit = !!ST.editId;
  let id = isEdit ? ST.editId : (document.getElementById('af-id').value||'').trim();
  if(!id) id = suggestAssetId(document.getElementById('af-idpfx').value, document.getElementById('af-sys').value, document.getElementById('af-subsys').value) || ('AST-'+Date.now());
  const existing = isEdit ? (ST.assets.find(function(x){ return String(x.id)===String(id); }) || {}) : {};
  const building = document.getElementById('af-building').value.trim();
  const floor = document.getElementById('af-floor').value.trim();
  const zone = document.getElementById('af-zone').value.trim();
  const room = document.getElementById('af-room').value.trim();
  const cost = parseFloat(document.getElementById('af-cost').value)||0;
  const salvage = parseFloat(document.getElementById('af-salvage').value)||0;
  const life = parseInt(document.getElementById('af-life').value)||10;
  const buyDate = document.getElementById('af-buydate').value;
  const ageYr = buyDate ? Math.max(0,(new Date()-new Date(buyDate))/(365.25*86400000)) : 0;
  const depPerYr = life ? (cost-salvage)/life : 0;
  const accDep = Math.min(depPerYr*ageYr, Math.max(0,cost-salvage));
  const nbv = Math.max(cost-accDep, salvage);
  const item = Object.assign({}, existing, {
    id, name, sys: document.getElementById('af-sys').value, subsys: document.getElementById('af-subsys').value,
    type: document.getElementById('af-type').value, dept: document.getElementById('af-dept').value,
    building, floor, zone, room, location: [building,floor,zone,room].filter(Boolean).join(' / '),
    phase: document.getElementById('af-phase').value,
    brand: document.getElementById('af-brand').value.trim(), model: document.getElementById('af-model').value.trim(), serial: document.getElementById('af-serial').value.trim(),
    life, efficiency: parseInt(document.getElementById('af-eff').value)||85, status: document.getElementById('af-status').value,
    cost, buyDate, salvage, depMethod: document.getElementById('af-depmethod').value, replaceCost: parseFloat(document.getElementById('af-replacecost').value)||0,
    note: document.getElementById('af-note').value.trim(),
    nbv: Math.round(nbv), accDep: Math.round(accDep)
  });
  await syncKind('assets', item);
  const idx = ST.assets.findIndex(function(x){ return String(x.id)===String(id); });
  if(idx>=0) ST.assets[idx]=item; else ST.assets.unshift(item);
  ST.formOpen=false; render();
  toast(th?'✅ บันทึกแล้ว':'✅ Saved');
}
async function deleteAsset(id){
  const th = ST.lang==='th';
  if(!confirm(th?'ลบสินทรัพย์นี้ใช่หรือไม่?':'Delete this asset?')) return;
  await deleteKind('assets', id);
  ST.assets = ST.assets.filter(function(x){ return String(x.id)!==String(id); });
  render();
  toast(th?'🗑 ลบแล้ว':'🗑 Deleted');
}

const INSP_RESULT_LABEL = {
  found:['badge-green','✅ พบ/ปกติ','✅ Found/OK'],
  moved:['badge-yellow','📍 ย้ายที่','📍 Moved'],
  damaged:['badge-orange','⚠ ชำรุด','⚠ Damaged'],
  missing:['badge-red','❌ ไม่พบ','❌ Missing']
};
function inspectionFor(assetId){ return ST.assetInspections.find(function(x){ return String(x.assetId)===String(assetId); }); }
function renderReview(){
  const th = ST.lang==='th';
  const assets = assetsNorm();
  const thisYear = new Date().getFullYear();
  const rows = assets.map(function(a){ return { a:a, insp: inspectionFor(a.id) }; });
  const done = rows.filter(function(r){ return r.insp && r.insp.result==='found'; }).length;
  const issue = rows.filter(function(r){ return r.insp && r.insp.result && r.insp.result!=='found'; }).length;
  const pending = rows.length - done - issue;
  const pct = rows.length ? Math.round(((done+issue)/rows.length)*100) : 0;

  document.getElementById('main').innerHTML =
    '<h2>🔍 '+(th?'ตรวจสอบประจำปี':'Annual Review')+'</h2>'
    +'<div class="sub">'+(th?'Annual Asset Verification — ระบุ Asset ID เพื่ออัปเดตสถานะ':'Annual Asset Verification — enter Asset ID to update status')+'</div>'

    + '<div class="kpi-card"><div class="lbl">'+(th?'ยังไม่ตรวจ':'Pending')+'</div><div class="val" style="color:var(--yellow)">'+pending+'</div></div>'
    + '<div class="kpi-card"><div class="lbl">'+(th?'ไม่พบ/ผิดปกติ':'Issues')+'</div><div class="val" style="color:var(--red)">'+issue+'</div></div>'
    +'</div>'
    +'<div style="margin-bottom:12px"><div style="font-size:12.5px;color:var(--text2);margin-bottom:4px">'+(done+issue)+' / '+rows.length+' '+(th?'รายการ':'items')+' ('+pct+'%) — '+thisYear+'</div><div class="progress"><div class="progress-fill" style="width:'+pct+'%;background:var(--green)"></div></div></div>'
    + (rows.length ? '<table><tr><th>Asset ID</th><th>'+(th?'ชื่อ':'Name')+'</th><th>'+(th?'แผนก':'Dept')+'</th><th>'+(th?'สถานที่':'Location')+'</th><th>'+(th?'ผลตรวจสอบ':'Result')+'</th><th>'+(th?'วันที่ตรวจ':'Insp. date')+'</th><th>'+(th?'ผู้ตรวจ':'Inspector')+'</th><th></th></tr>'
      + rows.map(function(r){
          const insp = r.insp; const res = insp && insp.result;

          return '<tr><td><span class="tag">'+esc(r.a.id)+'</span></td><td>'+esc(r.a.name||'')+'</td><td>'+esc(r.a.dept||'-')+'</td><td>'+esc(r.a.location||'-')+'</td><td>'+lbl+'</td><td>'+fmtDate(insp&&insp.inspDate)+'</td><td>'+esc((insp&&insp.inspector)||'-')+'</td>'

function openInspect(id){ ST.inspModalOpen=true; ST.inspAssetId=id; render(); }
function closeInspect(){ ST.inspModalOpen=false; render(); }
function toggleInspMoved(){
  const v = document.getElementById('insp-result').value;
  document.getElementById('insp-location-row').style.display = v==='moved' ? 'block' : 'none';
}
async function saveInspection(){
  const th = ST.lang==='th';
  const assetId = ST.inspAssetId;
  const a = ST.assets.find(function(x){ return String(x.id)===String(assetId); });
  const result = document.getElementById('insp-result').value;
  const inspector = document.getElementById('insp-inspector').value.trim();
  const remark = document.getElementById('insp-remark').value.trim();
  const existing = inspectionFor(assetId) || { id:'INSP-'+assetId, assetId:assetId };
  const item = Object.assign({}, existing, { result, inspDate: new Date().toISOString(), inspector, remark });
  if(result==='moved'){
    const newLocation = document.getElementById('insp-new-location').value.trim();
    const newDept = document.getElementById('insp-new-dept').value;
    item.newLocation = newLocation; item.newDept = newDept;
    if(a){ a.location = newLocation || a.location; a.dept = newDept || a.dept;
      const parts = newLocation.split('/').map(function(s){return s.trim();});
      if(parts[0]) a.building=parts[0]; if(parts[1]) a.floor=parts[1]; if(parts[2]) a.zone=parts[2]; if(parts[3]) a.room=parts[3];
      await syncKind('assets', a);
    }
  }
  await syncKind('inspections', item);
  const idx = ST.assetInspections.findIndex(function(x){ return String(x.assetId)===String(assetId); });
  if(idx>=0) ST.assetInspections[idx]=item; else ST.assetInspections.unshift(item);
  ST.inspModalOpen=false; render();
  if(result==='missing' || result==='damaged'){
    toast(th?'🔔 บันทึกแล้ว — ระบบจะแจ้งฝ่ายบัญชีและผู้บริหาร (Demo)':'🔔 Saved — Finance & management will be notified (Demo)');
  } else {
    toast(th?'✅ บันทึกผลตรวจสอบแล้ว':'✅ Inspection saved');
  }
}

async function submitGroup(){
  const th = ST.lang==='th';
  const name = document.getElementById('gf-name').value.trim();
  if(!name){ toast(th?'กรุณากรอกชื่อกลุ่ม':'Please enter a group name'); return; }
  const assetIds = Array.prototype.slice.call(document.querySelectorAll('.gf-asset:checked')).map(function(el){ return el.value; });
  const onlineToggles = Array.prototype.slice.call(document.querySelectorAll('.gf-online'));
  for(const t of onlineToggles){
    const aid = t.getAttribute('data-id');
    const a = ST.assets.find(function(x){ return String(x.id)===String(aid); });
    if(a && a.online !== t.checked){ a.online = t.checked; await syncKind('assets', a); }
  }
  const isEdit = !!ST.grpEditId;
  const id = isEdit ? ST.grpEditId : ('GRP-'+Date.now());
  const item = { id, name, n: parseInt(document.getElementById('gf-n').value)||assetIds.length||1, k: parseInt(document.getElementById('gf-k').value)||1, assetIds };
  await syncKind('assetGroups', item);
  const idx = ST.assetGroups.findIndex(function(x){ return String(x.id)===String(id); });
  if(idx>=0) ST.assetGroups[idx]=item; else ST.assetGroups.unshift(item);
  ST.grpFormOpen=false; render();
  toast(th?'✅ บันทึกแล้ว':'✅ Saved');
}
async function deleteGroup(id){
  const th = ST.lang==='th';
  if(!confirm(th?'ลบกลุ่มนี้ใช่หรือไม่?':'Delete this group?')) return;
  await deleteKind('assetGroups', id);
  ST.assetGroups = ST.assetGroups.filter(function(x){ return String(x.id)!==String(id); });
  render();
  toast(th?'🗑 ลบแล้ว':'🗑 Deleted');
}

  document.getElementById('main').innerHTML =
    '<h2>🔗 '+(th?'กลุ่มสินทรัพย์สำรอง — % ความพร้อมใช้ (K of N)':'Redundancy Asset Groups — % Availability (K of N)')+'</h2>'
    +'<div class="sub">'+(th?'กำหนดกลุ่มอุปกรณ์ที่สำรองกัน เช่น Chiller 3 เครื่อง ต้องทำงานอย่างน้อย 2 เครื่อง':'Define groups of redundant equipment, e.g. 3 chillers, at least 2 must run')+'</div>'
    +'<div class="btn btn-pri" style="display:inline-block;margin-bottom:14px" onclick="openGroupForm()">+ '+(th?'เพิ่มกลุ่ม':'New Group')+'</div>'
    + (ST.assetGroups.length ? ST.assetGroups.map(function(g){
        const members = (g.assetIds||[]).map(function(id){ return byId[id]; }).filter(Boolean);
        const online = members.filter(function(a){ return a.online!==false; }).length;
        const n = g.n || members.length || 1;
        const k = g.k || 1;
        const pct = online>=k ? 100 : Math.round((online/k)*100);
        const color = pct>=100?'var(--green)':pct>=60?'var(--amber)':'var(--red)';
        return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">'
          +'<b>'+esc(g.name)+'</b><span style="color:'+color+';font-family:Orbitron">'+pct+'%</span></div>'
          +'<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'
          +'<div class="sub2" style="margin-top:6px;font-size:12px;color:var(--text3)">'+online+'/'+n+' online · K='+k+' · '+members.map(function(a){ return esc(a.id)+(a.online!==false?'🟢':'🔴'); }).join(' ')+'</div>'
          +'<div style="margin-top:10px"><a class="tap btn" style="margin-right:8px" onclick="openGroupForm(\''+esc(g.id)+'\')">✏ '+(th?'แก้ไข':'Edit')+'</a><a class="tap btn" onclick="deleteGroup(\''+esc(g.id)+'\')">🗑</a></div>'
          +'</div>';
      }).join('') : '<div class="empty">'+(th?'ยังไม่มีกลุ่มสำรอง':'No redundancy groups yet')+'</div>')
    + groupForm();
}

/* ── main render dispatcher ── */
function render(){
  renderSidebar();
  const fn = { overview:renderOverview, valuation:renderValuation, lifecycle:renderLifecycle, qr:renderQR, review:renderReview, register:renderRegister, groups:renderGroups }[ST.tab];
  if(fn) fn();
  const u = getUser();
  document.getElementById('userLabel').textContent = u ? (u.full_name||u.username||'') : '';
}

/* ── boot ── */
async function init(){
  const token = getToken();
  if(!token){ return; } // stays on #login-gate, which links back to root hub login
  document.getElementById('login-gate').style.display='none';
  document.getElementById('app-shell').style.display='block';
  const [assets, assetGroups, assetInspections, ppm, ma, maVisits, inv, invtx, wr] = await Promise.all([
    loadKind('assets'), loadKind('assetGroups'), loadKind('inspections'), loadKind('ppm'), loadKind('ma'), loadKind('maVisits'),
    loadKind('inv'), loadKind('invtx'), loadWR()
  ]);
  ST.assets = assets||[]; ST.assetGroups = assetGroups||[]; ST.assetInspections = assetInspections||[]; ST.ppm = ppm||[]; ST.ma = ma||[]; ST.maVisits = maVisits||[];
  ST.inv = inv||[]; ST.invtx = invtx||[]; ST.wr = wr||[];
  ST.loaded = true;
  render();
}
init();
</script>
</body>
</html>
