async function invIssueSubmit(){
  const th = ST.lang==='th';
  const partId = (document.getElementById('inv-i-part')||{}).value;
  if(!partId){ toast(th?'กรุณาเลือกอะไหล่':'Please select an item'); return; }
  const qty = parseFloat((document.getElementById('inv-i-qty')||{}).value);
  if(!qty || qty<1){ toast(th?'กรุณาระบุจำนวน':'Please enter a valid qty'); return; }
  const refType = (document.getElementById('inv-i-reftype')||{}).value;
  const refId = (document.getElementById('inv-i-ref')||{}).value.trim();
  if(!refId){ toast(th?'กรุณาระบุเลขที่อ้างอิง':'Please enter a reference'); return; }
  const person = (document.getElementById('inv-i-person')||{}).value.trim();
  const item = invItemsData().find(function(x){ return String(x.id)===String(partId); }); if(!item) return;
  const date = new Date().toISOString().slice(0,10);
  const available = item.qty||0;
  ST.invIssueBusy=true; render();
  if(available < qty){
    const tx = { id:'ISS-'+Date.now(), date, type:'issue', partId:item.id, partName:item.name, qty:0, requestedQty:qty, unitCost:0, totalCost:0, refType, ref:refId, assetId:null, person, note:(th?('ของไม่พอ (คงเหลือ '+available+')'):('Insufficient stock (on hand '+available+')')), fulfilled:false };
    try{ await fmSyncKind('invtx', tx); }catch(e){}
    ST.invIssueBusy=false; render();
    toast(th?('⚠️ ของไม่พอ — คงเหลือเพียง '+available+' '+(item.unit||'')):('⚠️ Insufficient stock — only '+available+' '+(item.unit||'')+' left'));
    return;
  }
  const consumed = invConsumeFIFO(item, qty);
  const assetId = invResolveAsset(refType, refId);
  const asset = fmAssetFor(assetId);
  const tx = { id:'ISS-'+Date.now(), date, type:'issue', partId:item.id, partName:item.name, qty, requestedQty:qty, unitCost:consumed.avgCost, totalCost:consumed.consumedCost, refType, ref:refId, assetId:assetId, building:(asset&&asset.building)||'', sys:(asset&&asset.sys)||item.sys||'', person, note:'', fulfilled:true };
  try{
    await fmSyncKind('inv', item);
    await fmSyncKind('invtx', tx);
    ST.invIssueOpen=false; ST.invIssueBusy=false; render();
    toast(th?('✅ เบิกจ่าย '+item.id+' เรียบร้อย'):('✅ Issued '+item.id));
  }catch(err){
    ST.invIssueBusy=false; render();
    toast((th?'บันทึกไม่สำเร็จ: ':'Save failed: ')+(err.message||err));
  }
}

/* ══════════════ iMATOMs Asset — Asset Life-Cycle Management (module 6):
   read-only predictive dashboard pulling from the same generic
   /fm-records/assets + /fm-records/assetGroups kinds the new
   TKO_iMATOMsAsset webapp reads/writes, plus the same cross-module
   metrics (Reliability-MTBF from PPM, Maintainability-MTTR from WR,
   MA Performance, Inventory Availability) already computed elsewhere
   in this file — reused here, not recalculated differently. Full
   CRUD (Asset Register/Lifecycle/QR/Annual Review/Valuation/Asset
   Groups) lives in the webapp; Mobile is a lightweight pull-through. */
function assetsDataM(){ return (fmKindData('assets') || fmDB('assets') || []).slice(); }
function assetGroupsDataM(){ return (fmKindData('assetGroups') || fmDB('assetGroups') || []).slice(); }
function assetYearsOwned(a){
  const d = a.buyDate || a.installDate; if(!d) return 0;
  const dt = new Date(d); if(isNaN(dt)) return 0;
  return Math.max(0, (new Date()-dt)/(365.25*86400000));
}
function assetReliabilityPct(){
  const vals = ppmData().filter(function(p){ return p.mtbf; }).map(function(p){ return p.mtbf; });
  if(!vals.length) return null;
  const avg = vals.reduce(function(s,v){ return s+v; },0)/vals.length;
  return Math.round(Math.exp(-8760/avg)*100*10)/10;
}
function assetMaintainabilityPct(){
  const closed = wrData().filter(function(w){ return w.mttr; });
  if(!closed.length) return null;
  const avg = closed.reduce(function(s,w){ return s+w.mttr; },0)/closed.length;
  if(!avg) return null;
  return Math.round((1-Math.exp(-4/avg))*100*10)/10;
}
function assetAvailabilityKN(){
  const groups = assetGroupsDataM(); if(!groups.length) return null;
  const byId = {}; assetsDataM().forEach(function(a){ byId[a.id]=a; });
  let sum = 0;
  groups.forEach(function(g){
    const members = (g.assetIds||[]).map(function(id){ return byId[id]; }).filter(Boolean);
    const online = members.filter(function(a){ return a.online!==false; }).length;
    const k = g.k||1;
    sum += online>=k ? 100 : Math.round((online/k)*100);
  });
  return Math.round((sum/groups.length)*10)/10;
}
function assetMAPerformancePct(){
  const scores = maVisitsData().filter(function(v){ return v.status==='approved'; }).map(computeVisitScore).filter(function(s){ return s!=null; });
  if(!scores.length) return null;
  const avg = scores.reduce(function(s,v){ return s+v; },0)/scores.length;
  return Math.round((avg/5)*100*10)/10;
}
function assetInventoryAvailPct(){
  const tx = (fmKindData('invtx') || fmDB('invtx') || []).filter(function(t){ return t.type==='issue'; });
  const ok = tx.filter(function(t){ return t.fulfilled!==false; }).length;
  const bad = tx.filter(function(t){ return t.fulfilled===false; }).length;
  if(!(ok+bad)) return null;
  return Math.round((ok/(ok+bad))*100*10)/10;
}
function screenModuleAsset(){
  const th = ST.lang==='th';
  const mods = opsModules(); const m = mods.find(function(x){return x.key==='asset';});
  const assets = assetsDataM();
  const totalCost = assets.reduce(function(s,a){ return s+(a.cost||0); },0);
  const totalNbv = assets.reduce(function(s,a){ return s+(a.nbv||0); },0);
  const avgAge = assets.length ? Math.round((assets.reduce(function(s,a){ return s+assetYearsOwned(a); },0)/assets.length)*10)/10 : 0;
  const rel = assetReliabilityPct(), maint = assetMaintainabilityPct(), avail = assetAvailabilityKN(), maPerf = assetMAPerformancePct(), invAvail = assetInventoryAvailPct();
  function metric(label, val){
    return statCard(label, val!=null?val+'%':'—');
  }
  return '<div class="stack">'
    + modHeader(m.name, 'asset')
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    + statCard(th?'สินทรัพย์ทั้งหมด':'Total Assets', assets.length) + statCard(th?'อายุเฉลี่ย (ปี)':'Avg Age (yr)', avgAge)
    + statCard(th?'มูลค่าซื้อรวม':'Original Cost', fmMoney(totalCost)) + statCard(th?'มูลค่าคงเหลือ':'Net Book Value', fmMoney(totalNbv))
    +'</div>'
    +'<div style="margin-top:10px"><h4 style="font-size:15px;margin-bottom:6px">'+(th?'ตัวชี้วัดคาดการณ์':'Predictive Metrics')+'</h4>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    + metric(th?'% ความน่าเชื่อถือ (MTBF)':'% Reliability (MTBF)', rel)
    + metric(th?'% ซ่อมบำรุงได้ (MTTR)':'% Maintainability (MTTR)', maint)
    + metric(th?'% พร้อมใช้ (K/N)':'% Availability (K/N)', avail)
    + metric(th?'% ผลงาน MA':'% MA Performance', maPerf)
    + metric(th?'% พร้อมจ่ายอะไหล่':'% Inventory Availability', invAvail)
    +'</div></div>'
    +'<a class="tap" data-act="open-full-app" data-key="asset" style="display:block;text-align:center;margin-top:14px;font-size:14px;font-weight:700;padding:11px;border-radius:10px;background:var(--color-accent);color:#fff;text-decoration:none">'+(th?'เปิดเว็บแอปฉบับเต็ม':'Open Full Web App')+' →</a>'
    +'</div>';
}

/* ============== auth actions ============== */
async function onLoginSubmit(e){
  e.preventDefault();
  const user = document.getElementById('li-user').value.trim();
  const pass = document.getElementById('li-pass').value;
  ST.loginBusy = true; ST.loginMsg=''; ST.loginErr=false; render();
  try{
    const data = await api('/auth/login', { method:'POST', body: JSON.stringify({ username:user, password:pass }) });
    setSession(data.token, data.refresh_token, data.user);
    ST.loginBusy=false; ST.loginErr=false; ST.loginMsg = (ST.lang==='th'?'ยินดีต้อนรับ ':'Welcome, ') + (data.user.full_name||data.user.username);
    setTimeout(function(){ ST.screen='splash'; render(); }, 350);
  }catch(err){
    ST.loginBusy=false; ST.loginErr=true; ST.loginMsg = err.message || (ST.lang==='th'?'เข้าสู่ระบบไม่สำเร็จ':'Login failed'); render();
  }
}
async function onRegisterSubmit(e){
  e.preventDefault();
  const body = {
    full_name: document.getElementById('rg-name').value.trim(),
    email: document.getElementById('rg-email').value.trim(),
    username: document.getElementById('rg-user').value.trim(),
    password: document.getElementById('rg-pass').value,
  };
  ST.regBusy = true; ST.regMsg=''; ST.regErr=false; render();
  try{
    await api('/auth/register', { method:'POST', body: JSON.stringify(body) });
    ST.regBusy=false; ST.regErr=false; ST.regMsg = ST.lang==='th' ? 'ส่งคำขอสำเร็จ กรุณารอการอนุมัติจากผู้ดูแลระบบ' : 'Request submitted — please wait for administrator approval.';
    render();
  }catch(err){
    ST.regBusy=false; ST.regErr=true; ST.regMsg = err.message || (ST.lang==='th'?'ส่งคำขอไม่สำเร็จ':'Request failed'); render();
  }
}
async function doLogout(){
  try{ await api('/auth/logout', { method:'POST', body: JSON.stringify({ refresh_token: localStorage.getItem(LS.refresh) }) }); }catch(e){}
  clearSession();
  ST.screen='login'; ST.tab='home'; ST.authMode='login'; ST.dash=null;
  render();
}

/* ============== data loads ============== */
async function loadDashboard(){
  try{ ST.dash = await api('/dashboard'); render(); }catch(err){ /* non-fatal */ }
}

/* light per-module data fetch — FM/M&V reuse the shared dashboard;
   only IoT needs its own call (bas.imatomstech.com sensor gateway). */
async function loadModuleData(key){
  if(key==='fm'){ loadFmWR(); loadFmKind('ppm'); loadFmKind('ma'); loadFmAssets(); return; } /* WR/PPM/MA/Inv/OM now come from the real backend */
  if(key==='iot'){
    ST.modLoading.iot = true; ST.modData.iot = {}; render();
    try{
      const res = await fetch('https://bas.imatomstech.com/api/sensor');
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data && data.devices) || (data ? [data] : []);
      ST.modData.iot = { devices: list };
    }catch(err){
      ST.modData.iot = { __error: true };
    }
    ST.modLoading.iot = false; render();
    return;
  }
  if(key==='asset'){
    loadFmWR(); loadFmKind('ppm'); loadFmKind('maVisits'); loadFmKind('invtx');
    loadFmKind('assets'); loadFmKind('assetGroups');
    return;
  }
  /* mv / advisory / bot are static-summary screens for now — no fetch needed */
}

/* ============== boot ============== */
// QR codes stuck on doors/rooms link to `?loc=LOC:A-2-AHU` — on load, stash
// that code and, once the user reaches the dashboard (already logged in, or
// right after they log in), jump straight into WR > New WR with the
// Building/Floor/Zone-Room pre-filled from the scanned code.
let PENDING_LOC = null;
(function boot(){
  try{
    const qp = new URLSearchParams(window.location.search);
    const loc = qp.get('loc');
    if (loc) PENDING_LOC = loc;
  }catch(err){ /* no URLSearchParams support — ignore, manual entry still works */ }
  render();
  if(ST.screen === 'main') loadDashboard();
  if (PENDING_LOC) setTimeout(wrOpenPendingLocIfAny, 400);
})();
function wrOpenPendingLocIfAny(){
  if (!PENDING_LOC) return;
  if (ST.screen !== 'main'){ setTimeout(wrOpenPendingLocIfAny, 400); return; } // still on login/splash
  ST.activeModule = 'fm'; ST.fromTab = ST.tab; ST.screen = 'module';
  ST.fmSub = 'wr'; ST.wrSub = 'new'; ST.wrFormOpen = true;
  render();
  loadModuleData('fm');
  setTimeout(function(){
    if (wrApplyLocCode(PENDING_LOC)) PENDING_LOC = null;
  }, 300);
}
