<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TKO iMATOMs Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --color-bg:#f2f2f3; --color-surface:#e9e9ea; --color-text:#1d1f20;
  --color-accent:#5980a6; --color-accent-2:#728fab;
  --color-divider:rgba(29,31,32,.16);
  --color-neutral-100:#f5f5f8; --color-neutral-200:#e7e7ea; --color-neutral-300:#d4d4d7;
  --color-neutral-500:#98989b; --color-neutral-600:#7a7a7d; --color-neutral-700:#5d5d60; --color-neutral-800:#424244;
  --color-accent-100:#eef6ff; --color-accent-400:#94bce3; --color-accent-600:#597ea3; --color-accent-700:#416180; --color-accent-800:#2c455d;
  --color-accent-2-100:#eef6ff; --color-accent-2-800:#314457;
  --font-heading:"Barlow Condensed",system-ui,sans-serif; --font-body:"Barlow",system-ui,sans-serif;
  --danger:#c0392b; --orange:#e69a3c; --green:#4fd17a; --sky:#5aa9e6;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:15px;line-height:1.5}
h1,h2,h3,h4,h5{font-family:var(--font-heading);font-weight:600;line-height:1.12;letter-spacing:-.01em;margin:0}
a{color:inherit;text-decoration:none}
.tap{cursor:pointer}
@keyframes orbitA{from{transform:rotate(20deg)}to{transform:rotate(380deg)}}
@keyframes orbitB{from{transform:rotate(-40deg)}to{transform:rotate(320deg)}}
@keyframes orbitC{from{transform:rotate(100deg)}to{transform:rotate(460deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- shell ---- */
#app-root{max-width:480px;margin:0 auto;min-height:100vh;background:var(--color-bg);display:flex;flex-direction:column}
@media(min-width:481px){ body{background:#dfe1e4} #app-root{min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.08)} }

/* ---- blueprint card ---- */
.blueprint{position:relative;border:1px solid var(--color-divider)}
.blueprint>.corner{position:absolute;width:11px;height:11px;color:rgba(29,31,32,.55)}
.blueprint>.corner::before,.blueprint>.corner::after{content:"";position:absolute;background:currentColor}
.blueprint>.corner::before{left:5px;top:0;width:1px;height:100%}
.blueprint>.corner::after{top:5px;left:0;width:100%;height:1px}
.blueprint>.corner.tl{top:-6px;left:-6px} .blueprint>.corner.tr{top:-6px;right:-6px}
.blueprint>.corner.bl{bottom:-6px;left:-6px} .blueprint>.corner.br{bottom:-6px;right:-6px}
.corners{}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--font-heading);font-weight:600;font-size:14px;color:var(--color-text);background:transparent;border:1px solid var(--color-divider);padding:9px 16px;border-radius:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--color-accent);color:#fff;border-color:var(--color-accent)}
.btn-primary:not(:disabled):hover{background:var(--color-accent-600)}
.btn-secondary:not(:disabled):hover{background:rgba(29,31,32,.06)}
.btn-block{width:100%;margin-top:6px}
.btn svg{display:block}

/* ---- forms ---- */
.field>label{display:block;font-size:12px;margin-bottom:5px;color:rgba(29,31,32,.7)}
.field{margin-bottom:12px}
.input{width:100%;min-height:38px;padding:8px 10px;font:inherit;font-size:14px;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:0}
.input:focus-visible{outline:none;border-color:var(--color-accent)}
textarea.input{min-height:80px;resize:vertical}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--color-text) 50%),linear-gradient(135deg,var(--color-text) 50%,transparent 50%);background-position:calc(100% - 16px) center,calc(100% - 11px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

/* ---- seg control ---- */
.seg{display:inline-flex;overflow:hidden;border:1px solid var(--color-divider)}
.seg-opt{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:13px;cursor:pointer}
.seg-opt+.seg-opt{border-left:1px solid var(--color-divider)}
.seg-opt.active{background:var(--color-accent);color:#fff}

/* ---- tags ---- */
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;border-radius:2px}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800)}
.tag-neutral{background:var(--color-neutral-100);color:var(--color-neutral-800)}
.tag-outline{border:1px solid var(--color-accent);color:var(--color-accent)}
.tag-danger{background:#fdecea;color:#a83226}

/* ---- table ---- */
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(29,31,32,.6);padding:6px;border-bottom:1px solid var(--color-divider)}
.table td{padding:6px;border-bottom:1px solid rgba(29,31,32,.08)}

/* ---- switch ---- */
.switch-track{width:38px;height:22px;border-radius:11px;display:flex;align-items:center;padding:2px;box-sizing:border-box;cursor:pointer;border:1px solid var(--color-divider)}
.switch-knob{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:margin-left .15s ease}

/* ---- atom logo ---- */
.atom{position:relative}
.atom .ring{position:absolute;left:50%;top:50%;border-radius:50%}
.atom .ring.a{border:3px solid var(--sky);animation:orbitA 14s linear infinite}
.atom .ring.b{border:3px solid var(--green);animation:orbitB 11s linear infinite}
.atom .ring.c{border:3px solid var(--orange);animation:orbitC 17s linear infinite}
.atom .nucleus{position:absolute;left:50%;top:50%;background:#f0862f;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 16px 4px rgba(240,134,47,.7)}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;flex-shrink:0}
.topbar .brand{font-family:var(--font-heading);font-weight:600;font-size:18px}
.icon-btn{width:32px;height:32px;border:1px solid var(--color-divider);display:flex;align-items:center;justify-content:center;cursor:pointer}
.back-nav{display:flex;align-items:center;gap:4px;font-family:var(--font-heading);font-size:14px;cursor:pointer}

/* ---- bottom tab bar ---- */
.tabbar{display:flex;border-top:1px solid var(--color-divider);flex-shrink:0;padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:var(--color-bg)}
.tabitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--color-neutral-600)}
.tabitem.active{color:var(--color-accent-700)}
.tabitem span{font-size:9px;font-family:var(--font-heading);letter-spacing:.02em}

/* ---- views ---- */
.view-body{flex:1;overflow:auto;padding:0 18px 22px}
.stack{display:flex;flex-direction:column;gap:16px}
.footer-legal{text-align:center;padding-top:6px;border-top:1px solid var(--color-divider)}
.footer-legal .l1{font-family:var(--font-heading);font-size:10px;letter-spacing:.1em}
.footer-legal .l2{font-size:8.5px;line-height:1.35;color:var(--color-accent-700);margin-top:6px;padding:0 4px}
.footer-legal .l3{font-size:8.5px;color:var(--color-accent-700);margin-top:3px}
.back-to-platform{display:block;text-align:center;font-size:12px;color:var(--color-accent-700);margin:14px 0 4px;cursor:pointer}

/* ---- login/splash hero ---- */
.hero{flex-shrink:0;padding:30px 16px 22px;position:relative;overflow:hidden;text-align:center;background:radial-gradient(circle at 50% 35%,#1c3a5e 0%,#0d1b30 70%,#0a1526 100%);color:#fff}
.hero .kicker{font-family:var(--font-heading);font-size:12px;letter-spacing:.18em;color:var(--orange)}
.hero .title{font-family:var(--font-heading);font-size:28px;font-weight:600;margin-top:2px}
.hero .title .v{color:#e6672f}
.hero .tag{font-family:var(--font-heading);font-size:11px;letter-spacing:.1em;color:var(--green);margin-top:4px}

/* ---- spinner / toast ---- */
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1d1f20;color:#fff;padding:10px 18px;font-size:13px;border-radius:4px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty-state{padding:18px;text-align:center;color:var(--color-neutral-600);font-size:13px}
.msg{font-size:12.5px;margin-top:2px;min-height:16px}
.msg.ok{color:#1a7a3c}
.msg.err{color:var(--danger)}

/* ---- sheet ---- */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:400;opacity:0;pointer-events:none;transition:.2s}
.sheet-overlay.show{opacity:1;pointer-events:auto}
.sheet{background:var(--color-bg);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:10px 10px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(20px);transition:.25s}
.sheet-overlay.show .sheet{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--color-divider);border-radius:2px;margin:0 auto 14px}
.fab{position:fixed;right:calc(50% - 240px + 20px);bottom:88px;width:52px;height:52px;border-radius:50%;background:var(--color-accent);color:#fff;font-size:26px;border:none;display:none;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(89,128,166,.4);cursor:pointer;z-index:200}
@media(max-width:480px){ .fab{right:20px} }
.fab.show{display:flex}
</style>
</head>
<body>

<div id="app-root"></div>

<div class="sheet-overlay" id="wr-sheet-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="wr-sheet-title" style="margin-bottom:14px">New Work Request</h3>
    <form id="wr-form">
      <div class="field"><label id="lbl-wr-title">Title</label><input type="text" class="input" id="wr-title" required></div>
      <div class="field"><label id="lbl-wr-desc">Description</label><textarea class="input" id="wr-desc"></textarea></div>
      <div class="field"><label id="lbl-wr-asset">Asset (optional)</label><select class="input" id="wr-asset"><option value="">—</option></select></div>
      <div style="display:flex;gap:10px">
        <div class="field" style="flex:1"><label id="lbl-wr-type">Type</label>
          <select class="input" id="wr-type">
            <option value="corrective">Corrective</option>
            <option value="preventive">Preventive</option>
            <option value="emergency">Emergency</option>
          </select>
        </div>
        <div class="field" style="flex:1"><label id="lbl-wr-priority">Priority</label>
          <select class="input" id="wr-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:6px">
        <button type="button" class="btn btn-secondary" style="flex:1" id="wr-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" style="flex:1" id="wr-submit">Submit</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = 'https://api.imatomstech.com/api';
const LS = { token:'imatoms_jwt', refresh:'imatoms_refresh', user:'imatoms_user', lang:'imatoms_mobile_lang' };

function getToken(){ try{ return localStorage.getItem(LS.token); }catch(e){ return null; } }
function getUser(){ try{ return JSON.parse(localStorage.getItem(LS.user)||'null'); }catch(e){ return null; } }
function setSession(token, refresh, user){ try{ localStorage.setItem(LS.token, token); if(refresh) localStorage.setItem(LS.refresh, refresh); localStorage.setItem(LS.user, JSON.stringify(user)); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(LS.token); localStorage.removeItem(LS.refresh); localStorage.removeItem(LS.user); }catch(e){} }

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const token = getToken();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(res.status === 401){ clearSession(); ST.screen='login'; ST.tab='home'; ST.opsDetail=null; render(); throw new Error((data && data.error) || 'Session expired — please sign in again'); }
  if(!res.ok) throw new Error((data && data.error) || ('Request failed (' + res.status + ')'));
  return data;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._h); toast._h=setTimeout(function(){t.classList.remove('show');},2600); }

/* ============== state ============== */
const ST = {
  lang: (function(){ try{ return localStorage.getItem(LS.lang) || 'th'; }catch(e){ return 'th'; } })(),
  screen: (getToken() && getUser()) ? 'main' : 'login',
  authMode: 'login',
  tab: 'home',
  opsDetail: null,
  lifestyleSub: 'market',
  showPassword: false,
  loginBusy:false, loginMsg:'', loginErr:false,
  regBusy:false, regMsg:'', regErr:false,
  dash: null,
  wr: [], wrLoaded:false,
};

function setLang(l){ ST.lang = l; try{ localStorage.setItem(LS.lang, l); }catch(e){} render(); }

/* ============== copy ============== */
function L(){
  const th = ST.lang === 'th';
  return th ? {
    backToPlatform:'← กลับสู่แพลตฟอร์ม', back:'ย้อนกลับ', navHome:'หน้าหลัก', navOps:'ระบบงาน', navLifestyle:'ไลฟ์สไตล์', navProfile:'โปรไฟล์',
    homeGreeting:'สวัสดี, ' + ((getUser()&&(getUser().full_name||getUser().username)) || 'คุณผู้ใช้งาน'),
    homeRole:'TKO iMATOMs Platform · Facility & Energy',
    platformsTitle:'แพลตฟอร์มในเครือ', platformsSub:'รวมทุกบริการและธุรกิจในเครือ TKO ไว้ในที่เดียว',
    lifestyleTitle:'ไลฟ์สไตล์', open:'เปิดให้บริการ',
    marketName:'ตลาดอาหารอีสาน', marketTagline:'Isan Food Market', marketTab:'ตลาดอาหาร', marketCta:'เข้าสู่ร้านค้า',
    coffeeName:'มีแฮง คอฟฟี่', coffeeTagline:'MeeHang Coffee', coffeeTab:'คอฟฟี่', coffeeCta:'สั่งเครื่องดื่ม',
    opsTitle:'ระบบปฏิบัติการ', opsSub:'7 แพลตฟอร์ม · TKO กรุ๊ป',
    fmTitle:'iMATOMs FM', fmSub:'บริหารจัดการอาคาร (Hard FM)', fmRecent:'ใบแจ้งซ่อมล่าสุด', fmCta:'+ สร้างใบแจ้งซ่อมใหม่',
    kOpen:'เปิดงาน', kProgress:'กำลังดำเนินการ', kPm:'PM ครบกำหนด (30 วัน)', kNotif:'แจ้งเตือนที่ยังไม่อ่าน',
    iotTitle:'iMATOMs IoT', iotSub:'ระบบ IoT ตรวจสอบ & แจ้งเตือน', iotTrend:'แนวโน้มการใช้พลังงาน 24 ชม.', iotAlerts:'รายการแจ้งเตือน',
    mvTitle:'iMATOMs M&V', mvSub:'วัดผลและทวนสอบพลังงาน', mvChart:'เปรียบเทียบพลังงานฐานและใช้จริง', mvBaseline:'ค่าฐาน', mvActual:'ใช้จริง', mvCta:'ดาวน์โหลดรายงาน',
    advTitle:'iMATOMs Advisory', advSub:'ที่ปรึกษาพลังงาน & รางวัล', advAwards:'รางวัลและการรับรอง',
    advFormTitle:'ขอรับคำปรึกษา', advName:'ชื่อ', advCompany:'บริษัท', advMsg:'รายละเอียด', advCta:'ส่งคำขอ',
    botTitle:'iMATOMs BOT', botSub:'หุ่นยนต์ & ระบบอัตโนมัติ', botMap:'แผนที่อาคารแบบเรียลไทม์',
    profileTitle:'โปรไฟล์', profileLang:'ภาษา', profileNotif:'การแจ้งเตือน', profileAccess:'สิทธิ์การเข้าใช้งาน', granted:'อนุญาต', signOut:'ออกจากระบบ',
    loginTitle:'เข้าสู่ระบบ', loginSub:'สำหรับผู้ใช้งานที่ได้รับอนุมัติแล้วเท่านั้น',
    username:'ชื่อผู้ใช้งาน', password:'รหัสผ่าน', signIn:'Login',
    noAccount:'ยังไม่มีบัญชี?', registerLink:'ขอสิทธิ์เข้าใช้งาน', haveAccount:'มีบัญชีอยู่แล้ว?', loginLink:'เข้าสู่ระบบ',
    fullName:'ชื่อ-นามสกุล', email:'อีเมล', approvalNote:'คำขอของคุณจะถูกส่งให้ผู้ดูแลระบบตรวจสอบและอนุมัติก่อนจึงจะสามารถเข้าใช้งานได้', submitRequest:'ส่งคำขอเข้าใช้งาน',
    splashSelect:'เลือกภาษา · Select your language', splashTh:'ภาษาไทย', splashEn:'English', continueBtn:'เข้าสู่ระบบต่อ',
  } : {
    backToPlatform:'← Back to Platform', back:'Back', navHome:'Home', navOps:'Operations', navLifestyle:'Lifestyle', navProfile:'Profile',
    homeGreeting:'Welcome back, ' + ((getUser()&&(getUser().full_name||getUser().username)) || 'User'),
    homeRole:'TKO iMATOMs Platform · Facility & Energy',
    platformsTitle:'Platforms', platformsSub:'All TKO services and businesses in one place',
    lifestyleTitle:'Lifestyle', open:'Open',
    marketName:'Isan Food Market', marketTagline:'ตลาดอาหารอีสาน', marketTab:'Food Market', marketCta:'Enter Store',
    coffeeName:'MeeHang Coffee', coffeeTagline:'มีแฮง คอฟฟี่', coffeeTab:'Coffee', coffeeCta:'Order Now',
    opsTitle:'Operations', opsSub:'7 platforms · TKO Group',
    fmTitle:'iMATOMs FM', fmSub:'Hard Facility Management', fmRecent:'Recent Work Requests', fmCta:'+ New Work Request',
    kOpen:'Open', kProgress:'In Progress', kPm:'PM Due (30 days)', kNotif:'Unread Notifications',
    iotTitle:'iMATOMs IoT', iotSub:'Sensors & Alerts', iotTrend:'24h Power Trend', iotAlerts:'Alerts Feed',
    mvTitle:'iMATOMs M&V', mvSub:'Measurement & Verification', mvChart:'Baseline vs Actual', mvBaseline:'Baseline', mvActual:'Actual', mvCta:'Download Report',
    advTitle:'iMATOMs Advisory', advSub:'Energy Consulting & Awards', advAwards:'Awards & Certifications',
    advFormTitle:'Request a Consultation', advName:'Name', advCompany:'Company', advMsg:'Details', advCta:'Submit Request',
    botTitle:'iMATOMs BOT', botSub:'Robotics & Automation', botMap:'Live Facility Map',
    profileTitle:'Profile', profileLang:'Language', profileNotif:'Notifications', profileAccess:'Module Access', granted:'Granted', signOut:'Sign Out',
    loginTitle:'Sign In', loginSub:'Access is limited to approved users only.',
    username:'Username', password:'Password', signIn:'Login',
    noAccount:"Don't have an account?", registerLink:'Request Access', haveAccount:'Already have an account?', loginLink:'Sign In',
    fullName:'Full Name', email:'Email', approvalNote:'Your request will be reviewed and must be approved by an administrator before access is granted.', submitRequest:'Submit Request',
    splashSelect:'เลือกภาษา · Select your language', splashTh:'ภาษาไทย', splashEn:'English', continueBtn:'Continue',
  };
}

function opsModules(){
  const th = ST.lang==='th';
  return [
    { key:'fm', code:'FM', name:'iMATOMs FM', tagline: th?'บริหารจัดการอาคาร':'Facility Management', status: th?'ออนไลน์':'Online', tagClass:'tag-accent' },
    { key:'iot', code:'IoT', name:'iMATOMs IoT', tagline: th?'ตรวจสอบ & แจ้งเตือน':'Monitoring & Alerts', status: th?'3 แจ้งเตือน':'3 Alerts', tagClass:'tag-outline' },
    { key:'mv', code:'M&V', name:'iMATOMs M&V', tagline: th?'วัดผลและทวนสอบพลังงาน':'Measurement & Verification', status: th?'ออนไลน์':'Online', tagClass:'tag-accent' },
    { key:'advisory', code:'ADV', name:'iMATOMs Advisory', tagline: th?'ที่ปรึกษา & รางวัล':'Energy Consulting & Awards', status: th?'ออนไลน์':'Online', tagClass:'tag-accent' },
    { key:'bot', code:'BOT', name:'iMATOMs BOT', tagline: th?'หุ่นยนต์ & ระบบอัตโนมัติ':'Automation Fleet', status: th?'5/6 ออนไลน์':'5/6 Online', tagClass:'tag-accent' },
  ];
}

/* ============== render + events ============== */
function render(){
  const root = document.getElementById('root') || document.getElementById('app-root');
  let html = '';
  if(ST.screen === 'login') html = screenLogin();
  else if(ST.screen === 'splash') html = screenSplash();
  else html = screenMain();
  document.getElementById('app-root').innerHTML = html;
  updateFab();
  bindFormHandlers();
  document.documentElement.lang = ST.lang;
}
function updateFab(){
  let fab = document.getElementById('wr-fab');
  const shouldShow = ST.screen==='main' && ST.tab==='ops' && ST.opsDetail==='fm';
  if(!fab){
    fab = document.createElement('button');
    fab.id = 'wr-fab'; fab.className = 'fab'; fab.textContent = '+';
    fab.addEventListener('click', function(){ openWrSheet(); });
    document.body.appendChild(fab);
  }
  fab.classList.toggle('show', !!shouldShow);
}

function bindFormHandlers(){
  const lf = document.getElementById('login-form');
  if(lf) lf.addEventListener('submit', onLoginSubmit);
  const rf = document.getElementById('register-form');
  if(rf) rf.addEventListener('submit', onRegisterSubmit);
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.getAttribute('data-act');
  if(act==='lang-th') setLang('th');
  else if(act==='lang-en') setLang('en');
  else if(act==='toggle-pw'){ ST.showPassword = !ST.showPassword; render(); }
  else if(act==='to-register'){ ST.authMode='register'; ST.regMsg=''; render(); }
  else if(act==='to-login'){ ST.authMode='login'; ST.loginMsg=''; render(); }
  else if(act==='splash-th'){ ST.lang='th'; try{localStorage.setItem(LS.lang,'th');}catch(err){} ST.screen='main'; render(); }
  else if(act==='splash-en'){ ST.lang='en'; try{localStorage.setItem(LS.lang,'en');}catch(err){} ST.screen='main'; render(); }
  else if(act==='tab-home'){ ST.tab='home'; ST.opsDetail=null; render(); if(!ST.dash) loadDashboard(); }
  else if(act==='tab-ops'){ ST.tab='ops'; ST.opsDetail=null; render(); }
  else if(act==='tab-lifestyle'){ ST.tab='lifestyle'; render(); }
  else if(act==='tab-profile'){ ST.tab='profile'; render(); }
  else if(act==='ops-back'){ ST.opsDetail=null; render(); }
  else if(act==='open-module'){ const key = el.getAttribute('data-key'); ST.tab='ops'; ST.opsDetail=key; render(); if(key==='fm') loadWorkOrders(); }
  else if(act==='lifestyle-market'){ ST.lifestyleSub='market'; render(); }
  else if(act==='lifestyle-coffee'){ ST.lifestyleSub='coffee'; render(); }
  else if(act==='goto-market'){ window.location.href = '/TKO_IsanFoodMarket/'; }
  else if(act==='goto-coffee'){ window.location.href = '/TKO_MeeHangCoffee/'; }
  else if(act==='new-wr'){ openWrSheet(); }
  else if(act==='logout'){ doLogout(); }
});

/* ============== auth actions ============== */
async function onLoginSubmit(e){
  e.preventDefault();
  const user = document.getElementById('li-user').value.trim();
  const pass = document.getElementById('li-pass').value;
  ST.loginBusy = true; ST.loginMsg=''; ST.loginErr=false; render();
  try{
    const data = await api('/auth/login', { method:'POST', body: JSON.stringify({ username:user, password:pass }) });
    setSession(data.token, data.refresh_token, data.user);
    ST.loginBusy=false; ST.loginErr=false; ST.loginMsg = (ST.lang==='th'?'ยินดีต้อนรับ ':'Welcome, ') + (data.user.full_name||data.user.username);
    setTimeout(function(){ ST.screen='splash'; render(); }, 350);
  }catch(err){
    ST.loginBusy=false; ST.loginErr=true; ST.loginMsg = err.message || (ST.lang==='th'?'เข้าสู่ระบบไม่สำเร็จ':'Login failed'); render();
  }
}
async function onRegisterSubmit(e){
  e.preventDefault();
  const body = {
    full_name: document.getElementById('rg-name').value.trim(),
    email: document.getElementById('rg-email').value.trim(),
    username: document.getElementById('rg-user').value.trim(),
    password: document.getElementById('rg-pass').value,
  };
  ST.regBusy = true; ST.regMsg=''; ST.regErr=false; render();
  try{
    await api('/auth/register', { method:'POST', body: JSON.stringify(body) });
    ST.regBusy=false; ST.regErr=false; ST.regMsg = ST.lang==='th' ? 'ส่งคำขอสำเร็จ กรุณารอการอนุมัติจากผู้ดูแลระบบ' : 'Request submitted — please wait for administrator approval.';
    render();
  }catch(err){
    ST.regBusy=false; ST.regErr=true; ST.regMsg = err.message || (ST.lang==='th'?'ส่งคำขอไม่สำเร็จ':'Request failed'); render();
  }
}
async function doLogout(){
  try{ await api('/auth/logout', { method:'POST', body: JSON.stringify({ refresh_token: localStorage.getItem(LS.refresh) }) }); }catch(e){}
  clearSession();
  ST.screen='login'; ST.tab='home'; ST.opsDetail=null; ST.authMode='login'; ST.dash=null; ST.wr=[]; ST.wrLoaded=false;
  render();
}

/* ============== data loads ============== */
async function loadDashboard(){
  try{ ST.dash = await api('/dashboard'); render(); }catch(err){ /* non-fatal */ }
}
async function loadWorkOrders(){
  ST.wrLoaded = false;
  try{ ST.wr = await api('/work-orders'); }catch(err){ ST.wr = []; }
  ST.wrLoaded = true; render();
}
async function loadAssetOptions(){
  try{
    const rows = await api('/assets');
    const sel = document.getElementById('wr-asset');
    if(!sel) return;
    rows.forEach(function(a){ const opt=document.createElement('option'); opt.value=a.id; opt.textContent=(a.asset_no?(a.asset_no+' — '):'')+(a.name||''); sel.appendChild(opt); });
  }catch(err){}
}

/* ============== WR sheet ============== */
const wrOverlay = document.getElementById('wr-sheet-overlay');
function openWrSheet(){
  const th = ST.lang==='th';
  document.getElementById('wr-sheet-title').textContent = th? 'สร้างใบแจ้งซ่อมใหม่' : 'New Work Request';
  document.getElementById('lbl-wr-title').textContent = th? 'หัวข้อ' : 'Title';
  document.getElementById('lbl-wr-desc').textContent = th? 'รายละเอียด' : 'Description';
  document.getElementById('lbl-wr-asset').textContent = th? 'ทรัพย์สิน (ถ้ามี)' : 'Asset (optional)';
  document.getElementById('lbl-wr-type').textContent = th? 'ประเภท' : 'Type';
  document.getElementById('lbl-wr-priority').textContent = th? 'ความสำคัญ' : 'Priority';
  document.getElementById('wr-cancel').textContent = th? 'ยกเลิก' : 'Cancel';
  document.getElementById('wr-submit').textContent = th? 'ส่งคำขอ' : 'Submit';
  document.getElementById('wr-form').reset();
  wrOverlay.classList.add('show');
  loadAssetOptions();
}
document.getElementById('wr-cancel').addEventListener('click', function(){ wrOverlay.classList.remove('show'); });
wrOverlay.addEventListener('click', function(e){ if(e.target === wrOverlay) wrOverlay.classList.remove('show'); });
document.getElementById('wr-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('wr-submit');
  const th = ST.lang==='th';
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try{
    const body = {
      title: document.getElementById('wr-title').value.trim(),
      description: document.getElementById('wr-desc').value.trim(),
      asset_id: document.getElementById('wr-asset').value || null,
      wo_type: document.getElementById('wr-type').value,
      priority: document.getElementById('wr-priority').value,
      module: 'office',
    };
    const created = await api('/work-orders', { method:'POST', body: JSON.stringify(body) });
    wrOverlay.classList.remove('show');
    toast((th?'ส่งใบแจ้งซ่อม ':'Work request ') + (created.wo_no||'') + (th?' สำเร็จ':' submitted'));
    loadWorkOrders(); loadDashboard();
  }catch(err){
    toast(err.message || (th?'ส่งไม่สำเร็จ':'Failed to submit'));
  }finally{
    btn.disabled = false; btn.textContent = th? 'ส่งคำขอ' : 'Submit';
  }
});

(function boot(){
  render();
  if(ST.screen === 'main'){ loadDashboard(); if(ST.tab==='ops' && ST.opsDetail==='fm') loadWorkOrders(); }
