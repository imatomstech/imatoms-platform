<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TKO iMATOMs Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --color-bg:#f2f2f3; --color-surface:#e9e9ea; --color-text:#1d1f20;
  --color-accent:#5980a6; --color-accent-2:#728fab;
  --color-divider:rgba(29,31,32,.16);
  --color-neutral-100:#f5f5f8; --color-neutral-200:#e7e7ea; --color-neutral-300:#d4d4d7;
  --color-neutral-500:#98989b; --color-neutral-600:#7a7a7d; --color-neutral-700:#5d5d60; --color-neutral-800:#424244;
  --color-accent-100:#eef6ff; --color-accent-400:#94bce3; --color-accent-600:#597ea3; --color-accent-700:#416180; --color-accent-800:#2c455d;
  --color-accent-2-100:#eef6ff; --color-accent-2-800:#314457;
  --font-heading:"Barlow Condensed",system-ui,sans-serif; --font-body:"Barlow",system-ui,sans-serif;
  --danger:#c0392b; --orange:#e69a3c; --green:#4fd17a; --sky:#5aa9e6;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:15px;line-height:1.5}
h1,h2,h3,h4,h5{font-family:var(--font-heading);font-weight:600;line-height:1.12;letter-spacing:-.01em;margin:0}
a{color:inherit;text-decoration:none}
.tap{cursor:pointer}
@keyframes orbitA{from{transform:rotate(20deg)}to{transform:rotate(380deg)}}
@keyframes orbitB{from{transform:rotate(-40deg)}to{transform:rotate(320deg)}}
@keyframes orbitC{from{transform:rotate(100deg)}to{transform:rotate(460deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- shell ---- */
#app-root{max-width:480px;margin:0 auto;min-height:100vh;background:var(--color-bg);display:flex;flex-direction:column}
@media(min-width:481px){ body{background:#dfe1e4} #app-root{min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.08)} }

/* ---- blueprint card ---- */
.blueprint{position:relative;border:1px solid var(--color-divider);border-radius:6px;overflow:hidden}
.blueprint>.corner{display:none}

/* tappable card hover/press: raised (embossed) feel + accent strip.
   Uses :hover for mouse (desktop/tablet) AND :active for touch (phones
   have no hover state), so the effect works on tap too. */
.blueprint.tap{transition:transform .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease}
.blueprint.tap::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--color-accent);transform:scaleY(0);transform-origin:top;transition:transform .15s ease}
.blueprint.tap:hover,.blueprint.tap:active{transform:translateY(-3px);box-shadow:0 10px 20px -6px rgba(29,31,32,.25),0 1px 0 rgba(255,255,255,.6) inset;background-color:#fff;border-color:var(--color-accent)}
.blueprint.tap:hover::after,.blueprint.tap:active::after{transform:scaleY(1)}
.blueprint.tap:hover *,.blueprint.tap:active *{text-shadow:0 1px 0 rgba(255,255,255,.8)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--font-heading);font-weight:600;font-size:14px;color:var(--color-text);background:transparent;border:1px solid var(--color-divider);padding:9px 16px;border-radius:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--color-accent);color:#fff;border-color:var(--color-accent)}
.btn-primary:not(:disabled):hover{background:var(--color-accent-600)}
.btn-secondary:not(:disabled):hover{background:rgba(29,31,32,.06)}
.btn-block{width:100%;margin-top:6px}

/* ---- forms ---- */
.field>label{display:block;font-size:12px;margin-bottom:5px;color:rgba(29,31,32,.7)}
.field{margin-bottom:12px}
.input{width:100%;min-height:38px;padding:8px 10px;font:inherit;font-size:14px;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:0}
.input:focus-visible{outline:none;border-color:var(--color-accent)}
textarea.input{min-height:80px;resize:vertical}

/* ---- seg control ---- */
.seg{display:inline-flex;overflow:hidden;border:1px solid var(--color-divider)}
.seg-opt{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:13px;cursor:pointer}
.seg-opt+.seg-opt{border-left:1px solid var(--color-divider)}
.seg-opt.active{background:var(--color-accent);color:#fff}

/* ---- tags ---- */
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;border-radius:2px}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800)}
.tag-neutral{background:var(--color-neutral-100);color:var(--color-neutral-800)}
.tag-outline{border:1px solid var(--color-accent);color:var(--color-accent)}

/* ---- atom logo ---- */
.atom{position:relative}
.atom .ring{position:absolute;left:50%;top:50%;border-radius:50%}
.atom .ring.a{border:3px solid var(--sky);animation:orbitA 14s linear infinite}
.atom .ring.b{border:3px solid var(--green);animation:orbitB 11s linear infinite}
.atom .ring.c{border:3px solid var(--orange);animation:orbitC 17s linear infinite}
.atom .nucleus{position:absolute;left:50%;top:50%;background:#f0862f;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 16px 4px rgba(240,134,47,.7)}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;flex-shrink:0}
.topbar .brand{font-family:var(--font-heading);font-weight:600;font-size:18px}
.icon-btn{width:32px;height:32px;border:1px solid var(--color-divider);display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ---- bottom tab bar ---- */
.tabbar{display:flex;border-top:1px solid var(--color-divider);flex-shrink:0;padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:var(--color-bg)}
.tabitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--color-neutral-600)}
.tabitem.active{color:var(--color-accent-700)}
.tabitem span{font-size:9px;font-family:var(--font-heading);letter-spacing:.02em}

/* ---- views ---- */
.view-body{flex:1;overflow:auto;padding:0 18px 22px}
.stack{display:flex;flex-direction:column;gap:16px}
.footer-legal{text-align:center;padding-top:6px;border-top:1px solid var(--color-divider)}
.footer-legal .l1{font-family:var(--font-heading);font-size:10px;letter-spacing:.1em}
.footer-legal .l2{font-size:8.5px;line-height:1.35;color:var(--color-accent-700);margin-top:6px;padding:0 4px}
.footer-legal .l3{font-size:8.5px;color:var(--color-accent-700);margin-top:3px}
.back-to-platform{display:block;text-align:center;font-size:12px;color:var(--color-accent-700);margin:14px 0 4px;cursor:pointer}

/* ---- login/splash hero ---- */
.hero{flex-shrink:0;padding:30px 16px 22px;position:relative;overflow:hidden;text-align:center;background:radial-gradient(circle at 50% 35%,#1c3a5e 0%,#0d1b30 70%,#0a1526 100%);color:#fff}
.hero .kicker{font-family:var(--font-heading);font-size:12px;letter-spacing:.18em;color:var(--orange)}
.hero .title{font-family:var(--font-heading);font-size:28px;font-weight:600;margin-top:2px}
.hero .title .v{color:#e6672f}
.hero .tag{font-family:var(--font-heading);font-size:11px;letter-spacing:.1em;color:var(--green);margin-top:4px}

/* ---- spinner / toast ---- */
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1d1f20;color:#fff;padding:10px 18px;font-size:13px;border-radius:4px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.msg{font-size:12.5px;margin-top:2px;min-height:16px}
.msg.ok{color:#1a7a3c}
.msg.err{color:var(--danger)}
</style>
</head>
<body>

<div id="app-root"></div>
<div class="toast" id="toast"></div>

<script>
const API_BASE = 'https://api.imatomstech.com/api';
const LS = { token:'imatoms_jwt', refresh:'imatoms_refresh', user:'imatoms_user', lang:'imatoms_mobile_lang' };

function getToken(){ try{ return localStorage.getItem(LS.token); }catch(e){ return null; } }
function getUser(){ try{ return JSON.parse(localStorage.getItem(LS.user)||'null'); }catch(e){ return null; } }
function setSession(token, refresh, user){ try{ localStorage.setItem(LS.token, token); if(refresh) localStorage.setItem(LS.refresh, refresh); localStorage.setItem(LS.user, JSON.stringify(user)); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(LS.token); localStorage.removeItem(LS.refresh); localStorage.removeItem(LS.user); }catch(e){} }

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const token = getToken();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(res.status === 401){ clearSession(); ST.screen='login'; ST.tab='home'; render(); throw new Error((data && data.error) || 'Session expired — please sign in again'); }
  if(!res.ok) throw new Error((data && data.error) || ('Request failed (' + res.status + ')'));
  return data;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._h); toast._h=setTimeout(function(){t.classList.remove('show');},2600); }

/* ============== state ============== */
const ST = {
  lang: (function(){ try{ return localStorage.getItem(LS.lang) || 'th'; }catch(e){ return 'th'; } })(),
  screen: (getToken() && getUser()) ? 'main' : 'login',
  authMode: 'login',
  tab: 'home',
  lifestyleSub: 'market',
  showPassword: false,
  loginBusy:false, loginMsg:'', loginErr:false,
  regBusy:false, regMsg:'', regErr:false,
  dash: null,
};

function setLang(l){ ST.lang = l; try{ localStorage.setItem(LS.lang, l); }catch(e){} render(); }

/* module -> real webapp URL. FM has a live app; the rest are still
   "Coming Soon" placeholder pages until their backend/app exists. */
const MODULE_URLS = {
  fm: '/TKO_iMATOMsFM/',
  iot: '/TKO_iMATOMsIoT/',
  mv: '/TKO_iMATOMsMV/',
  advisory: '/TKO_iMATOMsadV/',
  bot: '/TKO_iMATOMsBOT/',
};

/* ============== copy ============== */
function L(){
  const th = ST.lang === 'th';
  return th ? {
    backToPlatform:'← กลับสู่แพลตฟอร์ม', navHome:'หน้าหลัก', navOps:'ระบบงาน', navLifestyle:'ไลฟ์สไตล์', navProfile:'โปรไฟล์',
    homeGreeting:'สวัสดี, ' + ((getUser()&&(getUser().full_name||getUser().username)) || 'คุณผู้ใช้งาน'),
    homeRole:'TKO iMATOMs Platform · Facility & Energy',
    platformsTitle:'แพลตฟอร์มในเครือ', platformsSub:'กดเพื่อเข้าใช้งานเว็บแอปจริงของแต่ละระบบ',
    lifestyleTitle:'ไลฟ์สไตล์', open:'เปิดให้บริการ',
    marketName:'ตลาดอาหารอีสาน', marketTagline:'Isan Food Market', marketTab:'ตลาดอาหาร', marketCta:'เข้าสู่ร้านค้า',
    coffeeName:'มีแฮง คอฟฟี่', coffeeTagline:'MeeHang Coffee', coffeeTab:'คอฟฟี่', coffeeCta:'สั่งเครื่องดื่ม',
    opsTitle:'ระบบปฏิบัติการ', opsSub:'กดเพื่อเข้าใช้งานเว็บแอปจริงของแต่ละระบบ',
    kOpen:'เปิดงาน', kProgress:'กำลังดำเนินการ', kPm:'PM ครบกำหนด (30 วัน)', kNotif:'แจ้งเตือนที่ยังไม่อ่าน',
    profileTitle:'โปรไฟล์', profileLang:'ภาษา', profileAccess:'สิทธิ์การเข้าใช้งาน', granted:'อนุญาต', signOut:'ออกจากระบบ',
    loginTitle:'เข้าสู่ระบบ', loginSub:'สำหรับผู้ใช้งานที่ได้รับอนุมัติแล้วเท่านั้น',
    username:'ชื่อผู้ใช้งาน', password:'รหัสผ่าน', signIn:'Login',
    noAccount:'ยังไม่มีบัญชี?', registerLink:'ขอสิทธิ์เข้าใช้งาน', haveAccount:'มีบัญชีอยู่แล้ว?', loginLink:'เข้าสู่ระบบ',
    fullName:'ชื่อ-นามสกุล', email:'อีเมล', approvalNote:'คำขอของคุณจะถูกส่งให้ผู้ดูแลระบบตรวจสอบและอนุมัติก่อนจึงจะสามารถเข้าใช้งานได้', submitRequest:'ส่งคำขอเข้าใช้งาน',
    splashSelect:'เลือกภาษา · Select your language', splashTh:'ภาษาไทย', splashEn:'English',
  } : {
    backToPlatform:'← Back to Platform', navHome:'Home', navOps:'Operations', navLifestyle:'Lifestyle', navProfile:'Profile',
    homeGreeting:'Welcome back, ' + ((getUser()&&(getUser().full_name||getUser().username)) || 'User'),
    homeRole:'TKO iMATOMs Platform · Facility & Energy',
    platformsTitle:'Platforms', platformsSub:'Tap to open the real web app for each system',
    lifestyleTitle:'Lifestyle', open:'Open',
    marketName:'Isan Food Market', marketTagline:'ตลาดอาหารอีสาน', marketTab:'Food Market', marketCta:'Enter Store',
    coffeeName:'MeeHang Coffee', coffeeTagline:'มีแฮง คอฟฟี่', coffeeTab:'Coffee', coffeeCta:'Order Now',
    opsTitle:'Operations', opsSub:'Tap to open the real web app for each system',
    kOpen:'Open', kProgress:'In Progress', kPm:'PM Due (30 days)', kNotif:'Unread Notifications',
    profileTitle:'Profile', profileLang:'Language', profileAccess:'Module Access', granted:'Granted', signOut:'Sign Out',
    loginTitle:'Sign In', loginSub:'Access is limited to approved users only.',
    username:'Username', password:'Password', signIn:'Login',
    noAccount:"Don't have an account?", registerLink:'Request Access', haveAccount:'Already have an account?', loginLink:'Sign In',
    fullName:'Full Name', email:'Email', approvalNote:'Your request will be reviewed and must be approved by an administrator before access is granted.', submitRequest:'Submit Request',
    splashSelect:'เลือกภาษา · Select your language', splashTh:'ภาษาไทย', splashEn:'English',
  };
}

function opsModules(){
  const th = ST.lang==='th';
  return [
    { key:'fm', code:'FM', name:'iMATOMs FM', tagline: th?'บริหารจัดการอาคาร':'Facility Management', status: th?'พร้อมใช้งาน':'Available', tagClass:'tag-accent' },
    { key:'iot', code:'IoT', name:'iMATOMs IoT', tagline: th?'ตรวจสอบ & แจ้งเตือน':'Monitoring & Alerts', status: th?'เร็วๆ นี้':'Coming Soon', tagClass:'tag-neutral' },
    { key:'mv', code:'M&V', name:'iMATOMs M&V', tagline: th?'วัดผลและทวนสอบพลังงาน':'Measurement & Verification', status: th?'เร็วๆ นี้':'Coming Soon', tagClass:'tag-neutral' },
    { key:'advisory', code:'ADV', name:'iMATOMs Advisory', tagline: th?'ที่ปรึกษา & รางวัล':'Energy Consulting & Awards', status: th?'เร็วๆ นี้':'Coming Soon', tagClass:'tag-neutral' },
    { key:'bot', code:'BOT', name:'iMATOMs BOT', tagline: th?'หุ่นยนต์ & ระบบอัตโนมัติ':'Automation Fleet', status: th?'เร็วๆ นี้':'Coming Soon', tagClass:'tag-neutral' },
  ];
}

/* ============== atom logo html ============== */
function atomHtml(size, ringW, ringH, dot){
  return '<div class="atom" style="width:'+size+'px;height:'+size+'px;margin:0 auto">'
    +'<div class="ring a" style="width:'+ringW+'px;height:'+ringH+'px;margin:'+(-ringH/2)+'px 0 0 '+(-ringW/2)+'px"></div>'
    +'<div class="ring b" style="width:'+ringW+'px;height:'+ringH+'px;margin:'+(-ringH/2)+'px 0 0 '+(-ringW/2)+'px"></div>'
    +'<div class="ring c" style="width:'+ringW+'px;height:'+ringH+'px;margin:'+(-ringH/2)+'px 0 0 '+(-ringW/2)+'px"></div>'
    +'<div class="nucleus" style="width:'+dot+'px;height:'+dot+'px"></div>'
    +'</div>';
}
function footerLegalHtml(){
  return '<div class="footer-legal">'
    +'<div class="l1"><span style="color:var(--color-neutral-700)">TKO GROUP · </span><span style="color:var(--orange)">TECHNOLOGY</span><span style="color:var(--color-neutral-700)"> · </span><span style="color:#a86fe6">INNOVATION</span><span style="color:var(--color-neutral-700)"> · </span><span style="color:var(--sky)">SUSTAINABILITY</span></div>'
    +'<div class="l2">iMATOMs – Integrated Maintenance Analytics Technical Operations Management and Safety</div>'
    +'<div class="l3">MR.KITTANAN ONSEE | Copyright - Edition V3.0-2026</div>'
    +'</div>';
}
function segLangHtml(){
  const th = ST.lang==='th';
  return '<div class="seg" style="font-size:11px">'
    +'<div class="seg-opt tap '+(th?'active':'')+'" data-act="lang-th">TH</div>'
    +'<div class="seg-opt tap '+(!th?'active':'')+'" data-act="lang-en">EN</div>'
    +'</div>';
}

/* ============== screens ============== */
function screenLogin(){
  const t = L();
  const pwIconEye = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12s4-8 10-8 10 8 10 8-4 8-10 8-10-8-10-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
  const pwIconOff = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17.94 17.94A10.94 10.94 0 0112 20c-6 0-10-6-10-8a17.6 17.6 0 013.06-4.06M9.9 4.24A10.94 10.94 0 0112 4c6 0 10 6 10 8a17.6 17.6 0 01-1.67 2.68"></path><path d="M9.9 9.9a3 3 0 104.2 4.2"></path><path d="M1 1l22 22"></path></svg>';
  const isLoginMode = ST.authMode === 'login';
  return '<div style="display:flex;flex-direction:column;min-height:100vh">'
    +'<div class="hero">'
    + atomHtml(96,84,32,18)
    +'<div class="kicker">TKO · IMATOMS TECH</div>'
    +'<div class="title">Platform <span class="v">V3.0</span></div>'
    +'<div class="tag">TOWARDS SUSTAINABLE ORGANIZATION · 2026</div>'
    +'</div>'
    +'<div style="flex:1;padding:22px 22px 24px;display:flex;flex-direction:column;gap:16px">'
    +'<div><h2 style="font-size:22px;margin-bottom:2px">'+t.loginTitle+'</h2><div style="font-size:12px;color:var(--color-neutral-700)">'+t.loginSub+'</div></div>'
    + (isLoginMode ? (
      '<form id="login-form" style="display:flex;flex-direction:column;gap:12px">'
      +'<div class="field"><label>'+t.username+'</label><input class="input" id="li-user" autocomplete="username" required></div>'
      +'<div class="field"><label>'+t.password+'</label><div style="position:relative"><input class="input" type="'+(ST.showPassword?'text':'password')+'" id="li-pass" autocomplete="current-password" style="padding-right:36px" required>'
      +'<div class="tap" data-act="toggle-pw" style="position:absolute;right:8px;top:0;bottom:0;display:flex;align-items:center;color:var(--color-accent-700)">'+(ST.showPassword?pwIconOff:pwIconEye)+'</div></div></div>'
      +'<button type="submit" class="btn btn-primary btn-block" id="li-submit" '+(ST.loginBusy?'disabled':'')+'>'+(ST.loginBusy?'<span class="spinner"></span>':'')+t.signIn+'</button>'
      +'<div class="msg '+(ST.loginErr?'err':'ok')+'">'+esc(ST.loginMsg||'')+'</div>'
      +'<div style="text-align:center;font-size:12px;color:var(--color-neutral-700)">'+t.noAccount+' <span class="tap" data-act="to-register" style="color:var(--color-accent-700);font-weight:600">'+t.registerLink+'</span></div>'
      +'</form>'
    ) : (
      '<form id="register-form" style="display:flex;flex-direction:column;gap:12px">'
      +'<div class="field"><label>'+t.fullName+'</label><input class="input" id="rg-name" required></div>'
      +'<div class="field"><label>'+t.email+'</label><input class="input" type="email" id="rg-email" required></div>'
      +'<div class="field"><label>'+t.username+'</label><input class="input" id="rg-user" required></div>'
      +'<div class="field"><label>'+t.password+'</label><input class="input" type="password" id="rg-pass" required></div>'
      +'<div class="blueprint" style="padding:10px 12px"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><div style="font-size:11px;color:var(--color-neutral-700)">'+t.approvalNote+'</div></div>'
      +'<button type="submit" class="btn btn-primary btn-block" id="rg-submit" '+(ST.regBusy?'disabled':'')+'>'+(ST.regBusy?'<span class="spinner"></span>':'')+t.submitRequest+'</button>'
      +'<div class="msg '+(ST.regErr?'err':'ok')+'">'+esc(ST.regMsg||'')+'</div>'
      +'<div style="text-align:center;font-size:12px;color:var(--color-neutral-700)">'+t.haveAccount+' <span class="tap" data-act="to-login" style="color:var(--color-accent-700);font-weight:600">'+t.loginLink+'</span></div>'
      +'</form>'
    ))

/* ============== render + events ============== */
function render(){
  let html = '';
  if(ST.screen === 'login') html = screenLogin();
  else if(ST.screen === 'splash') html = screenSplash();
  else html = screenMain();
  document.getElementById('app-root').innerHTML = html;
  bindFormHandlers();
  document.documentElement.lang = ST.lang;
}

function bindFormHandlers(){
  const lf = document.getElementById('login-form');
  if(lf) lf.addEventListener('submit', onLoginSubmit);
  const rf = document.getElementById('register-form');
  if(rf) rf.addEventListener('submit', onRegisterSubmit);
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.getAttribute('data-act');
  if(act==='lang-th') setLang('th');
  else if(act==='lang-en') setLang('en');
  else if(act==='toggle-pw'){ ST.showPassword = !ST.showPassword; render(); }
  else if(act==='to-register'){ ST.authMode='register'; ST.regMsg=''; render(); }
  else if(act==='to-login'){ ST.authMode='login'; ST.loginMsg=''; render(); }
  else if(act==='splash-th'){ ST.lang='th'; try{localStorage.setItem(LS.lang,'th');}catch(err){} ST.screen='main'; render(); }
  else if(act==='splash-en'){ ST.lang='en'; try{localStorage.setItem(LS.lang,'en');}catch(err){} ST.screen='main'; render(); }
  else if(act==='tab-home'){ ST.tab='home'; render(); if(!ST.dash) loadDashboard(); }
  else if(act==='tab-ops'){ ST.tab='ops'; render(); }
  else if(act==='tab-lifestyle'){ ST.tab='lifestyle'; render(); }
  else if(act==='tab-profile'){ ST.tab='profile'; render(); }
  else if(act==='open-module'){ const key = el.getAttribute('data-key'); const url = MODULE_URLS[key]; if(url) window.location.href = url; }
  else if(act==='lifestyle-market'){ ST.lifestyleSub='market'; render(); }
  else if(act==='lifestyle-coffee'){ ST.lifestyleSub='coffee'; render(); }
  else if(act==='goto-market'){ window.location.href = '/TKO_IsanFoodMarket/'; }
  else if(act==='goto-coffee'){ window.location.href = '/TKO_MeeHangCoffee/'; }
  else if(act==='logout'){ doLogout(); }
});

/* ============== auth actions ============== */
async function onLoginSubmit(e){
  e.preventDefault();
  const user = document.getElementById('li-user').value.trim();
  const pass = document.getElementById('li-pass').value;
  ST.loginBusy = true; ST.loginMsg=''; ST.loginErr=false; render();
  try{
    const data = await api('/auth/login', { method:'POST', body: JSON.stringify({ username:user, password:pass }) });
    setSession(data.token, data.refresh_token, data.user);
    ST.loginBusy=false; ST.loginErr=false; ST.loginMsg = (ST.lang==='th'?'ยินดีต้อนรับ ':'Welcome, ') + (data.user.full_name||data.user.username);
    setTimeout(function(){ ST.screen='splash'; render(); }, 350);
  }catch(err){
    ST.loginBusy=false; ST.loginErr=true; ST.loginMsg = err.message || (ST.lang==='th'?'เข้าสู่ระบบไม่สำเร็จ':'Login failed'); render();
  }
}
async function onRegisterSubmit(e){
  e.preventDefault();
  const body = {
    full_name: document.getElementById('rg-name').value.trim(),
    email: document.getElementById('rg-email').value.trim(),
    username: document.getElementById('rg-user').value.trim(),
    password: document.getElementById('rg-pass').value,
  };
  ST.regBusy = true; ST.regMsg=''; ST.regErr=false; render();
  try{
    await api('/auth/register', { method:'POST', body: JSON.stringify(body) });
    ST.regBusy=false; ST.regErr=false; ST.regMsg = ST.lang==='th' ? 'ส่งคำขอสำเร็จ กรุณารอการอนุมัติจากผู้ดูแลระบบ' : 'Request submitted — please wait for administrator approval.';
    render();
  }catch(err){
    ST.regBusy=false; ST.regErr=true; ST.regMsg = err.message || (ST.lang==='th'?'ส่งคำขอไม่สำเร็จ':'Request failed'); render();
  }
}
async function doLogout(){
  try{ await api('/auth/logout', { method:'POST', body: JSON.stringify({ refresh_token: localStorage.getItem(LS.refresh) }) }); }catch(e){}
  clearSession();
  ST.screen='login'; ST.tab='home'; ST.authMode='login'; ST.dash=null;
  render();
}

/* ============== data loads ============== */
async function loadDashboard(){
  try{ ST.dash = await api('/dashboard'); render(); }catch(err){ /* non-fatal */ }
}

/* ============== boot ============== */
(function boot(){
  render();
  if(ST.screen === 'main') loadDashboard();
})();
</script>
