<style>
:root{
  --color-bg:#f2f2f3; --color-surface:#e9e9ea; --color-text:#1d1f20;
  --color-accent:#5980a6; --color-accent-2:#728fab;
  --color-divider:rgba(29,31,32,.16);
  --color-neutral-100:#f5f5f8; --color-neutral-200:#e7e7ea; --color-neutral-300:#d4d4d7;
  --color-neutral-500:#98989b; --color-neutral-600:#7a7a7d; --color-neutral-700:#5d5d60; --color-neutral-800:#424244;
  --color-accent-100:#eef6ff; --color-accent-400:#94bce3; --color-accent-600:#597ea3; --color-accent-700:#416180; --color-accent-800:#2c455d;
  --color-accent-2-100:#eef6ff; --color-accent-2-800:#314457;
  --font-heading:"Barlow Condensed",system-ui,sans-serif; --font-body:"Barlow",system-ui,sans-serif;
  --danger:#c0392b; --orange:#e69a3c; --green:#4fd17a; --sky:#5aa9e6;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:17px;line-height:1.5}
h1,h2,h3,h4,h5{font-family:var(--font-heading);font-weight:600;line-height:1.12;letter-spacing:-.01em;margin:0}
a{color:inherit;text-decoration:none}
.tap{cursor:pointer}
@keyframes orbitA{from{transform:rotate(20deg)}to{transform:rotate(380deg)}}
@keyframes orbitB{from{transform:rotate(-40deg)}to{transform:rotate(320deg)}}
@keyframes orbitC{from{transform:rotate(100deg)}to{transform:rotate(460deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- shell ----
   Was a hard max-width:480px, which reads fine on a narrow phone in portrait
   but centers a narrow letterboxed column (gray bars both sides) on anything
   wider — a phone rotated to landscape (many run 700-930px CSS-wide) or a
   notebook browser window — since the cap kicks in at 481px regardless of
   what kind of device it is. Raised the cap so it only ever constrains truly
   wide desktop windows; phones stay full-bleed in both orientations, and a
   notebook window narrower than the cap now fills edge-to-edge too. The
   cosmetic "phone card on a gray desk" treatment (background + shadow) is
   pushed out to the same breakpoint so it doesn't show up on phones. */
#app-root{width:100%;max-width:900px;margin:0 auto;min-height:100vh;background:var(--color-bg);display:flex;flex-direction:column}
@media(min-width:901px){ body{background:#dfe1e4} #app-root{min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.08)} }

/* ---- blueprint card ---- */
.blueprint{position:relative;border:1px solid var(--color-divider);border-radius:6px;overflow:hidden}
.blueprint>.corner{display:none}

/* tappable card hover/press: raised (embossed) feel + accent strip.
   Uses :hover for mouse (desktop/tablet) AND :active for touch (phones
   have no hover state), so the effect works on tap too. */
.blueprint.tap{transition:transform .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease}
.blueprint.tap::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--color-accent);transform:scaleY(0);transform-origin:top;transition:transform .15s ease}
.blueprint.tap:hover,.blueprint.tap:active{transform:translateY(-3px);box-shadow:0 10px 20px -6px rgba(29,31,32,.25),0 1px 0 rgba(255,255,255,.6) inset;background-color:#fff;border-color:var(--color-accent)}
.blueprint.tap:hover::after,.blueprint.tap:active::after{transform:scaleY(1)}
.blueprint.tap:hover *,.blueprint.tap:active *{text-shadow:0 1px 0 rgba(255,255,255,.8)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--font-heading);font-weight:600;font-size:16px;color:var(--color-text);background:transparent;border:1px solid var(--color-divider);padding:9px 16px;border-radius:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--color-accent);color:#fff;border-color:var(--color-accent)}
.btn-primary:not(:disabled):hover{background:var(--color-accent-600)}
.btn-secondary:not(:disabled):hover{background:rgba(29,31,32,.06)}
.btn-block{width:100%;margin-top:6px}

/* ---- forms ---- */
.field>label{display:block;font-size:14px;margin-bottom:5px;color:rgba(29,31,32,.7)}
.field{margin-bottom:12px}
.input{width:100%;min-height:38px;padding:8px 10px;font:inherit;font-size:16px;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:0}
.input:focus-visible{outline:none;border-color:var(--color-accent)}
textarea.input{min-height:80px;resize:vertical}

/* ---- seg control ---- */
.seg{display:inline-flex;overflow:hidden;border:1px solid var(--color-divider)}
.seg-opt{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:15px;cursor:pointer}
.seg-opt+.seg-opt{border-left:1px solid var(--color-divider)}
.seg-opt.active{background:var(--color-accent);color:#fff}

/* ---- tags ---- */
.tag{display:inline-flex;align-items:center;font-size:13px;letter-spacing:.02em;padding:3px 10px;border-radius:2px}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800)}
.tag-neutral{background:var(--color-neutral-100);color:var(--color-neutral-800)}
.tag-outline{border:1px solid var(--color-accent);color:var(--color-accent)}

/* ---- atom logo ---- */
.atom{position:relative}
.atom .ring{position:absolute;left:50%;top:50%;border-radius:50%}
.atom .ring.a{border:3px solid var(--sky);animation:orbitA 14s linear infinite}
.atom .ring.b{border:3px solid var(--green);animation:orbitB 11s linear infinite}
.atom .ring.c{border:3px solid var(--orange);animation:orbitC 17s linear infinite}
.atom .nucleus{position:absolute;left:50%;top:50%;background:#f0862f;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 16px 4px rgba(240,134,47,.7)}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;flex-shrink:0}
.topbar .brand{font-family:var(--font-heading);font-weight:600;font-size:18px}
.icon-btn{width:32px;height:32px;border:1px solid var(--color-divider);display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ---- bottom tab bar ---- */
.tabbar{display:flex;border-top:1px solid var(--color-divider);flex-shrink:0;padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:var(--color-bg)}
.tabitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--color-neutral-600)}
.tabitem.active{color:var(--color-accent-700)}
.tabitem span{font-size:11px;font-family:var(--font-heading);letter-spacing:.02em}

/* ---- views ---- */
.view-body{flex:1;overflow:auto;padding:0 18px 22px}
.stack{display:flex;flex-direction:column;gap:16px}
.footer-legal{text-align:center;padding-top:6px;border-top:1px solid var(--color-divider)}
.footer-legal .l1{font-family:var(--font-heading);font-size:12px;letter-spacing:.1em}
.footer-legal .l2{font-size:10.5px;line-height:1.35;color:var(--color-accent-700);margin-top:6px;padding:0 4px}
.footer-legal .l3{font-size:10.5px;color:var(--color-accent-700);margin-top:3px}
.back-to-platform{display:block;text-align:center;font-size:14px;color:var(--color-accent-700);margin:14px 0 4px;cursor:pointer}

/* ---- login/splash hero ---- */
.hero{flex-shrink:0;padding:30px 16px 22px;position:relative;overflow:hidden;text-align:center;background:radial-gradient(circle at 50% 35%,#1c3a5e 0%,#0d1b30 70%,#0a1526 100%);color:#fff}
.hero .kicker{font-family:var(--font-heading);font-size:14px;letter-spacing:.18em;color:var(--orange)}
.hero .title{font-family:var(--font-heading);font-size:28px;font-weight:600;margin-top:2px}
.hero .title .v{color:#e6672f}
.hero .tag{font-family:var(--font-heading);font-size:13px;letter-spacing:.1em;color:var(--green);margin-top:4px}

/* ---- spinner / toast ---- */
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1d1f20;color:#fff;padding:10px 18px;font-size:15px;border-radius:4px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.msg{font-size:14.5px;margin-top:2px;min-height:16px}
.msg.ok{color:#1a7a3c}
.msg.err{color:var(--danger)}
</style>

<script>
const API_BASE = 'https://api.imatomstech.com/api';
const LS = { token:'imatoms_jwt', refresh:'imatoms_refresh', user:'imatoms_user', lang:'imatoms_mobile_lang' };

function getToken(){ try{ return localStorage.getItem(LS.token); }catch(e){ return null; } }
function getUser(){ try{ return JSON.parse(localStorage.getItem(LS.user)||'null'); }catch(e){ return null; } }
function setSession(token, refresh, user){ try{ localStorage.setItem(LS.token, token); if(refresh) localStorage.setItem(LS.refresh, refresh); localStorage.setItem(LS.user, JSON.stringify(user)); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(LS.token); localStorage.removeItem(LS.refresh); localStorage.removeItem(LS.user); }catch(e){} }

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const token = getToken();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(res.status === 401){ clearSession(); ST.screen='login'; ST.tab='home'; render(); throw new Error((data && data.error) || 'Session expired — please sign in again'); }
  if(!res.ok) throw new Error((data && data.error) || ('Request failed (' + res.status + ')'));
  return data;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._h); toast._h=setTimeout(function(){t.classList.remove('show');},2600); }

/* ============== state ============== */

/* ============== atom logo html ============== */
function atomHtml(size, ringW, ringH, dot){
  return '<div class="atom" style="width:'+size+'px;height:'+size+'px;margin:0 auto">'
    +'<div class="ring a" style="width:'+ringW+'px;height:'+ringH+'px;margin:'+(-ringH/2)+'px 0 0 '+(-ringW/2)+'px"></div>'

// ── Availability % (fleet-wide proxy) — same formula as the desktop
// Reliability Module, so the two apps always show a consistent number.
// No per-asset uptime log exists, so this proxies availability from the
// repair time (MTTR) already recorded against WRs closed in the window.
function computeAvailability(periodDays, sinceDate, untilDate){
  const days = periodDays || 30;
  const until = untilDate ? new Date(untilDate) : new Date();
  const since = sinceDate ? new Date(sinceDate) : new Date(until.getTime() - days*86400000);
  const closed = wrData().filter(function(w){
    if (w.status!=='closed' && w.status!=='approved') return false;
    if (!w.date) return false;
    const d = new Date(w.date);
    return d>=since && d<=until;
  });
  const downtimeHr = closed.reduce(function(s,w){ return s+(parseFloat(w.mttr)||0); }, 0);
  const capacityHr = days*24;
  const pct = capacityHr>0 ? Math.max(0, Math.min(100, 100 - (downtimeHr/capacityHr)*100)) : 100;
  return { pct: parseFloat(pct.toFixed(2)), downtimeHr: parseFloat(downtimeHr.toFixed(2)), capacityHr: capacityHr, wrCount: closed.length };
}

// Top-N failure causes among closed WRs that have failureCause set (from the
// Close Detail dropdown — mirrors CLOSE_FAILCAUSE_OPTIONS labels).
function computeFailureCauseBreakdown(topN){
  const labelMap = {}; CLOSE_FAILCAUSE_OPTIONS.forEach(function(o){ labelMap[o[0]]=o[1]; });
  const th = ST.lang==='th';
  const counts = {};
  wrData().filter(function(w){ return (w.status==='closed'||w.status==='approved') && w.failureCause; }).forEach(function(w){
    counts[w.failureCause] = (counts[w.failureCause]||0) + 1;
  });
  const rows = Object.keys(counts).map(function(k){
    const lbl = labelMap[k]; return { code:k, label: lbl?(th?lbl.th:lbl.en):k, count: counts[k] };
  }).sort(function(a,b){ return b.count-a.count; });
  return topN ? rows.slice(0, topN) : rows;
}

/* FM shares its real operating data with the webapp via the same-origin
   localStorage store the webapp itself uses (key prefix 'tko_v2_') —
   this is a genuine live connection, not a copy: WR/PPM/MA/Inventory
   edits made in the webapp appear here immediately, and vice versa. */
function fmDB(k){
  /* the webapp mirrors wr/assets/ppm/ma/inv/contract/operation from its
     'tko_v2_' store into an 'alm_' store for the richer Reliability
     module (Evaluate&Approve, SLA, Maintainability, Repeated Repairs...).
     Prefer 'alm_' since it carries the fuller status workflow
     (open/inprogress/arrived/closed/approved), fall back to 'tko_v2_'. */
  try{
    const a = localStorage.getItem('alm_'+k);
    if(a){ const parsed = JSON.parse(a); if(Array.isArray(parsed) && parsed.length) return parsed; }
  }catch(e){}
  try{ const v = localStorage.getItem('tko_v2_'+k); return v ? JSON.parse(v) : []; }catch(e){ return []; }
}

/* WR is wired to the real backend (/api/work-orders on api.imatomstech.com) —
   the same endpoint the FM webapp's WR module now writes to — so this is a
   genuine live connection across devices, not a localStorage copy. */
function normalizeWO(r){
  // meta first (building/floor/zone/room/locationDetail/availableTime — the extra
  // fields the Reliability Module captures that don't have their own DB column),
  // then the real typed columns layered on top so the database stays authoritative
  // for anything it actually tracks. Same recovery pattern as the Reliability Module.
  return Object.assign({}, r.meta || {}, {
    id:r.wo_no, _dbId:r.id, assetId:r.asset_no||r.asset_name||(r.asset_id?('#'+r.asset_id):null)||(r.meta&&r.meta.assetId)||null,
    desc:r.description, type:r.wo_type, priority:r.priority, reporter:r.reporter_name||r.requested_name,

   /api/fm-records/:kind backend the FM webapp and Reliability Module use —

   the localStorage snapshot (fmDB) while loading or if offline. */
function fmKindData(kind){ return (ST.modData.fm && ST.modData.fm[kind]) || null; }
async function loadFmKind(kind){
  ST.modLoading[kind] = true; render();

    const rows = await api('/fm-records/' + kind);

/* Write-back for the same generic /api/fm-records/:kind store — upserts one
   item locally (so the UI reflects it immediately) and pushes it to the real
   backend, same endpoint the Reliability Module's DB.set() uses. Used by
   OM's Checklist Setup / OM Setting / New-OM-submit so Mobile edits are a
   genuine two-way connection with the webapp, not a one-way read. */
async function fmSyncKind(kind, item){
  ST.modData.fm = ST.modData.fm || {};
  const arr = (ST.modData.fm[kind] || fmKindData(kind) || fmDB(kind) || []).slice();
  const idx = arr.findIndex(function(x){ return String(x.id)===String(item.id); });
  if(idx>=0) arr[idx] = item; else arr.unshift(item);
  ST.modData.fm[kind] = arr;
  try{ await api('/fm-records/'+kind+'/sync', { method:'POST', body: JSON.stringify({ items:[item] }) }); }catch(e){ /* local copy still updated; best-effort push */ }
  return arr;
}
async function fmDeleteKind(kind, id){
  ST.modData.fm = ST.modData.fm || {};
  const arr = (ST.modData.fm[kind] || fmKindData(kind) || fmDB(kind) || []).filter(function(x){ return String(x.id)!==String(id); });
  ST.modData.fm[kind] = arr;
  try{ await api('/fm-records/'+kind+'/'+encodeURIComponent(id), { method:'DELETE' }); }catch(e){}
  return arr;
}

function toLocalInputVal(iso){

  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}

function wrCloseSigPos(canvas, evt){
  const r = canvas.getBoundingClientRect();
  const t = (evt.touches && evt.touches[0]) || evt;
  return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
}
function wrCloseSigInit(){
  const canvas = document.getElementById('wr-cl-sigpad');
  if(!canvas || canvas._wrBound) return;
  canvas._wrBound = true;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#1d1f20'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  function down(e){ wrCloseSigDrawing = true; wrCloseSigLast = wrCloseSigPos(canvas, e); e.preventDefault(); }
  function move(e){
    if(!wrCloseSigDrawing) return;
    const p = wrCloseSigPos(canvas, e);
    ctx.beginPath(); ctx.moveTo(wrCloseSigLast.x, wrCloseSigLast.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    wrCloseSigLast = p; e.preventDefault();
  }
  function up(){ wrCloseSigDrawing = false; }
  canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  canvas.addEventListener('touchstart', down, {passive:false}); canvas.addEventListener('touchmove', move, {passive:false}); canvas.addEventListener('touchend', up);
}

async function wrCloseSubmit(){

  const dbId = ST.wrCloseId;
  const w = wrData().find(function(x){ return String(x._dbId)===String(dbId); });
  const worktype = (document.getElementById('wr-cl-worktype')||{}).value;
  const system = (document.getElementById('wr-cl-system')||{}).value;
  const failureCause = (document.getElementById('wr-cl-failcause')||{}).value || null;
  const startVal = (document.getElementById('wr-cl-start')||{}).value;
  const endVal = (document.getElementById('wr-cl-end')||{}).value;
  const action = (document.getElementById('wr-cl-action')||{}).value || '';
  const techName = wrCloseTechs.length ? wrCloseTechs.join(', ') : '';
  const labor = parseFloat((document.getElementById('wr-cl-labor')||{}).value)||0;
  const travel = parseFloat((document.getElementById('wr-cl-travel')||{}).value)||0;
  const partsCost = wrClosePartsCost();
  const mttrMin = (startVal && endVal) ? Math.round((new Date(endVal)-new Date(startVal))/60000) : null;
  const mttrHours = (mttrMin!=null && mttrMin>=0) ? Math.round((mttrMin/60)*100)/100 : 1;
  const wasApproved = !!(w && w.approvedBy);
  ST.wrCloseBusy = true; render();
  try{
    await api('/work-orders/'+dbId+'/status', { method:'PATCH', body: JSON.stringify({
      status:'closed', labor_hours: labor+travel, parts_cost: partsCost, mttr_hours: mttrHours, action_taken: action||null,
      clear_approval: wasApproved
    }) });
    // Extra detail the typed columns don't have a slot for — merged into meta
    // via the sync endpoint, same lossless pattern used across this app.
    if (w) {
      try{
        await api('/work-orders/sync', { method:'POST', body: JSON.stringify({ items: [{
          id: w.id, assetId: w.assetId, desc: w.desc, type: worktype||w.type, priority: w.priority,
          reporter: w.reporter||null, phone: w.phone||null, status:'closed',
          assign: techName||w.assign||undefined,
          worktype: worktype||undefined, system: system||undefined, failureCause: failureCause||undefined,
          startTime: startVal?new Date(startVal).toISOString():undefined, endTime: endVal?new Date(endVal).toISOString():undefined,
          mttr: mttrHours, totalCost: labor+travel+partsCost,
          laborCost: labor, travelCost: travel, partsCost: partsCost,
          partsUsed: wrClosePartsUsed.length?wrClosePartsUsed:undefined,
          photos: wrClosePhotos.length?wrClosePhotos.map(function(p){return p.dataUrl;}):undefined,
          signature: (function(){ const c=document.getElementById('wr-cl-sigpad'); return c?c.toDataURL():undefined; })(),
          satisfaction: wrCloseStars||undefined, closeDetail: action||undefined,

          // — clear it here too so an edited WR doesn't still show as approved.
          approvedBy: wasApproved ? null : undefined
        }] }) });
      }catch(e){ /* WR is already closed server-side; extra detail merge is best-effort */ }
    }
    ST.wrCloseId = null; ST.wrCloseBusy = false;
    toast(wasApproved
      ? (th?'✅ แก้ไขข้อมูลแล้ว — ต้องรออนุมัติใหม่':'✅ Updated — needs re-approval')
      : (th?'✅ ปิดงานสำเร็จ — รอ Manager อนุมัติ':'✅ Closed — pending manager approval'));
    loadFmWR();
  }catch(err){
    ST.wrCloseBusy = false; render();
    toast((th?'ปิดงานไม่สำเร็จ: ':'Close failed: ')+(err.message||err));
  }
}

async function wrEvalApprove(dbId, role){
  const th = ST.lang==='th';

  if(!wrEvalTechSigHasInk()){ toast(th?'⚠ กรุณาให้ช่างเซ็นชื่อก่อนอนุมัติ':'⚠ Please have the technician sign before approving'); return; }
  if(!wrEvalSigHasInk()){ toast(th?'⚠ กรุณาเซ็นชื่อก่อนอนุมัติ':'⚠ Please sign before approving'); return; }
  ST.wrEvalBusy = true; render();
  try{
    await api('/work-orders/'+dbId+'/evaluate', { method:'PATCH', body: JSON.stringify({ approved:true }) });
    if (w) {
      const user = getUser();
      const roleLabel = role + ': ' + ((user&&(user.full_name||user.username))||'—');
      try{
        await api('/work-orders/sync', { method:'POST', body: JSON.stringify({ items: [{
          id: w.id, assetId: w.assetId, desc: w.desc, type: w.type, priority: w.priority,
          reporter: w.reporter||null, phone: w.phone||null, status:'approved', approvedBy: roleLabel,
          evalStrength: (document.getElementById('wr-ev-strength')||{}).value || undefined,
          evalWeakness: (document.getElementById('wr-ev-weakness')||{}).value || undefined,
          evalImprove: (document.getElementById('wr-ev-improve')||{}).value || undefined,
          evalRecurring: (document.getElementById('wr-ev-recurring')||{}).value || undefined,
          evalSigApprove: (function(){ const c=document.getElementById('wr-ev-sigpad'); return c?c.toDataURL():undefined; })(),
          evalSigClose: (function(){ const c=document.getElementById('wr-ev-sigpad-tech'); return c?c.toDataURL():undefined; })(),
        }] }) });
      }catch(e){ /* approval itself already saved; extra detail merge is best-effort */ }
    }
    ST.wrEvalId = null; ST.wrEvalBusy = false;
    toast(th?('✅ '+role+' อนุมัติงานเรียบร้อย'):('✅ Approved by '+role));

    ST.wrEvalBusy = false; render();

  }
}

function wrSpark(values, color){
  if(!values.length) return '';
  const w=280,h=54,pad=4;
  const max=Math.max.apply(null, values), min=Math.min.apply(null, values);
  const range = (max-min)||1;
  const step = values.length>1 ? (w-pad*2)/(values.length-1) : 0;
  const pts = values.map(function(v,i){ const x=pad+step*i; const y=h-pad-((v-min)/range)*(h-pad*2); return x+','+y; }).join(' ');
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2"/></svg>';
}

// Condensed qualitative summary — Availability, Top-5 problem assets, and
// Failure Cause breakdown — shown above the quantity cards per the owner's
// explicit request to prioritize quality-of-maintenance signals over raw counts.
function wrQualitativeSummary(th){
  const avail = computeAvailability(30);
  const availColor = avail.pct>=95 ? 'var(--green)' : avail.pct>=85 ? 'var(--orange)' : 'var(--red)';
  const causes = computeFailureCauseBreakdown(5);
  const byAsset = {};
  wrData().forEach(function(w){ if(!w.assetId) return; byAsset[w.assetId]=(byAsset[w.assetId]||0)+1; });
  const topAssets = Object.keys(byAsset).map(function(k){return {assetId:k,cnt:byAsset[k]};}).sort(function(a,b){return b.cnt-a.cnt;}).slice(0,5);

  const availCard = '<div class="blueprint" style="padding:12px;text-align:center"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>'
    +'<div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700)">'+(th?'ความพร้อมใช้งาน (30 วัน)':'Availability (30d)')+'</div>'
    +'<div style="font-family:var(--font-heading);font-size:30px;margin-top:2px;color:'+availColor+'">'+avail.pct+'%</div>'
    +'<div style="font-size:12px;color:var(--color-neutral-600);margin-top:2px">'+(th?'ซ่อม':'downtime')+' '+avail.downtimeHr+'h / '+avail.wrCount+' WR</div></div>';

  const causeRows = causes.length
    ? causes.map(function(c){ return '<div style="display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0;border-bottom:1px solid var(--color-neutral-200)"><span>'+esc(c.label)+'</span>'+fmChip(String(c.count), 'orange')+'</div>'; }).join('')
    : '<div style="font-size:13px;color:var(--color-neutral-600);padding:6px 0">'+(th?'ยังไม่มีข้อมูลสาเหตุ':'No failure-cause data yet')+'</div>';

  const assetRows = topAssets.length
    ? topAssets.map(function(a){ return '<div style="display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0;border-bottom:1px solid var(--color-neutral-200)"><span style="font-family:var(--font-heading)">'+esc(a.assetId)+'</span>'+fmChip(a.cnt+' '+(th?'ครั้ง':'x'), a.cnt>=2?'red':'gray')+'</div>'; }).join('')
    : '<div style="font-size:13px;color:var(--color-neutral-600);padding:6px 0">'+(th?'ยังไม่มีข้อมูล':'No data yet')+'</div>';

  return '<div style="margin-bottom:12px">'
    + availCard
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">'
    +'<div>'+fmCard('<div style="font-size:13px;font-weight:600;margin-bottom:2px">'+(th?'สาเหตุที่แท้จริง Top 5':'Top 5 Failure Causes')+'</div>'+causeRows)+'</div>'
    +'<div>'+fmCard('<div style="font-size:13px;font-weight:600;margin-bottom:2px">'+(th?'Asset ที่มีปัญหาบ่อย Top 5':'Top 5 Problem Assets')+'</div>'+assetRows)+'</div>'
    +'</div></div>';
}

function wrOverview(){
  const th = ST.lang==='th';
  const wr = wrData();
  const open = wr.filter(function(w){return w.status==='open';});
  const ip = wr.filter(function(w){return w.status==='inprogress'||w.status==='arrived';});
  const closed = wr.filter(function(w){return w.status==='closed'||w.status==='approved';});
  const cancelled = wr.filter(function(w){return w.status==='cancelled';});
  const mttrVals = closed.filter(function(w){return w.mttr;}).map(function(w){return w.mttr;});
  const avgMttr = mttrVals.length ? Math.round(mttrVals.reduce(function(s,v){return s+v;},0)/mttrVals.length*10)/10 : null;
  const allCost = wr.reduce(function(s,w){return s+(w.totalCost||0);},0);
  const total = wr.length || 1;
  const trendSrc = closed.slice().sort(function(a,b){ return new Date(a.closeDate||a.date||0) - new Date(b.closeDate||b.date||0); }).slice(-10).filter(function(w){return w.mttr;});
  const newBtn = '<div style="display:flex;margin-bottom:10px"><div class="tap" data-act="wr-new-open" style="font-size:14px;font-weight:700;padding:7px 12px;border-radius:8px;background:var(--color-accent);color:#fff;text-align:center">+ '+(th?'แจ้งงานใหม่':'New WR')+'</div></div>';

  return newBtn + wrQualitativeSummary(th)
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    + statCard(th?'แจ้งซ่อม':'List WR', open.length, 'new') + statCard(th?'กำลังทำ':'In Progress', ip.length, 'inprogress')
    + statCard(th?'ปิดงาน':'Closed', closed.length, 'closed') + statCard(th?'MTTR เฉลี่ย (ชม.)':'Avg MTTR (hrs)', avgMttr!=null?avgMttr:'—', 'maintain')
    +'</div>'
    +'<div style="margin-top:2px">'+statCard(th?'ค่าใช้จ่าย WR ทั้งหมด':'All WR Cost', fmMoney(allCost), 'closed')+'</div>'
    +'<div style="margin-top:6px"><h4 style="font-size:15px;margin-bottom:6px">'+(th?'สถานะงาน':'WR Status Flow')+'</h4>'
    + wrBar([
        { pct: Math.round(open.length/total*100), color:'var(--orange)' },
        { pct: Math.round(ip.length/total*100), color:'var(--sky)' },
        { pct: Math.round(closed.length/total*100), color:'var(--green)' },
        { pct: Math.round(cancelled.length/total*100), color:'var(--color-neutral-500)' },
      ])
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--color-neutral-700)">'
    +'<span class="tap" data-act="wr-sub" data-sub="new" style="cursor:pointer">🟠 '+(th?'เปิด':'Open')+' '+open.length+'</span>'
    +'<span class="tap" data-act="wr-sub" data-sub="inprogress" style="cursor:pointer">🔵 '+(th?'กำลังทำ':'In Progress')+' '+ip.length+'</span>'
    +'<span class="tap" data-act="wr-sub" data-sub="closed" style="cursor:pointer">🟢 '+(th?'ปิด':'Closed')+' '+closed.length+'</span>'
    +'<span>⚪ '+(th?'ยกเลิก':'Cancelled')+' '+cancelled.length+'</span>'
    +'</div></div>'
    + (trendSrc.length ? '<div class="tap" data-act="wr-sub" data-sub="maintain" style="margin-top:10px;cursor:pointer">'+fmCard('<div style="font-size:14px;font-weight:600;margin-bottom:4px">'+(th?'แนวโน้ม MTTR (10 งานล่าสุด)':'MTTR Trend (last 10)')+' ›</div>'+wrSpark(trendSrc.map(function(w){return w.mttr;}), 'var(--color-accent)')) +'</div>' : '');
}

function wrMaintainability(){
  const th = ST.lang==='th';
  const closed = wrData().filter(function(w){ return (w.status==='closed'||w.status==='approved') && w.mttr; });
  const withPct = closed.map(function(w){
    const target = WR_TYPE_TARGET_H[w.type] || 8;
    const pct = Math.round((1-Math.exp(-target/w.mttr))*100);
    return { w:w, pct:pct };
  });
  const avg = withPct.length ? Math.round(withPct.reduce(function(s,x){return s+x.pct;},0)/withPct.length) : null;
  return '<div>'+statCard(th?'Maintainability เฉลี่ย':'Avg Maintainability', avg!=null?avg+'%':'—')+'</div>'
    +'<div style="font-size:13px;color:var(--color-neutral-700);margin:8px 0">Maintainability = 1 − e^(−Target/MTTR)</div>'
    + (withPct.length ? '<div style="display:flex;flex-direction:column;gap:8px">' + withPct.slice(0,20).map(function(x){
        return fmCard('<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--font-heading);font-size:15px">'+esc(x.w.id)+'</span>'+fmChip(x.pct+'%', x.pct>=70?'green':x.pct>=40?'orange':'red')+'</div>'+'<div style="font-size:13px;color:var(--color-neutral-700)">MTTR '+x.w.mttr+'h · '+esc(x.w.type||'')+'</div>');
      }).join('') + '</div>' : fmEmpty(th?'ยังไม่มีข้อมูลงานที่ปิดแล้ว':'No closed work requests yet'));
}

function wrSLA(){
  const th = ST.lang==='th';
  const wr = wrData().filter(function(w){ return w.responseTime!=null && w.priority; });

    +'<div style="margin-top:10px"><h4 style="font-size:15px;margin-bottom:6px">'+(th?'รายการที่เกินเวลา':'Breaches')+'</h4>'

function wrHistory(){

function wrFLocCascade(presetRoom){
  const floorEl = document.getElementById('wr-f-floor');

  const rooms = locRoomsForFloor(floor);
  const byCat = {};
  rooms.forEach(function(r){ (byCat[r.cat] = byCat[r.cat] || []).push(r); });
  sel.innerHTML = '<option value="">'+(th?'-- เลือกพื้นที่ --':'-- select area --')+'</option>'
    + Object.keys(byCat).map(function(cat){
        return '<optgroup label="'+(th?LOC_CATS[cat].th:LOC_CATS[cat].en)+'">'
          + byCat[cat].map(function(r){ return '<option value="'+r.code+'">'+(th?r.th:r.en)+'</option>'; }).join('')
          + '</optgroup>';

// QR ติดหน้าห้อง เก็บแค่รหัสสั้นๆ รูปแบบ LOC:อาคาร-ชั้น-รหัสห้อง เช่น LOC:A-2-AHU
// เรียกจากทั้งกล้องสแกน (ถ้ามีในอนาคต) และการเปิดแอปผ่านลิงก์ ?loc=LOC:...
function wrApplyLocCode(rawText){
  const th = ST.lang==='th';
  let text = (rawText||'').trim();
  // If it's a URL with ?loc=..., pull the param out first — this also
  // handles the colon in "LOC:A-2-AHU" coming back percent-encoded
  // (LOC%3AA-2-AHU) as URLSearchParams decodes it automatically, unlike a
  // plain regex over the raw scanned text.
  try{
    const u = new URL(text);
    const locParam = u.searchParams.get('loc');
    if (locParam) text = locParam;
  }catch(err){ /* not a URL — scanned text is likely the bare "LOC:..." code */ }
  // Match "LOC:A-2-AHU" whether it's the raw code or still embedded in text.
  const m = /LOC:([A-Za-z0-9]+)-([A-Za-z0-9]+)-([A-Za-z0-9_]+)/.exec(text);
  if (!m) { toast((th?'QR นี้ไม่ใช่รูปแบบตำแหน่งที่รู้จัก: ':'Unrecognized location QR: ')+rawText); return false; }
  const bEl = document.getElementById('wr-f-building'), fEl = document.getElementById('wr-f-floor');
  if (!bEl || !fEl) return false;
  bEl.value = m[1]; fEl.value = m[2];
  wrFLocCascade(m[3]);
  return true;
}

// In-app camera QR scanner for the location step — same html5-qrcode lib
// and pattern the Desktop Reliability Module already uses for Asset QR, so
// a stuck-on-the-wall location QR is scannable from either app.
let _wrLocQrScanner = null;
function wrLocQrStart(){
  const th = ST.lang==='th';
  const boxId = 'wr-loc-qr-box', statusId = 'wr-loc-qr-status';
  const box = document.getElementById(boxId);
  if (!box) return; // overlay not open / not rendered yet
  if (typeof Html5Qrcode === 'undefined'){
    toast(th?'⚠ โหลดไลบรารีกล้องไม่สำเร็จ — เลือกตำแหน่งเองแทนได้':'⚠ Camera library failed to load — select location manually instead');
    return;
  }
  if (!(window.isSecureContext)) {
    const statusEl0 = document.getElementById(statusId);
    if (statusEl0) statusEl0.textContent = th?'❌ ต้องเปิดผ่าน HTTPS ถึงจะใช้กล้องได้':'❌ Camera requires HTTPS';
    return;
  }
  const statusEl = document.getElementById(statusId);
  if (statusEl) statusEl.textContent = th?'📷 กำลังเปิดกล้อง...':'📷 Opening camera...';
  _wrLocQrScanner = new Html5Qrcode(boxId);
  const onDecoded = function(decodedText){
    const ok = wrApplyLocCode(decodedText.trim());
    if (statusEl) statusEl.textContent = ok ? (th?'✅ สแกนพบ':'✅ Scanned') + ': '+decodedText : (th?'❌ QR ไม่ใช่รูปแบบตำแหน่ง':'❌ Not a location QR');
    if (ok) setTimeout(function(){ wrLocQrStop(); ST.wrLocQrOpen = false; render(); }, 600);
  };
  const onDecodeError = function(){ /* keep scanning quietly */ };
  const cfg = { fps: 10, qrbox: { width: 220, height: 220 } };
  // Ask by facingMode first — this is the pattern html5-qrcode itself
  // recommends for phones: it triggers the getUserMedia permission prompt
  // directly and works far more reliably than enumerating devices first
  // (Html5Qrcode.getCameras() before permission is granted often comes back
  // with unusable device entries on mobile Chrome/Safari, which is what
  // left the preview stuck on a black box with no error surfaced).
  _wrLocQrScanner.start({ facingMode: 'environment' }, cfg, onDecoded, onDecodeError)
    .catch(function(err){
      console.error('WR loc QR scanner facingMode start failed, falling back to getCameras()', err);
      Html5Qrcode.getCameras().then(function(cams){
        const backCam = cams.filter(function(c){ return /back|rear|environment/i.test(c.label); })[0];
        const cameraId = backCam ? backCam.id : (cams[0] ? cams[0].id : null);
        if (!cameraId){ if(statusEl) statusEl.textContent = th?'❌ ไม่พบกล้อง':'❌ No camera found'; return; }
        _wrLocQrScanner.start(cameraId, cfg, onDecoded, onDecodeError).catch(function(err2){
          if (statusEl) statusEl.textContent = th?'❌ เปิดกล้องไม่ได้ — ตรวจสอบสิทธิ์การใช้กล้องของเบราว์เซอร์':'❌ Could not open camera — check browser camera permission';
          console.error('WR loc QR scanner cameraId start failed', err2);
        });
      }).catch(function(err3){
        if (statusEl) statusEl.textContent = th?'❌ ไม่พบกล้อง หรือไม่ได้อนุญาตสิทธิ์':'❌ No camera, or permission denied';
        console.error('getCameras failed', err3);
      });
    });
}
function wrLocQrStop(){
  if (_wrLocQrScanner){
    _wrLocQrScanner.stop().then(function(){ _wrLocQrScanner.clear(); }).catch(function(){});
    _wrLocQrScanner = null;
  }
}

        locationDetail: locDetail||undefined, availableTime: availTime||undefined,
        building: locBuilding, floor: locFloor,
        zone: roomMeta ? (th?LOC_CATS[roomMeta.cat].th:LOC_CATS[roomMeta.cat].en) : undefined,
        room: roomMeta ? (th?roomMeta.th:roomMeta.en) : undefined,
        locCode: locRoomCode,
        date: dateVal ? new Date(dateVal).toISOString() : wo.created_at
      }] }) });
    }catch(e){ /* WR itself is already saved; the extra detail merge is best-effort */ }
    ST.wrFormOpen = false; ST.wrFormBusy = false;
    toast(th?('✅ แจ้งซ่อม '+(wo.wo_no||'')+' สำเร็จ'):('✅ Submitted '+(wo.wo_no||'')));
    loadFmWR();
  }catch(err){
    ST.wrFormBusy = false; render();
    toast((th?'ส่งไม่สำเร็จ: ':'Submit failed: ')+(err.message||err));
  }
}

function fmWR(){

  let body = '';
  if(sub==='overview') body = wrOverview();
  else if(sub==='new') body = wrNew();
  else if(sub==='inprogress') body = wrInProgress();
  else if(sub==='closed') body = wrClosed();
  else if(sub==='evaluate') body = wrEvaluate();
  else if(sub==='summarize') body = wrSummarize();
  else if(sub==='maintain') body = wrMaintainability();
  else if(sub==='sla') body = wrSLA();

/* ══════════════ OM (Operation Checklist) — full parity with the webapp:
   New OM (fill+submit, auto-creates WR for abnormal items), In Progress,
   Closed, Evaluate & Approve, Checklist Setup, OM Setting. Templates and
   the shift schedule are read from the same /fm-records/omTemplates and
   /fm-records/omSchedule the Reliability Module already seeds & pushes to
   the backend, so Mobile doesn't need its own copy of the 18 checklists. */
const OM_ITEM_TYPE_LABEL = { visual:{th:'ตรวจสภาพ',en:'Visual'}, measurement:{th:'ค่าที่วัด',en:'Measurement'}, photo:{th:'ถ่ายรูป+อ่านค่า',en:'Photo+Reading'} };
let omCurItems = [];       // working checklist items for the open New/Edit OM form
let omCurEquipPhotos = []; // equipment baseline photos for the open form
let omCurStart = null;
let omTplWorkingItems = []; // working items list for the open Checklist Setup modal

function omTemplatesData(){ return fmKindData('omTemplates') || fmDB('omTemplates') || []; }
function omScheduleData(){ return fmKindData('omSchedule') || fmDB('omSchedule') || []; }
function omRecordsData(){ return (fmKindData('omRecords') || fmDB('omRecords') || []).slice().sort(function(a,b){ return new Date(b.submittedDate||0) - new Date(a.submittedDate||0); }); }

function omSubTabs(active){
  const th = ST.lang==='th';
  const om = omRecordsData();
  const pendingCount = om.filter(function(o){ return o.status==='pending'; }).length;
  const rejectedCount = om.filter(function(o){ return o.status==='rejected'; }).length;
  const tabs = [
    { k:'overview', label: th?'ภาพรวม':'Overview' },
    { k:'inprogress', label: th?'กำลังทำ/รออนุมัติ':'In Progress', badge: pendingCount+rejectedCount },
    { k:'closed', label: th?'ปิดงาน':'Closed' },
    { k:'evaluate', label: th?'ประเมิน & อนุมัติ':'Evaluate & Approve', badge: pendingCount },
    { k:'checklist', label: th?'🧾 ตั้งค่า Checklist':'Checklist Setup' },
    { k:'setting', label: th?'⚙ OM Setting':'OM Setting' },
  ];
  function pill(k, label, badge){
    const isActive = active===k;
    const badgeHtml = badge ? '<span style="margin-left:5px;background:#ef4444;color:#fff;font-size:12px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px">'+(badge>99?'99+':badge)+'</span>' : '';
    return '<div class="tap" data-act="om-sub" data-sub="'+k+'" style="flex-shrink:0;display:flex;align-items:center;font-size:11.5px;font-weight:600;padding:7px 11px;border-radius:20px;border:1px solid '+(isActive?'var(--color-accent)':'var(--color-divider)')+';background:'+(isActive?'var(--color-accent)':'transparent')+';color:'+(isActive?'#fff':'var(--color-text)')+'">'+esc(label)+badgeHtml+'</div>';
  }
  return '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">'
    +'<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;flex:1">'
    + tabs.map(function(x){ return pill(x.k, x.label, x.badge); }).join('')
    +'</div>'
    +'<div class="tap" data-act="refresh-om" title="'+(th?'รีเฟรชข้อมูล':'Refresh')+'" style="flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--color-divider);display:flex;align-items:center;justify-content:center;'+(ST.modLoading.omRecords?'opacity:.5':'')+'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-700)" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7"></path><path d="M21 3v6h-6"></path></svg></div>'
    +'</div>';
}

function omListCard(o, th){
  const stMap = { pending:[th?'รออนุมัติ':'Pending','orange'], approved:[th?'อนุมัติแล้ว':'Approved','green'], rejected:[th?'ส่งกลับแก้ไข':'Sent back','red'] };
  const st = stMap[o.status] || [o.status||'—','gray'];
  const abCount = Array.isArray(o.items) ? o.items.filter(function(x){ return x.result==='abnormal'; }).length : 0;
  return '<div class="tap blueprint" data-act="om-detail-open" data-id="'+esc(o.id)+'" style="padding:11px 12px;display:flex;flex-direction:column;gap:4px"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>'
    +'<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--font-heading);font-size:15px">'+esc(o.id||'OM')+'</span>'+fmChip(th?st[0]:st[1], st[2])+'</div>'
    +'<div style="font-size:14px;color:var(--color-neutral-800)">'+esc(o.templateName||o.assetId||'')+'</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:2px">'+(o.assetId?fmChip(o.assetId,'gray'):'')+(o.person?fmChip(o.person,'gray'):'')+(abCount?fmChip((th?'ผิดปกติ ':'Abnormal ')+abCount,'red'):fmChip(th?'ปกติทั้งหมด':'All normal','green'))+'</div>'
    +'</div>';
}
function omListHtml(list, th, emptyMsg){
  if(!list.length) return fmEmpty(emptyMsg);
  return '<div style="display:flex;flex-direction:column;gap:8px">' + list.slice(0,30).map(function(o){ return omListCard(o, th); }).join('') + '</div>';
}

function omOverview(){
  const th = ST.lang==='th';
  const om = omRecordsData();
  const today = new Date().toDateString();
  const todayCount = om.filter(function(o){ return o.submittedDate && new Date(o.submittedDate).toDateString()===today; }).length;
  const pendingCount = om.filter(function(o){ return o.status==='pending'; }).length;
  const abnormalTotal = om.reduce(function(s,o){ return s+(Array.isArray(o.linkedWRs)?o.linkedWRs.length:0); },0);
  const latestByAsset = {};
  om.forEach(function(o){ if(!latestByAsset[o.assetId]) latestByAsset[o.assetId]=o; });
  const latestList = Object.values(latestByAsset);
  const readyCount = latestList.filter(function(o){ return o.readiness==='ready'; }).length;
  const availPct = latestList.length ? Math.round(readyCount/latestList.length*1000)/10 : null;
  const btn = '<div style="display:flex"><div class="tap" data-act="om-new-open" style="font-size:14px;font-weight:700;padding:7px 12px;border-radius:8px;background:var(--color-accent);color:#fff;text-align:center">+ '+(th?'เริ่มทำ OM':'Start OM')+'</div></div>';
  return btn
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">'
    + statCard(th?'ความพร้อมใช้งาน':'Availability', availPct!=null?availPct+'%':'—', 'closed') + statCard(th?'ทำวันนี้':'Done Today', todayCount, 'new')
    + statCard(th?'รออนุมัติ':'Pending', pendingCount, 'inprogress') + statCard(th?'พบผิดปกติสะสม':'Abnormal (total)', abnormalTotal, 'evaluate')
    +'</div>'
    +'<div style="margin-top:10px">'+omListHtml(om, th, th?'ยังไม่มีบันทึก OM':'No OM records yet')+'</div>';
}
function omInProgress(){ const th=ST.lang==='th'; return omListHtml(omRecordsData().filter(function(o){ return o.status==='pending'||o.status==='rejected'; }), th, th?'ไม่มีงาน OM ที่ค้างอยู่':'Nothing pending'); }
function omClosed(){ const th=ST.lang==='th'; return omListHtml(omRecordsData().filter(function(o){ return o.status==='approved'; }), th, th?'ยังไม่มี OM ที่อนุมัติแล้ว':'No approved OM yet'); }
function omEvaluate(){ const th=ST.lang==='th'; return omListHtml(omRecordsData().filter(function(o){ return o.status==='pending'||o.status==='approved'; }), th, th?'ยังไม่มี OM ที่ส่งเข้ามา':'Nothing submitted yet'); }

function omChecklistSetup(){
  const th = ST.lang==='th';

  const btn = '<div style="display:flex"><div class="tap" data-act="om-tpl-open" style="font-size:14px;font-weight:700;padding:7px 12px;border-radius:8px;background:var(--color-accent);color:#fff;text-align:center">+ '+(th?'เพิ่ม Checklist ใหม่':'Add Checklist')+'</div></div>';

      '<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--font-heading);font-size:15px">'+esc(t.sys||'')+' — '+esc(t.name||'(ยังไม่ตั้งชื่อ)')+'</span>'+fmChip((t.items||[]).length+' '+(th?'หัวข้อ':'items'), (t.items||[]).length?'gray':'red')+'</div>'
      +'<div style="font-size:12px;color:var(--color-neutral-600)">'+esc(t.formCode||'')+'</div>'
      +'<div style="display:flex;gap:8px;margin-top:4px">'
      +'<div class="tap" data-act="om-tpl-open" data-id="'+esc(t.id)+'" style="font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid var(--color-divider)">✏ '+(th?'แก้ไข':'Edit')+'</div>'
      +'<div class="tap" data-act="om-tpl-delete" data-id="'+esc(t.id)+'" style="font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid var(--danger);color:var(--danger)">🗑</div>'
      +'</div>'
    );
  }).join('') + '</div>';
}

function omSetting(){
  const th = ST.lang==='th';
  const sched = omScheduleData();
  const btn = '<div style="display:flex"><div class="tap" data-act="om-sched-open" style="font-size:14px;font-weight:700;padding:7px 12px;border-radius:8px;background:var(--color-accent);color:#fff;text-align:center">+ '+(th?'เพิ่มรายการเวร':'Add Item')+'</div></div>';
  if(!sched.length) return btn + fmEmpty(th?'ยังไม่มีรายการเวร M/A/N':'No shift items yet');
  const shifts = [{k:'M',label:'🌅 Morning'},{k:'A',label:'🌇 Afternoon'},{k:'N',label:'🌙 Night'}];
  let html = btn;
  shifts.forEach(function(sh){

    html += '<div style="margin-top:12px"><h4 style="font-size:14px;margin-bottom:6px">'+sh.label+' <span style="font-size:11px;color:var(--color-neutral-600);font-weight:400">('+items.filter(function(i){return i.enabled;}).length+'/'+items.length+' '+(th?'ใช้งาน':'active')+')</span></h4>'
      +'<div style="display:flex;flex-direction:column;gap:6px">' + items.map(function(it){
        return fmCard(
          '<div style="display:flex;justify-content:space-between;align-items:center;'+(it.enabled?'':'opacity:.5')+'"><span style="font-family:var(--font-heading);font-size:13px">'+esc(it.time||'-')+' — '+esc(it.desc||'')+'</span></div>'
          +'<div style="font-size:11px;color:var(--color-neutral-600)">'+esc(it.section||'')+(it.formCode?' · '+esc(it.formCode):'')+'</div>'
          +'<div style="display:flex;gap:8px;margin-top:4px">'
          +'<div class="tap" data-act="om-sched-toggle" data-id="'+esc(it.id)+'" style="font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid var(--color-divider)">'+(it.enabled?(th?'✖ ปิดใช้งาน':'Disable'):(th?'✔ เปิดใช้งาน':'Enable'))+'</div>'
          +'<div class="tap" data-act="om-sched-open" data-id="'+esc(it.id)+'" style="font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid var(--color-divider)">✏</div>'
          +'<div class="tap" data-act="om-sched-delete" data-id="'+esc(it.id)+'" style="font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid var(--danger);color:var(--danger)">🗑</div>'
          +'</div>'
        );
      }).join('') + '</div></div>';
  });
  return html;
}

function fmOM(){
  const th = ST.lang==='th';
  const sub = ST.omSub || 'overview';
  if (ST.modLoading.omRecords) return omSubTabs(sub) + fmEmpty(th?'กำลังโหลด...':'Loading...');
  let body = '';
  if(sub==='overview') body = omOverview();
  else if(sub==='inprogress') body = omInProgress();
  else if(sub==='closed') body = omClosed();
  else if(sub==='evaluate') body = omEvaluate();
  else if(sub==='checklist') body = omChecklistSetup();

/* ── New / Edit OM ── */
function omOnAssetChange(assetId){
  ST.omFormAssetId = assetId;
  const a = fmAssetFor(assetId);
  const infoEl = document.getElementById('om-asset-info');
  if(infoEl){
    if(a){ infoEl.style.display='block'; infoEl.innerHTML = '<div style="font-weight:700;font-size:13px">'+esc(a.id)+' — '+esc(a.name||'')+'</div><div style="font-size:11px;color:var(--color-neutral-600)">'+esc([a.building,a.floor,a.zone,a.room].filter(Boolean).join(' / ')||'-')+'</div>'; }
    else infoEl.style.display='none';
  }
  const match = a && a.sys ? omTemplatesData().find(function(t){ return t.sys===a.sys; }) : null;
  if(match){
    ST.omFormTemplateId = match.id;
    const sel = document.getElementById('om-f-template'); if(sel) sel.value = match.id;
    omLoadTemplateItems(match.id);
  }
}
function omOnTemplateChange(templateId){ ST.omFormTemplateId = templateId; omLoadTemplateItems(templateId); }
function omLoadTemplateItems(templateId){
  const t = omTemplatesData().find(function(x){ return String(x.id)===String(templateId); });
  omCurItems = t ? (t.items||[]).map(function(it){ return Object.assign({}, it, {result:'normal', value:'', detail:'', photo:null}); }) : [];
  omRenderItemsList();
}
function omRenderItemsList(){ const el = document.getElementById('om-items-list'); if(el) el.innerHTML = omItemsHtml(); }
function omItemsHtml(){
  const th = ST.lang==='th';
  if(!omCurItems.length) return '<div style="font-size:12px;color:var(--color-neutral-600);padding:10px 0">'+(th?'เลือก Asset และ Checklist ก่อนครับ':'Select an Asset and Checklist first')+'</div>';
  return omCurItems.map(function(item,i){
    const isAb = item.result==='abnormal';
    const outOfRange = (item.type==='measurement'||item.type==='photo') && item.value!=='' && item.value!=null &&
      ((item.min!=null && parseFloat(item.value)<item.min) || (item.max!=null && parseFloat(item.value)>item.max));
    return '<div class="blueprint" style="padding:10px 11px;margin-bottom:8px;border-left:3px solid '+(isAb?'var(--danger)':'var(--color-divider)')+'"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>'
      +'<div style="font-weight:700;font-size:13px;margin-bottom:6px">'+(i+1)+'. '+esc(item.label||'')+'</div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'
      +'<div class="tap" onclick="omSetItemResult('+i+',\'normal\')" style="font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;'+(item.result==='normal'?'background:var(--green);color:#fff':'border:1px solid var(--color-divider)')+'">✅ '+(th?'ปกติ':'Normal')+'</div>'
      +'<div class="tap" onclick="omSetItemResult('+i+',\'abnormal\')" style="font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;'+(isAb?'background:var(--danger);color:#fff':'border:1px solid var(--color-divider)')+'">⚠ '+(th?'ผิดปกติ':'Abnormal')+'</div>'
      + ((item.type==='measurement'||item.type==='photo') ? '<input class="input" style="width:90px;padding:6px" type="number" placeholder="'+(th?'ค่าที่วัด':'value')+'" value="'+esc(item.value)+'" onchange="omSetItemValue('+i+',this.value)">'
        +'<span style="font-size:11px;color:var(--color-neutral-600)">'+esc(item.unit||'')+(item.min!=null||item.max!=null?' ('+(item.min??'-')+'–'+(item.max??'-')+')':'')+'</span>'
        + (outOfRange?fmChip(th?'นอกเกณฑ์':'Out of range','red'):'') : '')
      + (item.type==='photo' ? '<input type="file" accept="image/*" capture="environment" style="max-width:150px;font-size:11px" onchange="omHandleItemPhoto('+i+',this)">' : '')
      +'</div>'
      + (item.photo ? '<img src="'+item.photo+'" style="width:64px;height:64px;object-fit:cover;border-radius:6px;margin-top:6px">' : '')
      + (isAb ? '<textarea class="input" rows="2" placeholder="'+(th?'รายละเอียดอาการผิดปกติ':'Describe the issue')+'" style="margin-top:8px" oninput="omSetItemDetail('+i+',this.value)">'+esc(item.detail||'')+'</textarea>' : '')
      +'</div>';
  }).join('');
}
function omSetItemResult(i,val){ omCurItems[i].result = val; omRenderItemsList(); }
function omSetItemValue(i,val){ omCurItems[i].value = val; omRenderItemsList(); }
function omSetItemDetail(i,val){ omCurItems[i].detail = val; }
function omHandleItemPhoto(i,inputEl){
  const file = inputEl.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){ omCurItems[i].photo = ev.target.result; omRenderItemsList(); };
  reader.readAsDataURL(file);
}
function omRenderEquipPhotos(){ const el = document.getElementById('om-equip-photo-list'); if(el) el.innerHTML = omEquipPhotosThumbHtml(); }
function omEquipPhotosThumbHtml(){
  return omCurEquipPhotos.map(function(p,i){
    return '<div style="position:relative;display:inline-block;margin:0 6px 6px 0"><img src="'+p+'" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--color-divider)">'
      +'<span onclick="omCurEquipPhotos.splice('+i+',1);omRenderEquipPhotos()" style="position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer">✕</span></div>';
  }).join('');
}
function omHandleEquipPhotos(inputEl){
  const files = Array.prototype.slice.call(inputEl.files||[]);
  files.forEach(function(f){
    const reader = new FileReader();
    reader.onload = function(ev){ omCurEquipPhotos.push(ev.target.result); omRenderEquipPhotos(); };
    reader.readAsDataURL(f);
  });
  inputEl.value = '';
}
function omEquipPhotosHtml(th){
  const assetId = ST.omFormAssetId;
  const prevWithPhotos = assetId && omRecordsData().some(function(o){ return o.assetId===assetId && Array.isArray(o.equipmentPhotos) && o.equipmentPhotos.length>=2; });

    +'<input type="file" accept="image/*" capture="environment" multiple onchange="omHandleEquipPhotos(this)">'
    +'<div id="om-equip-photo-list" style="margin-top:6px">'+omEquipPhotosThumbHtml()+'</div></div>';
}
function omFormOverlay(){

async function omCreateWRFromItem(om, item){

        type:'CM', priority:'urgent', reporter:'ระบบ OM ('+(om.person||'')+')', status:'open',

async function omSubmit(){
  const th = ST.lang==='th';
  const assetId = (document.getElementById('om-f-asset')||{}).value;
  const templateId = (document.getElementById('om-f-template')||{}).value;
  if(!assetId){ toast(th?'กรุณาเลือก Asset ก่อนครับ':'Please select an Asset'); return; }
  if(!templateId){ toast(th?'กรุณาเลือก Checklist ก่อนครับ':'Please select a Checklist'); return; }
  if(!omCurItems.length){ toast(th?'Checklist นี้ยังไม่มีหัวข้อตรวจสอบ':'This checklist has no items'); return; }
  const person = (document.getElementById('om-f-person')||{}).value.trim();
  if(!person){ toast(th?'กรุณาระบุชื่อผู้ตรวจสอบครับ':'Please enter the inspector name'); return; }
  const prevWithPhotos = omRecordsData().some(function(o){ return o.assetId===assetId && Array.isArray(o.equipmentPhotos) && o.equipmentPhotos.length>=2; });
  if(!prevWithPhotos && omCurEquipPhotos.length<2){ toast(th?'⚠ ครั้งแรกของเครื่องนี้ ต้องแนบรูปอุปกรณ์อย่างน้อย 2 รูป':'⚠ First time — attach at least 2 equipment photos'); return; }
  const t = omTemplatesData().find(function(x){ return String(x.id)===String(templateId); });
  const readiness = (document.getElementById('om-f-readiness')||{}).value || 'ready';
  ST.omFormBusy = true; render();
  const endTime = new Date();
  const durationMin = omCurStart ? Math.round((endTime-omCurStart)/60000) : null;
  const isEdit = !!ST.omFormEditId;
  const recId = isEdit ? ST.omFormEditId : ('OM-'+Date.now());
  const om = {
    id: recId, assetId, templateId, templateName: t?t.name:'', sys: t?t.sys:'',
    items: JSON.parse(JSON.stringify(omCurItems)),
    equipmentPhotos: omCurEquipPhotos.length ? omCurEquipPhotos.slice() : (omRecordsData().find(function(o){ return o.assetId===assetId; })||{}).equipmentPhotos || [],
    readiness, person, startTime: omCurStart?omCurStart.toISOString():null, endTime: endTime.toISOString(), durationMin,
    status:'pending', submittedDate: endTime.toISOString(),
    reviewedBy:null, reviewedDate:null, rejectReason:null, linkedWRs:[]
  };
  const abnormalItems = omCurItems.filter(function(x){ return x.result==='abnormal'; });
  for(let idx=0; idx<abnormalItems.length; idx++){
    const wrId = await omCreateWRFromItem(om, abnormalItems[idx]);
    if(wrId) om.linkedWRs.push(wrId);
  }
  try{
    await fmSyncKind('omRecords', om);
    ST.omFormOpen = false; ST.omFormBusy = false;
    render();
    toast(abnormalItems.length
      ? (th?('✅ ส่ง OM '+recId+' เรียบร้อย — พบผิดปกติ '+abnormalItems.length+' หัวข้อ สร้าง WR อัตโนมัติแล้ว รออนุมัติ'):('✅ Submitted '+recId+' — '+abnormalItems.length+' abnormal, WR auto-created, pending approval'))
      : (th?('✅ ส่ง OM '+recId+' เรียบร้อย — ไม่พบความผิดปกติ รออนุมัติ'):('✅ Submitted '+recId+' — no issues, pending approval')));
  }catch(err){
    ST.omFormBusy = false; render();
    toast((th?'ส่งไม่สำเร็จ: ':'Submit failed: ')+(err.message||err));
  }
}

async function omReject(id){

/* ══════════════ PPM (Preventive Maintenance) — core parity with the webapp:
   Plan (New/Edit + lists), Start, Complete (checklist+parts+cost+signature+

const PM_SUBTYPES = { R:{th:'เปลี่ยนอะไหล่',en:'Replacement'}, A:{th:'ปรับตั้ง',en:'Adjustment'}, L:{th:'หล่อลื่น',en:'Lubricant'}, C:{th:'ทำความสะอาด',en:'Cleaning'}, T:{th:'ขันแน่น',en:'Tighten'}, CB:{th:'ตรวจวัดสภาพ',en:'Condition Base'} };

function ppmIsOverdue(p){ return !!(p.planDate && new Date(p.planDate) < new Date() && p.status!=='done' && p.status!=='approved_pm'); }

// Real-data trend series for the dashboard below — same 8-month grouping
// and simple MTBF-based reliability formula (R = e^(-8760/MTBF)) already
// used in the Desktop Reliability Module's PPM dashboard, so both apps
// agree. Months with nothing closed/due yet forward-fill from the last
// known month (or the overall average) instead of showing a gap/zero.
function ppmMonthlyStats(){
  const ppm = ppmData();
  const moNamesTh=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const nowD = new Date();
  const monthKeys=[], mos=[];
  for(let i=7;i>=0;i--){ const d=new Date(nowD.getFullYear(), nowD.getMonth()-i, 1); monthKeys.push(d.getFullYear()+'-'+d.getMonth()); mos.push(moNamesTh[d.getMonth()]); }
  const sameMonth = function(dateStr,key){ if(!dateStr) return false; const d=new Date(dateStr); return !isNaN(d) && (d.getFullYear()+'-'+d.getMonth())===key; };
  const fillGaps = function(arr,fallback){ let last=null; return arr.map(function(v){ if(v==null) v=(last!=null?last:fallback); last=v; return v; }); };
  const done = ppm.filter(function(p){ return p.status==='done'||p.status==='approved_pm'; }).length;
  const total = ppm.length;
  const allMTBF = ppm.filter(function(p){ return p.mtbf; }).map(function(p){ return p.mtbf; });
  const avgMTBF = allMTBF.length ? Math.round(allMTBF.reduce(function(s,v){ return s+v; },0)/allMTBF.length) : 0;
  const avgRel = avgMTBF>0 ? parseFloat((Math.exp(-8760/avgMTBF)*100).toFixed(1)) : 0;
  const pmCost = ppm.reduce(function(s,p){ return s+(p.cost||0); }, 0);
  const mtbfByMonth = monthKeys.map(function(key){
    const vals = ppm.filter(function(p){ return p.mtbf && sameMonth(p.actualDate, key); }).map(function(p){ return p.mtbf; });
    return vals.length ? Math.round(vals.reduce(function(s,v){ return s+v; },0)/vals.length) : null;
  });
  const compByMonth = monthKeys.map(function(key){
    const due = ppm.filter(function(p){ return sameMonth(p.planDate, key); });
    if(!due.length) return null;
    const doneInMonth = due.filter(function(p){ return p.status==='done'||p.status==='approved_pm'; }).length;
    return Math.round(doneInMonth/due.length*100);
  });
  const relByMonth = mtbfByMonth.map(function(v){ return v ? parseFloat((Math.exp(-8760/v)*100).toFixed(1)) : null; });
  return {
    mos: mos, total: total, done: done, avgMTBF: avgMTBF, avgRel: avgRel, pmCost: pmCost,
    mtbfSeries: fillGaps(mtbfByMonth, avgMTBF||0),
    compSeries: fillGaps(compByMonth, total?Math.round(done/total*100):0),
    relSeries: fillGaps(relByMonth, avgRel||0)
  };
}
// Sparkline with an added dashed horizontal target line (used for the
// Reliability trend, mirroring the desktop chart's dashed "Target 90%").
function ppmDualSpark(values, targetVal, color){
  if(!values.length) return '';
  const w=280,h=54,pad=4;
  const allVals = values.concat([targetVal]);
  const max=Math.max.apply(null, allVals), min=Math.min.apply(null, allVals);
  const range=(max-min)||1;
  const step = values.length>1 ? (w-pad*2)/(values.length-1) : 0;
  const pts = values.map(function(v,i){ const x=pad+step*i; const y=h-pad-((v-min)/range)*(h-pad*2); return x+','+y; }).join(' ');
  const ty = h-pad-((targetVal-min)/range)*(h-pad*2);
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'
    +'<line x1="'+pad+'" y1="'+ty+'" x2="'+(w-pad)+'" y2="'+ty+'" stroke="#EAB308" stroke-width="1.5" stroke-dasharray="4,3"/>'
    +'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2"/>'
    +'</svg>';
}

    + statCard(th?'PM ทั้งหมด':'PM Total', stats.total)

function ppmHandleImages(inputEl){
  const files = Array.prototype.slice.call(inputEl.files||[]);
  files.forEach(function(f){
    const reader = new FileReader();
    reader.onload = function(ev){ ppmCurImages.push({ src: ev.target.result, name: f.name }); ppmRenderImages(); };
    reader.readAsDataURL(f);
  });
  inputEl.value = '';
}
function ppmOnTemplateChange(templateId){
  const t = ppmTemplatesData().find(function(x){ return String(x.id)===String(templateId); });
  if(!t) return;
  ppmCurItems = (t.items||[]).map(function(it,i){ return { id:'sub'+Date.now()+i, type:'C', desc:it.label||'', unit:it.unit||'', stdMin:(it.min==null?null:it.min), stdMax:(it.max==null?null:it.max), stdOp:'between' }; });
  ppmCurImages = (t.images||[]).map(function(im){ return Object.assign({}, im); });
  ppmRenderItems(); ppmRenderImages();
}

async function ppmSubmit(){
  const th = ST.lang==='th';
  const name = (document.getElementById('ppm-f-name')||{}).value.trim();
  if(!name){ toast(th?'กรุณากรอกชื่องาน PM':'Please enter the PM job name'); return; }
  const trigger = (document.querySelector('input[name="ppmf-trigger"]:checked')||{}).value || 'freq';
  const isEdit = !!ST.ppmFormEditId;
  const existing = isEdit ? ppmData().find(function(x){ return String(x.id)===String(ST.ppmFormEditId); }) : null;
  const id = isEdit ? ST.ppmFormEditId : ('PPM-'+Date.now());
  ST.ppmFormBusy = true; render();
  const item = Object.assign({}, existing, {
    id, assetId:(document.getElementById('ppm-f-asset')||{}).value, name,
    system:(document.getElementById('ppm-f-system')||{}).value, priority:(document.getElementById('ppm-f-priority')||{}).value,
    trigger, freq:(document.getElementById('ppm-f-freq')||{}).value,
    triggerHrs: parseInt((document.getElementById('ppmf-trighrs')||{}).value)||0,
    hrsDay: parseFloat((document.getElementById('ppmf-hrsday')||{}).value)||8,
    planDate:(document.getElementById('ppm-f-plandate')||{}).value,
    assign:(document.getElementById('ppm-f-assign')||{}).value, phone:(document.getElementById('ppm-f-phone')||{}).value,
    std:(document.getElementById('ppm-f-std')||{}).value,
    status: existing ? existing.status : 'planned',
    subItems: JSON.parse(JSON.stringify(ppmCurItems)), checklistImages: ppmCurImages.slice(),
    measured: existing?existing.measured:'', mtbf: existing?existing.mtbf:0, cost: existing?existing.cost:0, daysDiff: existing?existing.daysDiff:null
  });
  try{
    await fmSyncKind('ppm', item);
    ST.ppmFormOpen = false; ST.ppmFormBusy = false; render();
    toast(th?('✅ บันทึกแผน '+id+' เรียบร้อย'):('✅ Saved plan '+id));
  }catch(err){
    ST.ppmFormBusy = false; render();
    toast((th?'บันทึกไม่สำเร็จ: ':'Save failed: ')+(err.message||err));
  }
}

async function ppmStart(id){
  const th = ST.lang==='th';
  const p = ppmData().find(function(x){ return String(x.id)===String(id); }); if(!p) return;
  const updated = Object.assign({}, p, { status:'inprogress', startTime: new Date().toISOString() });
  try{ await fmSyncKind('ppm', updated); ST.ppmDetailId=null; render(); toast(th?'▶ เริ่มงานแล้ว':'▶ Started'); }
  catch(err){ toast((th?'ไม่สำเร็จ: ':'Failed: ')+(err.message||err)); }
}
async function ppmDelete(id){
  const th = ST.lang==='th';
  if(!confirm(th?'ลบแผนงานนี้ใช่หรือไม่?':'Delete this plan?')) return;
  try{ await fmDeleteKind('ppm', id); ST.ppmDetailId=null; render(); toast(th?'🗑 ลบแล้ว':'🗑 Deleted'); }
  catch(err){ toast((th?'ไม่สำเร็จ: ':'Failed: ')+(err.message||err)); }
}
async function ppmApprove(id, role){
  if(ST.ppmEvalBusy) return;
  const th = ST.lang==='th';
  const p = ppmData().find(function(x){ return String(x.id)===String(id); }); if(!p) return;
  ST.ppmEvalBusy = true; render();
  const roleLabel = role==='director' ? (th?'ผู้อำนวยการ':'Director') : (th?'ผู้จัดการ':'Manager');
  const name = (getUser()&&getUser().full_name) || roleLabel;
  const updated = Object.assign({}, p, { status:'approved_pm', approvedBy: roleLabel+': '+name });
  try{ await fmSyncKind('ppm', updated); ST.ppmEvalBusy=false; ST.ppmDetailId=null; render(); toast(th?('✅ อนุมัติ '+id+' เรียบร้อยครับ'):('✅ Approved '+id)); }
  catch(err){ ST.ppmEvalBusy=false; render(); toast((th?'ไม่สำเร็จ: ':'Failed: ')+(err.message||err)); }
}
async function ppmEditNote(id){

}

function ppmCloseSigInit(){

  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#1d1f20'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  function down(e){ ppmCloseSigDrawing = true; ppmCloseSigLast = wrCloseSigPos(canvas, e); e.preventDefault(); }
  function move(e){
    if(!ppmCloseSigDrawing) return;
    const p = wrCloseSigPos(canvas, e);
    ctx.beginPath(); ctx.moveTo(ppmCloseSigLast.x, ppmCloseSigLast.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ppmCloseSigLast = p; e.preventDefault();
  }
  function up(){ ppmCloseSigDrawing = false; }
  canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  canvas.addEventListener('touchstart', down, {passive:false}); canvas.addEventListener('touchmove', move, {passive:false}); canvas.addEventListener('touchend', up);
}

async function ppmCloseSubmit(){
  const th = ST.lang==='th';
  const p = ppmData().find(function(x){ return String(x.id)===String(ST.ppmCloseId); }); if(!p) return;
  const startVal = (document.getElementById('ppm-cl-start')||{}).value;
  const endVal = (document.getElementById('ppm-cl-end')||{}).value;
  const person = (document.getElementById('ppm-cl-person')||{}).value.trim();
  const labor = parseFloat((document.getElementById('ppm-cl-labor')||{}).value)||0;
  const travel = parseFloat((document.getElementById('ppm-cl-travel')||{}).value)||0;
  const partsCost = ppmClosePartsCost();
  const detail = (document.getElementById('ppm-cl-detail')||{}).value || '';
  const mttrHrs = (startVal && endVal) ? Math.round(((new Date(endVal)-new Date(startVal))/3600000)*100)/100 : 0;
  const now = new Date();
  const daysDiff = p.planDate ? Math.round((now - new Date(p.planDate))/86400000) : null;
  ST.ppmCloseBusy = true; render();
  const sigCanvas = document.getElementById('ppm-cl-sigpad');
  const updated = Object.assign({}, p, {
    status:'done', startTime: startVal?new Date(startVal).toISOString():p.startTime, endTime: endVal?new Date(endVal).toISOString():now.toISOString(),
    actualDate: now.toISOString(), person: person||p.person, subItems: JSON.parse(JSON.stringify(ppmCurItems)),
    pmClosedParts: ppmClosePartsUsed.slice(), laborCost: labor, partsCost: partsCost, travelCost: travel,
    cost: labor+partsCost+travel, mttrHrs, daysDiff, detail: detail||p.detail,
    signature: sigCanvas?sigCanvas.toDataURL():p.signature, satisfaction: ppmCloseStars||p.satisfaction||0
  });
  try{
    await fmSyncKind('ppm', updated);
    ST.ppmCloseId = null; ST.ppmCloseBusy=false; render();
    toast(th?('✅ ปิดงาน '+p.id+' เรียบร้อย รอประเมิน'):('✅ Completed '+p.id+' — pending evaluation'));
  }catch(err){
    ST.ppmCloseBusy=false; render();
    toast((th?'บันทึกไม่สำเร็จ: ':'Save failed: ')+(err.message||err));
  }
}

   Schedule, Renewal Tracking, Cost Summary, and Asset History_MA are

function computeMAStatus(m){

async function maContractSubmit(){
  const th = ST.lang==='th';
  const vendor = (document.getElementById('ma-f-vendor')||{}).value.trim();
  if(!vendor){ toast(th?'กรุณากรอกชื่อผู้ให้บริการ':'Please enter the vendor name'); return; }
  if(!maFormAssetIds.length){ toast(th?'กรุณาเลือก Asset อย่างน้อย 1 รายการ':'Please select at least 1 asset'); return; }

  const end = (document.getElementById('ma-f-end')||{}).value;
  if(!start||!end){ toast(th?'กรุณาระบุวันเริ่ม/วันหมดสัญญา':'Please enter start and end dates'); return; }
  const isEdit = !!ST.maFormEditId;
  const id = isEdit ? ST.maFormEditId : ('MA-'+Date.now());
  ST.maFormBusy=true; render();
  const item = {
    id, contractNo:(document.getElementById('ma-f-contractno')||{}).value.trim(), vendor,
    assetIds: maFormAssetIds.slice(), type:(document.getElementById('ma-f-type')||{}).value,
    value: parseFloat((document.getElementById('ma-f-value')||{}).value)||0, start, end,
    pmFreq:(document.getElementById('ma-f-pmfreq')||{}).value, contact:(document.getElementById('ma-f-contact')||{}).value.trim(),
    scopeNote:(document.getElementById('ma-f-scope')||{}).value.trim(), files: maFormFiles.slice()
  };
  item.status = computeMAStatus(item);
  try{
    await fmSyncKind('ma', item);
    ST.maFormOpen=false; ST.maFormBusy=false; render();
    toast(th?('✅ บันทึกสัญญา '+id+' เรียบร้อย'):('✅ Saved contract '+id));
  }catch(err){
    ST.maFormBusy=false; render();
    toast((th?'บันทึกไม่สำเร็จ: ':'Save failed: ')+(err.message||err));
  }
}

/* ── Performance / Scorecard (grouped by vendor) ── */
function maPerformance(){
  const th = ST.lang==='th';
  const visits = maVisitsData();
  const byVendor = {};
  visits.forEach(function(v){ const k=v.vendor||'—'; (byVendor[k]=byVendor[k]||[]).push(v); });
  const vendors = Object.keys(byVendor);
  if(!vendors.length) return fmEmpty(th?'ยังไม่มีข้อมูลผลงาน':'No performance data yet');
  const rows = vendors.map(function(vendor){
    const vs = byVendor[vendor];
    const withSched = vs.filter(function(v){ return v.scheduledDate; });
    const onTime = withSched.filter(function(v){ return v.visitDate && new Date(v.visitDate) <= new Date(v.scheduledDate); });
    const onTimePct = withSched.length ? Math.round((onTime.length/withSched.length)*1000)/10 : null;
    const approved = vs.filter(function(v){ return v.status==='approved'; });
    function avgOf(field){
      const vals = approved.map(function(v){ return Number(v[field]); }).filter(function(n){ return n; });
      return vals.length ? Math.round((vals.reduce(function(s,x){ return s+x; },0)/vals.length)*10)/10 : null;
    }
    const avgPunc=avgOf('ratingPunctuality'), avgQual=avgOf('ratingQuality'), avgResp=avgOf('ratingResponse'), avgClean=avgOf('ratingCleanliness');
    const scores = approved.map(computeVisitScore).filter(function(s){ return s!=null; });
    const avgOverall = scores.length ? Math.round((scores.reduce(function(s,x){ return s+x; },0)/scores.length)*10)/10 : null;
    const reworkCount = vs.filter(function(v){ return v.status==='rejected' || v.rejectReason; }).length;
    return { vendor:vendor, count:vs.length, onTimePct:onTimePct, avgPunc:avgPunc, avgQual:avgQual, avgResp:avgResp, avgClean:avgClean, avgOverall:avgOverall, reworkCount:reworkCount };
  }).sort(function(a,b){ return (b.avgOverall||0)-(a.avgOverall||0); });
  function gradeOf(avg){
    if(avg==null) return [th?'ยังไม่มีข้อมูล':'No data','gray'];
    if(avg>=4.5) return [th?'🟢 ดีเยี่ยม':'🟢 Excellent','green'];
    if(avg>=3.5) return [th?'🔵 ดี':'🔵 Good','sky'];
    if(avg>=2.5) return [th?'🟡 ปานกลาง':'🟡 Moderate','orange'];
    return [th?'🔴 ควรพิจารณา':'🔴 Reconsider','red'];
  }
  return '<div style="display:flex;flex-direction:column;gap:8px">' + rows.map(function(r){
    const g = gradeOf(r.avgOverall);
    return fmCard(
      '<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--font-heading);font-size:15px">'+esc(r.vendor)+'</span>'+fmChip(g[0], g[1])+'</div>'

/* ══════════════ Inventory — core parity with the webapp:
   Item List (CRUD), Receive (FIFO in), Issue (out, ref WR/PM/MA + block
   over-issue), ROP forecast (table, no chart), Setting (inline Min/Max/
   ROP/Lead Time). Value Summary, Dead Stock, Asset History_Inventory and
   Availability analytics are Desktop-only, per the user's explicit "core
   complete" scope decision — same treatment OM/PPM/MA's analytics-only
   tabs got. Items/tx are read via the same generic /fm-records/inv and
   /fm-records/invtx kinds the Reliability Module already seeds & syncs
   to the backend. FIFO cost-layer math (ensureLots/addLot/consumeFIFO)
   is ported verbatim from Desktop so both apps agree on unit cost. */
const INV_SYS = ['AC','BAS','EL','EC','EE','FA','FP','SN','VN','WWT','TR','GE','OTH'];
const INV_USAGE = ['GEN','RM','PM','MA'];

function invItemsData(){ return (fmKindData('inv') || fmDB('inv') || []).slice(); }
function invTxData(){ return (fmKindData('invtx') || fmDB('invtx') || []).slice(); }
function invEnsureLots(item){
  if(!Array.isArray(item.lots) || !item.lots.length){
    item.lots = (item.qty>0) ? [{ qty:item.qty, cost:item.price||0, date:item.createdDate||new Date().toISOString(), ref:'init' }] : [];
  }
  return item.lots;
}
function invAddLot(item, qty, cost, date, ref){
  invEnsureLots(item);
  item.lots.push({ qty:qty, cost:cost, date:date, ref:ref });
  item.qty = (item.qty||0) + qty;
  item.price = invUnitCost(item);
}
function invConsumeFIFO(item, qty){
  invEnsureLots(item);
  let remain = qty, cost = 0;
  while(remain>0 && item.lots.length){
    const lot = item.lots[0];
    const take = Math.min(lot.qty, remain);
    cost += take*lot.cost; lot.qty -= take; remain -= take;
    if(lot.qty<=0) item.lots.shift();
  }
  const consumedQty = qty - remain;
  item.qty = Math.max(0, (item.qty||0) - consumedQty);
  item.price = invUnitCost(item);
  return { consumedQty:consumedQty, consumedCost:cost, avgCost: consumedQty ? cost/consumedQty : 0 };
}
function invItemValue(item){
  invEnsureLots(item);
  if(item.lots.length) return item.lots.reduce(function(s,l){ return s+l.qty*l.cost; }, 0);
  return (item.qty||0)*(item.price||0);
}
function invUnitCost(item){
  invEnsureLots(item);
  const totalQty = item.lots.reduce(function(s,l){ return s+l.qty; }, 0);
  if(!totalQty) return item.price||0;
  const totalCost = item.lots.reduce(function(s,l){ return s+l.qty*l.cost; }, 0);
  return totalCost/totalQty;
}
function invResolveAsset(refType, refId){
  if(!refId) return null;
  if(refType==='WR'){ const w = wrData().find(function(x){ return String(x.id)===String(refId); }); return w ? w.assetId : null; }
  if(refType==='PM'){ const p = ppmData().find(function(x){ return String(x.id)===String(refId); }); return p ? p.assetId : null; }
  if(refType==='MA'){ const v = maVisitsData().find(function(x){ return String(x.id)===String(refId); }); return v ? v.assetId : null; }
  return null;
}
function invAvgMonthlyUsage(partId){
  const now = new Date();
  const cutoff = new Date(now.getFullYear(), now.getMonth()-6, now.getDate());
  const sum = invTxData().filter(function(t){ return String(t.partId)===String(partId) && t.type==='issue' && t.fulfilled!==false && t.date && new Date(t.date)>=cutoff; })
    .reduce(function(s,t){ return s+(t.qty||0); }, 0);
  return sum/6;
}
function invLastMovementDate(partId){
  const txs = invTxData().filter(function(t){ return String(t.partId)===String(partId) && (t.type==='receive' || (t.type==='issue' && t.fulfilled!==false)); });

}

function invAvailability(){
  const th = ST.lang==='th';

  const availPct = (fulfilled+failed) ? Math.round((fulfilled/(fulfilled+failed))*1000)/10 : null;

/* ── Dead Stock ── */
function invDeadStock(){
  const th = ST.lang==='th';
  const items = invItemsData();
  if(!items.length) return fmEmpty(th?'ยังไม่มีรายการอะไหล่':'No inventory items yet');
  const now = new Date();
  const rows = items.map(function(i){
    const last = invLastMovementDate(i.id);
    const monthsSince = last ? Math.floor((now-new Date(last))/(30*86400000)) : Infinity;
    return { item:i, monthsSince:monthsSince, last:last };
  }).filter(function(r){ return r.monthsSince>=6; }).sort(function(a,b){ return b.monthsSince-a.monthsSince; });
  const buckets = [6,12,18,24,30,36];
  const bucketCounts = buckets.map(function(b, idx){
    const nextB = buckets[idx+1];
    const count = rows.filter(function(r){ return r.monthsSince>=b && (nextB==null || r.monthsSince<nextB); }).length;
    return { label:(nextB!=null?(b+'-'+(nextB-1)):(b+'+'))+(th?' เดือน':'mo'), count:count };
  });
  const kpi = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">' + bucketCounts.map(function(b){ return statCard(b.label, b.count); }).join('') + '</div>';
  const totalDeadValue = rows.reduce(function(s,r){ return s+invItemValue(r.item); }, 0);
  const table = '<div style="margin-top:10px">' + rows.map(function(r){
    const i = r.item;
    const color = r.monthsSince>=24 ? 'red' : (r.monthsSince>=12 ? 'orange' : 'sky');
    const monthsLabel = r.monthsSince===Infinity ? (th?'ไม่เคยเคลื่อนไหว':'Never moved') : (r.monthsSince+(th?' เดือน':'mo'));
    return fmCard(
      '<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--font-heading);font-size:15px">'+esc(i.id)+'</span>'+fmChip(monthsLabel, color)+'</div>'
      +'<div style="font-size:14px;color:var(--color-neutral-800)">'+esc(i.name||'')+'</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:2px">'+fmChip((th?'คงเหลือ ':'Qty ')+(i.qty||0)+' '+(i.unit||''),'gray')+fmChip(fmMoney(invItemValue(i)),'gray')+'</div>'
    );
  }).join('') + '</div>';
  return kpi + '<div style="margin-top:10px">'+statCard(th?'มูลค่ารวม Dead Stock':'Total Dead Stock Value', fmMoney(totalDeadValue))+'</div>'
    + '<div style="margin-top:10px"><h4 style="font-size:15px;margin-bottom:6px">'+(th?'รายการ Dead Stock':'Dead Stock Items')+'</h4>'+(rows.length ? table : fmEmpty(th?'ไม่มีรายการ Dead Stock':'No dead stock items'))+'</div>';
}
