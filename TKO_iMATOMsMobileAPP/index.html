<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TKO iMATOMs Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --color-bg:#f2f2f3; --color-surface:#e9e9ea; --color-text:#1d1f20;
  --color-accent:#5980a6; --color-accent-2:#728fab;
  --color-divider:rgba(29,31,32,.16);
  --color-neutral-100:#f5f5f8; --color-neutral-200:#e7e7ea; --color-neutral-300:#d4d4d7;
  --color-neutral-500:#98989b; --color-neutral-600:#7a7a7d; --color-neutral-700:#5d5d60; --color-neutral-800:#424244;
  --color-accent-100:#eef6ff; --color-accent-400:#94bce3; --color-accent-600:#597ea3; --color-accent-700:#416180; --color-accent-800:#2c455d;
  --color-accent-2-100:#eef6ff; --color-accent-2-800:#314457;
  --font-heading:"Barlow Condensed",system-ui,sans-serif; --font-body:"Barlow",system-ui,sans-serif;
  --danger:#c0392b; --orange:#e69a3c; --green:#4fd17a; --sky:#5aa9e6;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:15px;line-height:1.5}
h1,h2,h3,h4,h5{font-family:var(--font-heading);font-weight:600;line-height:1.12;letter-spacing:-.01em;margin:0}
a{color:inherit;text-decoration:none}
.tap{cursor:pointer}
@keyframes orbitA{from{transform:rotate(20deg)}to{transform:rotate(380deg)}}
@keyframes orbitB{from{transform:rotate(-40deg)}to{transform:rotate(320deg)}}
@keyframes orbitC{from{transform:rotate(100deg)}to{transform:rotate(460deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- shell ---- */
#app-root{max-width:480px;margin:0 auto;min-height:100vh;background:var(--color-bg);display:flex;flex-direction:column}
@media(min-width:481px){ body{background:#dfe1e4} #app-root{min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.08)} }

/* ---- blueprint card ---- */
.blueprint{position:relative;border:1px solid var(--color-divider);border-radius:6px;overflow:hidden}
.blueprint>.corner{display:none}

/* tappable card hover/press: raised (embossed) feel + accent strip.
   Uses :hover for mouse (desktop/tablet) AND :active for touch (phones
   have no hover state), so the effect works on tap too. */
.blueprint.tap{transition:transform .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease}
.blueprint.tap::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--color-accent);transform:scaleY(0);transform-origin:top;transition:transform .15s ease}
.blueprint.tap:hover,.blueprint.tap:active{transform:translateY(-3px);box-shadow:0 10px 20px -6px rgba(29,31,32,.25),0 1px 0 rgba(255,255,255,.6) inset;background-color:#fff;border-color:var(--color-accent)}
.blueprint.tap:hover::after,.blueprint.tap:active::after{transform:scaleY(1)}
.blueprint.tap:hover *,.blueprint.tap:active *{text-shadow:0 1px 0 rgba(255,255,255,.8)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--font-heading);font-weight:600;font-size:14px;color:var(--color-text);background:transparent;border:1px solid var(--color-divider);padding:9px 16px;border-radius:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--color-accent);color:#fff;border-color:var(--color-accent)}
.btn-primary:not(:disabled):hover{background:var(--color-accent-600)}
.btn-secondary:not(:disabled):hover{background:rgba(29,31,32,.06)}
.btn-block{width:100%;margin-top:6px}

/* ---- forms ---- */
.field>label{display:block;font-size:12px;margin-bottom:5px;color:rgba(29,31,32,.7)}
.field{margin-bottom:12px}
.input{width:100%;min-height:38px;padding:8px 10px;font:inherit;font-size:14px;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:0}
.input:focus-visible{outline:none;border-color:var(--color-accent)}
textarea.input{min-height:80px;resize:vertical}

/* ---- seg control ---- */
.seg{display:inline-flex;overflow:hidden;border:1px solid var(--color-divider)}
.seg-opt{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:13px;cursor:pointer}
.seg-opt+.seg-opt{border-left:1px solid var(--color-divider)}
.seg-opt.active{background:var(--color-accent);color:#fff}

/* ---- tags ---- */
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;border-radius:2px}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800)}
.tag-neutral{background:var(--color-neutral-100);color:var(--color-neutral-800)}
.tag-outline{border:1px solid var(--color-accent);color:var(--color-accent)}

/* ---- atom logo ---- */
.atom{position:relative}
.atom .ring{position:absolute;left:50%;top:50%;border-radius:50%}
.atom .ring.a{border:3px solid var(--sky);animation:orbitA 14s linear infinite}
.atom .ring.b{border:3px solid var(--green);animation:orbitB 11s linear infinite}
.atom .ring.c{border:3px solid var(--orange);animation:orbitC 17s linear infinite}
.atom .nucleus{position:absolute;left:50%;top:50%;background:#f0862f;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 16px 4px rgba(240,134,47,.7)}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;flex-shrink:0}
.topbar .brand{font-family:var(--font-heading);font-weight:600;font-size:18px}
.icon-btn{width:32px;height:32px;border:1px solid var(--color-divider);display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ---- bottom tab bar ---- */
.tabbar{display:flex;border-top:1px solid var(--color-divider);flex-shrink:0;padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:var(--color-bg)}
.tabitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--color-neutral-600)}
.tabitem.active{color:var(--color-accent-700)}
.tabitem span{font-size:9px;font-family:var(--font-heading);letter-spacing:.02em}

/* ---- views ---- */
.view-body{flex:1;overflow:auto;padding:0 18px 22px}
.stack{display:flex;flex-direction:column;gap:16px}
.footer-legal{text-align:center;padding-top:6px;border-top:1px solid var(--color-divider)}
.footer-legal .l1{font-family:var(--font-heading);font-size:10px;letter-spacing:.1em}
.footer-legal .l2{font-size:8.5px;line-height:1.35;color:var(--color-accent-700);margin-top:6px;padding:0 4px}
.footer-legal .l3{font-size:8.5px;color:var(--color-accent-700);margin-top:3px}
.back-to-platform{display:block;text-align:center;font-size:12px;color:var(--color-accent-700);margin:14px 0 4px;cursor:pointer}

/* ---- login/splash hero ---- */
.hero{flex-shrink:0;padding:30px 16px 22px;position:relative;overflow:hidden;text-align:center;background:radial-gradient(circle at 50% 35%,#1c3a5e 0%,#0d1b30 70%,#0a1526 100%);color:#fff}
.hero .kicker{font-family:var(--font-heading);font-size:12px;letter-spacing:.18em;color:var(--orange)}
.hero .title{font-family:var(--font-heading);font-size:28px;font-weight:600;margin-top:2px}
.hero .title .v{color:#e6672f}
.hero .tag{font-family:var(--font-heading);font-size:11px;letter-spacing:.1em;color:var(--green);margin-top:4px}

/* ---- spinner / toast ---- */
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1d1f20;color:#fff;padding:10px 18px;font-size:13px;border-radius:4px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.msg{font-size:12.5px;margin-top:2px;min-height:16px}
.msg.ok{color:#1a7a3c}
.msg.err{color:var(--danger)}
</style>
</head>
<body>

<div id="app-root"></div>
<div class="toast" id="toast"></div>

<script>
const API_BASE = 'https://api.imatomstech.com/api';
const LS = { token:'imatoms_jwt', refresh:'imatoms_refresh', user:'imatoms_user', lang:'imatoms_mobile_lang' };

function getToken(){ try{ return localStorage.getItem(LS.token); }catch(e){ return null; } }
function getUser(){ try{ return JSON.parse(localStorage.getItem(LS.user)||'null'); }catch(e){ return null; } }
function setSession(token, refresh, user){ try{ localStorage.setItem(LS.token, token); if(refresh) localStorage.setItem(LS.refresh, refresh); localStorage.setItem(LS.user, JSON.stringify(user)); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(LS.token); localStorage.removeItem(LS.refresh); localStorage.removeItem(LS.user); }catch(e){} }

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const token = getToken();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(res.status === 401){ clearSession(); ST.screen='login'; ST.tab='home'; render(); throw new Error((data && data.error) || 'Session expired — please sign in again'); }
  if(!res.ok) throw new Error((data && data.error) || ('Request failed (' + res.status + ')'));
  return data;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._h); toast._h=setTimeout(function(){t.classList.remove('show');},2600); }

/* ============== state ============== */
const ST = {
  lang: (function(){ try{ return localStorage.getItem(LS.lang) || 'th'; }catch(e){ return 'th'; } })(),
  screen: (getToken() && getUser()) ? 'main' : 'login',
  authMode: 'login',
  tab: 'home',
  lifestyleSub: 'market',
  showPassword: false,
  loginBusy:false, loginMsg:'', loginErr:false,
  regBusy:false, regMsg:'', regErr:false,
  dash: null,
  activeModule: null,
  modData: {},   // per-module light data cache: { fm:{}, iot:{}, mv:{}, advisory:{}, bot:{} }
  modLoading: {},
  fromTab: 'ops', // tab to return to when leaving a module screen
  fmSub: 'overview', // FM module sub-tab: overview | wr | om | ppm | ma | inv
  wrSub: 'overview', // WR sub-tab within FM: overview|new|inprogress|closed|evaluate|summarize|maintain|sla|repeated|reopt|history
};

function setLang(l){ ST.lang = l; try{ localStorage.setItem(LS.lang, l); }catch(e){} render(); }

/* module -> real webapp URL. FM has a live app; the rest are still
   "Coming Soon" placeholder pages until their backend/app exists. */

  const th = ST.lang==='th';
  return [

/* ============== atom logo html ============== */
function atomHtml(size, ringW, ringH, dot){
  return '<div class="atom" style="width:'+size+'px;height:'+size+'px;margin:0 auto">'
    +'<div class="ring a" style="width:'+ringW+'px;height:'+ringH+'px;margin:'+(-ringH/2)+'px 0 0 '+(-ringW/2)+'px"></div>'
    +'<div class="ring b" style="width:'+ringW+'px;height:'+ringH+'px;margin:'+(-ringH/2)+'px 0 0 '+(-ringW/2)+'px"></div>'
    +'<div class="ring c" style="width:'+ringW+'px;height:'+ringH+'px;margin:'+(-ringH/2)+'px 0 0 '+(-ringW/2)+'px"></div>'
    +'<div class="nucleus" style="width:'+dot+'px;height:'+dot+'px"></div>'
    +'</div>';
}
function footerLegalHtml(){
  return '<div class="footer-legal">'
    +'<div class="l1"><span style="color:var(--color-neutral-700)">TKO GROUP · </span><span style="color:var(--orange)">TECHNOLOGY</span><span style="color:var(--color-neutral-700)"> · </span><span style="color:#a86fe6">INNOVATION</span><span style="color:var(--color-neutral-700)"> · </span><span style="color:var(--sky)">SUSTAINABILITY</span></div>'

    +'<div class="l3">MR.KITTANAN ONSEE | Copyright - Edition V3.0-2026</div>'

function segLangHtml(){
  const th = ST.lang==='th';
  return '<div class="seg" style="font-size:11px">'
    +'<div class="seg-opt tap '+(th?'active':'')+'" data-act="lang-th">TH</div>'
    +'<div class="seg-opt tap '+(!th?'active':'')+'" data-act="lang-en">EN</div>'
    +'</div>';
}

/* ============== screens ============== */
function screenLogin(){
  const t = L();
  const pwIconEye = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12s4-8 10-8 10 8 10 8-4 8-10 8-10-8-10-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';

  const isLoginMode = ST.authMode === 'login';

/* FM shares its real operating data with the webapp via the same-origin
   localStorage store the webapp itself uses (key prefix 'tko_v2_') —
   this is a genuine live connection, not a copy: WR/PPM/MA/Inventory
   edits made in the webapp appear here immediately, and vice versa. */
function fmDB(k){
  /* the webapp mirrors wr/assets/ppm/ma/inv/contract/operation from its
     'tko_v2_' store into an 'alm_' store for the richer Reliability
     module (Evaluate&Approve, SLA, Maintainability, Repeated Repairs...).
     Prefer 'alm_' since it carries the fuller status workflow
     (open/inprogress/arrived/closed/approved), fall back to 'tko_v2_'. */
  try{
    const a = localStorage.getItem('alm_'+k);
    if(a){ const parsed = JSON.parse(a); if(Array.isArray(parsed) && parsed.length) return parsed; }
  }catch(e){}
  try{ const v = localStorage.getItem('tko_v2_'+k); return v ? JSON.parse(v) : []; }catch(e){ return []; }
}

   Overview / New WR / In Progress-Pending / Closed / Evaluate & Approve /

const WR_STATUS_MAP = { open:['เปิดงาน','Open','orange'], inprogress:['กำลังดำเนินการ','In Progress','sky'], arrived:['ถึงหน้างาน','Arrived','sky'], closed:['ปิดงานแล้ว','Closed','green'], approved:['อนุมัติแล้ว','Approved','green'], cancelled:['ยกเลิก','Cancelled','gray'] };
const WR_PRIORITY_MAP = { critical:['วิกฤต','Critical','red'], urgently:['เร่งด่วน','Urgent','orange'], high:['สูง','High','orange'], normal:['ปกติ','Normal','green'] };
const SLA_TARGETS_MIN = { critical:5, urgently:15, high:15, normal:480 };

  if(!list.length) return fmEmpty(emptyMsg || (th?'ไม่มีข้อมูล':'No data'));
  return '<div style="display:flex;flex-direction:column;gap:8px">' + list.slice(0,30).map(function(w){ return wrCardHtml(w, th); }).join('') + '</div>';

function wrSpark(values, color){
  if(!values.length) return '';
  const w=280,h=54,pad=4;
  const max=Math.max.apply(null, values), min=Math.min.apply(null, values);
  const range = (max-min)||1;
  const step = values.length>1 ? (w-pad*2)/(values.length-1) : 0;
  const pts = values.map(function(v,i){ const x=pad+step*i; const y=h-pad-((v-min)/range)*(h-pad*2); return x+','+y; }).join(' ');
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2"/></svg>';
}

function wrOverview(){
  const th = ST.lang==='th';
  const wr = fmDB('wr');
  const open = wr.filter(function(w){return w.status==='open';});
  const ip = wr.filter(function(w){return w.status==='inprogress'||w.status==='arrived';});
  const closed = wr.filter(function(w){return w.status==='closed'||w.status==='approved';});
  const cancelled = wr.filter(function(w){return w.status==='cancelled';});
  const mttrVals = closed.filter(function(w){return w.mttr;}).map(function(w){return w.mttr;});
  const avgMttr = mttrVals.length ? Math.round(mttrVals.reduce(function(s,v){return s+v;},0)/mttrVals.length*10)/10 : null;
  const allCost = wr.reduce(function(s,w){return s+(w.totalCost||0);},0);
  const total = wr.length || 1;
  const trendSrc = closed.slice().sort(function(a,b){ return new Date(a.closeDate||a.date||0) - new Date(b.closeDate||b.date||0); }).slice(-10).filter(function(w){return w.mttr;});

  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    + statCard(th?'แจ้งซ่อม':'List WR', open.length) + statCard(th?'กำลังทำ':'In Progress', ip.length)
    + statCard(th?'ปิดงาน':'Closed', closed.length) + statCard(th?'MTTR เฉลี่ย (ชม.)':'Avg MTTR (hrs)', avgMttr!=null?avgMttr:'—')
    +'</div>'
    +'<div style="margin-top:2px">'+statCard(th?'ค่าใช้จ่าย WR ทั้งหมด':'All WR Cost', fmMoney(allCost))+'</div>'
    +'<div style="margin-top:6px"><h4 style="font-size:13px;margin-bottom:6px">'+(th?'สถานะงาน':'WR Status Flow')+'</h4>'
    + wrBar([
        { pct: Math.round(open.length/total*100), color:'var(--orange)' },
        { pct: Math.round(ip.length/total*100), color:'var(--sky)' },
        { pct: Math.round(closed.length/total*100), color:'var(--green)' },
        { pct: Math.round(cancelled.length/total*100), color:'var(--color-neutral-500)' },
      ])
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:10px;color:var(--color-neutral-700)">'
    +'<span>🟠 '+(th?'เปิด':'Open')+' '+open.length+'</span><span>🔵 '+(th?'กำลังทำ':'In Progress')+' '+ip.length+'</span><span>🟢 '+(th?'ปิด':'Closed')+' '+closed.length+'</span><span>⚪ '+(th?'ยกเลิก':'Cancelled')+' '+cancelled.length+'</span>'
    +'</div></div>'
    + (trendSrc.length ? '<div style="margin-top:10px">'+fmCard('<div style="font-size:12px;font-weight:600;margin-bottom:4px">'+(th?'แนวโน้ม MTTR (10 งานล่าสุด)':'MTTR Trend (last 10)')+'</div>'+wrSpark(trendSrc.map(function(w){return w.mttr;}), 'var(--color-accent)')) +'</div>' : '');
}

function wrNew(){ const th=ST.lang==='th'; return wrListHtml(fmDB('wr').filter(function(w){return w.status==='open';}).sort(function(a,b){return new Date(b.date||0)-new Date(a.date||0);}), th, th?'ไม่มีงานแจ้งใหม่':'No new work requests'); }
function wrInProgress(){ const th=ST.lang==='th'; return wrListHtml(fmDB('wr').filter(function(w){return w.status==='inprogress'||w.status==='arrived';}).sort(function(a,b){return new Date(b.date||0)-new Date(a.date||0);}), th, th?'ไม่มีงานที่กำลังดำเนินการ':'Nothing in progress'); }
function wrClosed(){ const th=ST.lang==='th'; return wrListHtml(fmDB('wr').filter(function(w){return w.status==='closed'||w.status==='approved';}).sort(function(a,b){return new Date(b.closeDate||b.date||0)-new Date(a.closeDate||a.date||0);}), th, th?'ยังไม่มีงานที่ปิดแล้ว':'No closed work requests'); }

function wrEvaluate(){

    +'</div><div style="margin-top:14px"><h4 style="font-size:13px;margin-bottom:6px">'+(th?'อนุมัติแล้ว':'Approved')+' ('+approved.length+')</h4>'

function wrSummarize(){
  const th = ST.lang==='th';
  const wr = fmDB('wr');
  const byPr = {};
  wr.forEach(function(w){ const k=w.priority||'normal'; byPr[k]=(byPr[k]||0)+1; });
  const prRows = Object.keys(byPr).map(function(k){ const pr=WR_PRIORITY_MAP[k]||[k,k,'gray']; return fmCard('<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px">'+esc(th?pr[0]:pr[1])+'</span>'+fmChip(String(byPr[k]),pr[2])+'</div>'); }).join('');
  const byAsset = {};
  wr.forEach(function(w){ if(!w.assetId) return; byAsset[w.assetId]=(byAsset[w.assetId]||0)+1; });
  const topAssets = Object.keys(byAsset).map(function(k){return {assetId:k,cnt:byAsset[k]};}).sort(function(a,b){return b.cnt-a.cnt;}).slice(0,5);
  return '<div>'+ wrOverview() +'</div>'
    +'<div style="margin-top:14px"><h4 style="font-size:13px;margin-bottom:6px">'+(th?'แยกตามลำดับความสำคัญ':'By Priority')+'</h4>'
    +'<div style="display:flex;flex-direction:column;gap:8px">'+ (prRows||fmEmpty(th?'ไม่มีข้อมูล':'No data')) +'</div></div>'
    +'<div style="margin-top:14px"><h4 style="font-size:13px;margin-bottom:6px">'+(th?'Asset ที่แจ้งซ่อมบ่อยที่สุด (Top 5)':'Top 5 Most-Reported Assets')+'</h4>'
    + (topAssets.length ? '<div style="display:flex;flex-direction:column;gap:8px">'+topAssets.map(function(a){ return fmCard('<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--font-heading);font-size:13px">'+esc(a.assetId)+'</span>'+fmChip((th?'':'')+a.cnt+' '+(th?'ครั้ง':'times'), a.cnt>=2?'orange':'gray')+'</div>'); }).join('')+'</div>' : fmEmpty(th?'ไม่มีข้อมูล':'No data'))
    +'</div>';
}

function wrMaintainability(){
  const th = ST.lang==='th';
  const closed = fmDB('wr').filter(function(w){ return (w.status==='closed'||w.status==='approved') && w.mttr; });
  const withPct = closed.map(function(w){
    const target = WR_TYPE_TARGET_H[w.type] || 8;
    const pct = Math.round((1-Math.exp(-target/w.mttr))*100);
    return { w:w, pct:pct };
  });
  const avg = withPct.length ? Math.round(withPct.reduce(function(s,x){return s+x.pct;},0)/withPct.length) : null;
  return '<div>'+statCard(th?'Maintainability เฉลี่ย':'Avg Maintainability', avg!=null?avg+'%':'—')+'</div>'
    +'<div style="font-size:11px;color:var(--color-neutral-700);margin:8px 0">Maintainability = 1 − e^(−Target/MTTR)</div>'
    + (withPct.length ? '<div style="display:flex;flex-direction:column;gap:8px">' + withPct.slice(0,20).map(function(x){
        return fmCard('<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--font-heading);font-size:13px">'+esc(x.w.id)+'</span>'+fmChip(x.pct+'%', x.pct>=70?'green':x.pct>=40?'orange':'red')+'</div>'+'<div style="font-size:11px;color:var(--color-neutral-700)">MTTR '+x.w.mttr+'h · '+esc(x.w.type||'')+'</div>');
      }).join('') + '</div>' : fmEmpty(th?'ยังไม่มีข้อมูลงานที่ปิดแล้ว':'No closed work requests yet'));
}

function wrSLA(){
  const th = ST.lang==='th';
  const wr = fmDB('wr').filter(function(w){ return w.responseTime!=null && w.priority; });
  const met = wr.filter(function(w){ return w.responseTime <= (SLA_TARGETS_MIN[w.priority]||480); });
  const breach = wr.filter(function(w){ return w.responseTime > (SLA_TARGETS_MIN[w.priority]||480); });
  const pct = wr.length ? Math.round(met.length/wr.length*100) : null;
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    + statCard(th?'ตรงเวลา':'SLA Met', met.length) + statCard(th?'เกินเวลา':'SLA Breached', breach.length)
    +'</div><div style="margin-top:2px">'+statCard(th?'อัตราปฏิบัติตาม SLA':'SLA Compliance', pct!=null?pct+'%':'—')+'</div>'
    +'<div style="margin-top:10px"><h4 style="font-size:13px;margin-bottom:6px">'+(th?'รายการที่เกินเวลา':'Breaches')+'</h4>'
    + (breach.length ? '<div style="display:flex;flex-direction:column;gap:8px">'+breach.slice(0,15).map(function(w){
        return fmCard('<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--font-heading);font-size:13px">'+esc(w.id)+'</span>'+fmChip((w.responseTime||0)+' '+(th?'นาที':'min'),'red')+'</div>'+'<div style="font-size:11px;color:var(--color-neutral-700)">'+esc((WR_PRIORITY_MAP[w.priority]||[w.priority])[th?0:1])+' · '+(th?'เป้าหมาย ':'target ')+(SLA_TARGETS_MIN[w.priority]||480)+' '+(th?'นาที':'min')+'</div>');
      }).join('')+'</div>' : fmEmpty(th?'ไม่มีการเกินเวลา':'No breaches'));
}

function wrRepeated(){
  const th = ST.lang==='th';
  const wr = fmDB('wr');
  const byAsset = {};
  wr.forEach(function(w){ if(!w.assetId) return; (byAsset[w.assetId]=byAsset[w.assetId]||[]).push(w); });
  const repeated = Object.keys(byAsset).map(function(k){ return {assetId:k, items:byAsset[k]}; }).filter(function(x){return x.items.length>=2;}).sort(function(a,b){return b.items.length-a.items.length;});
  const totalCost = repeated.reduce(function(s,r){ return s + r.items.reduce(function(ss,w){return ss+(w.totalCost||0);},0); },0);
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    + statCard(th?'Asset ซ่อมซ้ำ':'Repeated Assets', repeated.length) + statCard(th?'WR ซ้ำทั้งหมด':'Total Repeat WR', repeated.reduce(function(s,r){return s+r.items.length;},0))
    +'</div><div style="margin-top:2px">'+statCard(th?'มูลค่าซ่อมสะสม':'Cumulative Repair Cost', fmMoney(totalCost))+'</div>'
    +'<div style="font-size:11px;color:var(--color-neutral-700);margin:8px 0">'+(th?'Asset ที่ซ่อมซ้ำ ≥ 2 ครั้ง → แนะนำสร้างแผน PM':'Assets repaired ≥ 2 times → recommend creating a PM plan')+'</div>'
    + (repeated.length ? '<div style="display:flex;flex-direction:column;gap:8px">'+repeated.map(function(r){
        return fmCard('<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--font-heading);font-size:13px">'+esc(r.assetId)+'</span>'+fmChip(r.items.length+'x','red')+'</div>'+'<div style="font-size:11px;color:var(--color-neutral-700)">'+(th?'มูลค่ารวม ':'total cost ')+fmMoney(r.items.reduce(function(s,w){return s+(w.totalCost||0);},0))+'</div>');
      }).join('')+'</div>' : fmEmpty(th?'ยังไม่พบการซ่อมซ้ำ':'No repeated repairs found'));

function wrHistory(){

    +'<div><h4 style="font-size:14px;margin-bottom:8px">'+t.mvTitle+'</h4>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
      + statCard(t.mvKwh, '9.90M') + statCard(t.mvAc, '53.6%') + statCard(t.mvSaving, '351,973') + statCard(t.mvSheets, '47')
    +'</div></div></div>';
}

function screenModuleAdvisory(){
  const t = L(); const mods = opsModules(); const m = mods.find(function(x){return x.key==='advisory';});
  const items = [
    { code:'01', name:t.advM1, d:t.advM1d },
    { code:'02', name:t.advM2, d:t.advM2d },
    { code:'03', name:t.advM3, d:t.advM3d },
  ];
  return '<div class="stack">'
    + modHeader(m.name, 'advisory')
    +'<div style="font-size:12px;color:var(--color-neutral-700);margin-bottom:4px">'+t.advTitle+'</div>'
    +'<div style="display:flex;flex-direction:column;gap:10px">'
    + items.map(function(it){
      return '<div class="blueprint" style="padding:12px;display:flex;gap:12px;align-items:center"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>'
        +'<div style="width:36px;height:36px;border:1px solid var(--color-divider);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:12px;color:var(--color-accent-700);flex-shrink:0">'+it.code+'</div>'
        +'<div><div style="font-family:var(--font-heading);font-size:14px">'+esc(it.name)+'</div><div style="font-size:11px;color:var(--color-neutral-700)">'+esc(it.d)+'</div></div></div>';
    }).join('')
    +'</div></div>';
}

function screenModuleBOT(){
  const t = L(); const mods = opsModules(); const m = mods.find(function(x){return x.key==='bot';});
  return '<div class="stack">'
    + modHeader(m.name, 'bot')
    +'<div class="blueprint" style="padding:22px;text-align:center"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>'
    +'<div style="font-family:var(--font-heading);font-size:16px;margin-bottom:6px">'+t.comingSoon+'</div>'
    +'<div style="font-size:12px;color:var(--color-neutral-700)">'+t.botDesc+'</div></div></div>';
}

function screenModuleDetail(){
  const key = ST.activeModule;
  if(key==='fm') return screenModuleFM();
  if(key==='iot') return screenModuleIoT();
  if(key==='mv') return screenModuleMV();
  if(key==='advisory') return screenModuleAdvisory();
  if(key==='bot') return screenModuleBOT();
  return '';
}

/* ============== main app frame ============== */
function screenMain(){
  let inner = '';
  if(ST.tab === 'home') inner = screenHome();
  else if(ST.tab === 'ops') inner = screenOpsList();
  else if(ST.tab === 'lifestyle') inner = screenLifestyle();
  else if(ST.tab === 'profile') inner = screenProfile();
  return screenMainWithBody(inner);
}
function screenMainWithBody(inner){
  const t = L();
  return '<div style="display:flex;flex-direction:column;min-height:100vh">'
    +'<div class="topbar">'
    +'<div class="brand">iMATOMs</div>'
    +'<div style="display:flex;align-items:center;gap:10px">'
    +'<div class="icon-btn tap" data-act="logout" title="'+t.signOut+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-700)" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg></div>'
    + segLangHtml()
    +'</div></div>'
    +'<div class="view-body">'+inner+'</div>'
    +'<div class="tabbar">'
    +'<div class="tabitem tap '+(ST.tab==='home'?'active':'')+'" data-act="tab-home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg><span>'+t.navHome+'</span></div>'
    +'<div class="tabitem tap '+(ST.tab==='ops'?'active':'')+'" data-act="tab-ops"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="8" height="8"></rect><rect x="13" y="3" width="8" height="8"></rect><rect x="3" y="13" width="8" height="8"></rect><rect x="13" y="13" width="8" height="8"></rect></svg><span>'+t.navOps+'</span></div>'
    +'<div class="tabitem tap '+(ST.tab==='lifestyle'?'active':'')+'" data-act="tab-lifestyle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h13v6a5 5 0 01-5 5H8a5 5 0 01-5-5V8z"></path><path d="M16 8h3a2 2 0 012 2v1a2 2 0 01-2 2h-3"></path><path d="M7 2v2M11 2v2"></path></svg><span>'+t.navLifestyle+'</span></div>'
    +'<div class="tabitem tap '+(ST.tab==='profile'?'active':'')+'" data-act="tab-profile"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path></svg><span>'+t.navProfile+'</span></div>'
    +'</div></div>';
}

/* ============== render + events ============== */
function render(){
  let html = '';
  if(ST.screen === 'login') html = screenLogin();
  else if(ST.screen === 'splash') html = screenSplash();
  else if(ST.screen === 'module') html = screenMainWithBody(screenModuleDetail());
  else html = screenMain();
  document.getElementById('app-root').innerHTML = html;
  bindFormHandlers();
  document.documentElement.lang = ST.lang;
}

function bindFormHandlers(){
  const lf = document.getElementById('login-form');
  if(lf) lf.addEventListener('submit', onLoginSubmit);
  const rf = document.getElementById('register-form');
  if(rf) rf.addEventListener('submit', onRegisterSubmit);
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.getAttribute('data-act');
  if(act==='lang-th') setLang('th');
  else if(act==='lang-en') setLang('en');
  else if(act==='toggle-pw'){ ST.showPassword = !ST.showPassword; render(); }
  else if(act==='to-register'){ ST.authMode='register'; ST.regMsg=''; render(); }
  else if(act==='to-login'){ ST.authMode='login'; ST.loginMsg=''; render(); }
  else if(act==='splash-th'){ ST.lang='th'; try{localStorage.setItem(LS.lang,'th');}catch(err){} ST.screen='main'; render(); }
  else if(act==='splash-en'){ ST.lang='en'; try{localStorage.setItem(LS.lang,'en');}catch(err){} ST.screen='main'; render(); }
  else if(act==='tab-home'){ ST.tab='home'; ST.screen='main'; ST.activeModule=null; render(); if(!ST.dash) loadDashboard(); }
  else if(act==='tab-ops'){ ST.tab='ops'; ST.screen='main'; ST.activeModule=null; render(); }
  else if(act==='tab-lifestyle'){ ST.tab='lifestyle'; ST.screen='main'; ST.activeModule=null; render(); }
  else if(act==='tab-profile'){ ST.tab='profile'; ST.screen='main'; ST.activeModule=null; render(); }
  else if(act==='open-module'){ const key = el.getAttribute('data-key'); ST.activeModule = key; ST.fromTab = ST.tab; ST.screen = 'module'; if(key==='fm'){ ST.fmSub='overview'; ST.wrSub='overview'; } render(); loadModuleData(key); }
  else if(act==='module-back'){ ST.screen = 'main'; ST.tab = ST.fromTab || 'ops'; ST.activeModule = null; render(); }
  else if(act==='open-full-app'){ e.preventDefault(); const key = el.getAttribute('data-key'); const url = MODULE_URLS[key]; if(url) window.location.href = url; }
  else if(act==='retry-module'){ const key = el.getAttribute('data-key'); loadModuleData(key); }
  else if(act==='fm-sub'){ ST.fmSub = el.getAttribute('data-sub'); if(ST.fmSub!=='wr') ST.wrSub='overview'; render(); }
  else if(act==='wr-sub'){ ST.wrSub = el.getAttribute('data-sub'); render(); }
  else if(act==='lifestyle-market'){ ST.lifestyleSub='market'; render(); }
  else if(act==='lifestyle-coffee'){ ST.lifestyleSub='coffee'; render(); }
  else if(act==='goto-market'){ window.location.href = '/TKO_IsanFoodMarket/'; }
  else if(act==='goto-coffee'){ window.location.href = '/TKO_MeeHangCoffee/'; }
  else if(act==='logout'){ doLogout(); }
});

/* ============== auth actions ============== */
async function onLoginSubmit(e){
  e.preventDefault();
  const user = document.getElementById('li-user').value.trim();
  const pass = document.getElementById('li-pass').value;
  ST.loginBusy = true; ST.loginMsg=''; ST.loginErr=false; render();
  try{
    const data = await api('/auth/login', { method:'POST', body: JSON.stringify({ username:user, password:pass }) });
    setSession(data.token, data.refresh_token, data.user);
    ST.loginBusy=false; ST.loginErr=false; ST.loginMsg = (ST.lang==='th'?'ยินดีต้อนรับ ':'Welcome, ') + (data.user.full_name||data.user.username);
    setTimeout(function(){ ST.screen='splash'; render(); }, 350);
  }catch(err){
    ST.loginBusy=false; ST.loginErr=true; ST.loginMsg = err.message || (ST.lang==='th'?'เข้าสู่ระบบไม่สำเร็จ':'Login failed'); render();
  }
}
async function onRegisterSubmit(e){
  e.preventDefault();
  const body = {
    full_name: document.getElementById('rg-name').value.trim(),
    email: document.getElementById('rg-email').value.trim(),
    username: document.getElementById('rg-user').value.trim(),
    password: document.getElementById('rg-pass').value,
  };
  ST.regBusy = true; ST.regMsg=''; ST.regErr=false; render();
  try{
    await api('/auth/register', { method:'POST', body: JSON.stringify(body) });
    ST.regBusy=false; ST.regErr=false; ST.regMsg = ST.lang==='th' ? 'ส่งคำขอสำเร็จ กรุณารอการอนุมัติจากผู้ดูแลระบบ' : 'Request submitted — please wait for administrator approval.';
    render();
  }catch(err){
    ST.regBusy=false; ST.regErr=true; ST.regMsg = err.message || (ST.lang==='th'?'ส่งคำขอไม่สำเร็จ':'Request failed'); render();
  }
}
async function doLogout(){
  try{ await api('/auth/logout', { method:'POST', body: JSON.stringify({ refresh_token: localStorage.getItem(LS.refresh) }) }); }catch(e){}
  clearSession();
  ST.screen='login'; ST.tab='home'; ST.authMode='login'; ST.dash=null;
  render();
}

/* ============== data loads ============== */
async function loadDashboard(){
  try{ ST.dash = await api('/dashboard'); render(); }catch(err){ /* non-fatal */ }
}

/* light per-module data fetch — FM/M&V reuse the shared dashboard;
   only IoT needs its own call (bas.imatomstech.com sensor gateway). */
async function loadModuleData(key){
  if(key==='fm'){ return; } /* FM reads live from shared localStorage — no fetch needed */
  if(key==='iot'){
    ST.modLoading.iot = true; ST.modData.iot = {}; render();
    try{
      const res = await fetch('https://bas.imatomstech.com/api/sensor');
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data && data.devices) || (data ? [data] : []);
      ST.modData.iot = { devices: list };
    }catch(err){
      ST.modData.iot = { __error: true };
    }
    ST.modLoading.iot = false; render();
    return;
  }
  /* mv / advisory / bot are static-summary screens for now — no fetch needed */
}

/* ============== boot ============== */
(function boot(){
  render();
  if(ST.screen === 'main') loadDashboard();
})();
</script>
